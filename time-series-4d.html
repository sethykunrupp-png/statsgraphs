<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Time Series in 4D</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
    /* Layout: full-screen 3D stage, story panel (with the live formula) top-left, step bar along the bottom. Single dark look by design. */
    :root {
        --bg: #050510;
        --cyan: #00ffff;
        --amber: #ffb454;
        --ink: #e9f6ff;
        --muted: #8fb3c7;
        --panel: rgba(4, 8, 22, 0.78);
        --line: rgba(0, 255, 255, 0.35);
        color-scheme: dark;
    }
    html, body { height: 100%; }
    body { margin: 0; overflow: hidden; background: var(--bg); color: var(--ink);
           font-family: 'IBM Plex Sans', 'Segoe UI', system-ui, sans-serif; font-variant-numeric: tabular-nums; }
    canvas { display: block; position: fixed; inset: 0; touch-action: none; }

    #ui { position: absolute; top: calc(16px + env(safe-area-inset-top, 0px)); left: 16px;
          width: min(410px, calc(100% - 32px)); box-sizing: border-box;
          background: var(--panel); padding: 14px 16px 15px; border-radius: 10px;
          border: 1px solid var(--line); box-shadow: 0 0 24px rgba(0,255,255,0.12);
          backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
          pointer-events: none; z-index: 10; }
    #chapter { font-size: 12px; color: var(--muted); margin-bottom: 4px; letter-spacing: 0.04em; text-transform: uppercase; }
    #status { font-size: clamp(18px, 2.6vw, 23px); font-weight: 600; line-height: 1.2; margin-bottom: 7px;
              color: var(--cyan); text-shadow: 0 0 12px rgba(0,255,255,0.55); text-wrap: balance; }
    #note { font-size: 13.5px; line-height: 1.5; opacity: 0.92; }
    #mathrow { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; margin-top: 9px; padding-top: 9px;
               border-top: 1px solid rgba(0,255,255,0.18); }
    #formula { display: flex; align-items: center; gap: 7px; font-family: Georgia, 'Times New Roman', serif; font-style: italic; font-size: 21px; flex: none; }
    #formula .frac { display: inline-flex; flex-direction: column; align-items: center; }
    #formula .top { padding: 0 6px 2px; border-bottom: 1.5px solid var(--ink); }
    #formula .bot { padding-top: 1px; }
    #formula .bar { text-decoration: overline; }
    #formula .p { opacity: 0.3; transition: opacity 0.4s, color 0.4s, text-shadow 0.4s; }
    #formula .p.on { opacity: 1; color: var(--amber); text-shadow: 0 0 10px rgba(255,180,84,0.6); }
    #formula .sym { opacity: 0.6; font-style: normal; }
    #stats { font-size: 13.5px; line-height: 1.5; font-weight: 500; color: var(--amber); flex: 1 1 150px; min-width: 0; }
    #stats .dim { color: var(--muted); font-weight: 400; }
    #error { color: #ff5c5c; font-weight: 600; font-size: 13px; }
    #error:empty { display: none; }

    #labels { position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 5; }
    .lb { position: absolute; left: 0; top: 0; white-space: nowrap; font-size: 13px; font-weight: 500;
          color: var(--ink); text-shadow: 0 0 4px #050510, 0 0 8px #050510, 0 1px 2px #050510; will-change: transform, opacity; }
    .lb.tick { font-size: 11px; color: var(--muted); font-weight: 400; }
    .lb.eq { color: var(--amber); font-weight: 600; font-size: 14px; }
    .lb.key { color: var(--cyan); font-weight: 600; font-size: 15px; }

    #bar { position: absolute; left: 0; right: 0; bottom: 0; z-index: 10;
           padding: 10px 16px calc(12px + env(safe-area-inset-bottom, 0px));
           background: linear-gradient(to top, rgba(5,5,16,0.92), rgba(5,5,16,0)); }
    #progress { display: flex; gap: 3px; margin-bottom: 8px; }
    #progress button { flex: 1; height: 18px; padding: 6px 0; margin: 0; border: 0; background: none; cursor: pointer; }
    #progress button span { display: block; height: 4px; border-radius: 2px; background: rgba(0,255,255,0.16); overflow: hidden; }
    #progress button i { display: block; height: 100%; width: 0; background: var(--cyan); box-shadow: 0 0 8px var(--cyan); }
    #progress button:hover span { background: rgba(0,255,255,0.32); }
    #controls { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    #controls button { width: 40px; height: 34px; border-radius: 8px; border: 1px solid var(--line);
                       background: var(--panel); color: var(--cyan); cursor: pointer; display: grid; place-items: center; }
    #controls button:hover { background: rgba(0,255,255,0.14); }
    button:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }
    #controls svg { width: 14px; height: 14px; fill: currentColor; }
    #hint { font-size: 12px; color: var(--muted); margin-left: 6px; }
    @media (max-width: 560px) {
        #ui { padding: 10px 12px 11px; }
        #note { font-size: 12.5px; line-height: 1.4; }
        #mathrow { margin-top: 6px; padding-top: 6px; gap: 10px; }
        #formula { font-size: 17px; }
        #stats { font-size: 12.5px; }
        #hint { display: none; }
    }
    #tbl { position: absolute; top: calc(16px + env(safe-area-inset-top, 0px)); right: 16px; width: min(430px, calc(100% - 32px)); max-height: calc(100% - 140px); overflow: auto; box-sizing: border-box;
           background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; z-index: 9; font-size: 13px; backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); box-shadow: 0 0 24px rgba(0,255,255,0.12); }
    #tbl .cap { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.04em; margin-bottom: 8px; }
    #tbl table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
    #tbl th { color: var(--cyan); font-weight: 600; text-align: right; padding: 3px 6px; border-bottom: 1px solid rgba(0,255,255,0.25); white-space: nowrap; }
    #tbl td { text-align: right; padding: 3px 6px; white-space: nowrap; transition: background 0.3s, color 0.3s, opacity 0.3s; }
    #tbl th:first-child, #tbl td:first-child { color: var(--cyan); font-weight: 600; }
    #tbl tr.hid td { opacity: 0; }
    #tbl tr.hl td { background: rgba(255,180,84,0.2); color: #fff; }
    #tbl td.rh { background: rgba(0,255,255,0.13); }
    #tbl td.ce { background: var(--amber); color: #04121c; font-weight: 700; }
    @media (max-width: 760px) { #tbl { top: auto; bottom: calc(84px + env(safe-area-inset-bottom, 0px)); left: 16px; right: 16px; width: auto; max-height: 30vh; font-size: 11.5px; padding: 8px 10px; } }
    @media (min-width: 761px) { #tbl { width: min(380px, calc(100% - 32px)); font-size: 12px; } }
</style></head><body>

<div id="labels"></div>

<div id="ui">
    <div id="chapter"></div>
    <div id="status"></div>
    <div id="note"></div>
    <div id="mathrow">
        <div id="formula" aria-label="y equals trend plus seasonal plus residual">
            <span class="p" id="fY">y<sub style="font-size:.55em">t</sub></span><span class="sym">=</span><span class="p" id="fT">T<sub style="font-size:.55em">t</sub></span> <span class="sym">+</span> <span class="p" id="fS">S<sub style="font-size:.55em">t</sub></span> <span class="sym">+</span> <span class="p" id="fE">e<sub style="font-size:.55em">t</sub></span>
        </div>
        <div id="stats"></div>
    </div>
    <div id="error"></div>
</div>

<div id="tbl"></div>

<div id="bar">
    <div id="progress"></div>
    <div id="controls">
        <button id="bPrev" title="Previous step" aria-label="Previous step"><svg viewBox="0 0 14 14"><path d="M2 1h2v12H2zM13 1v12L5 7z"/></svg></button>
        <button id="bPlay" title="Play or pause" aria-label="Play or pause"><svg viewBox="0 0 14 14"><path id="playIcon" d="M3 1h3v12H3zM8 1h3v12H8z"/></svg></button>
        <button id="bNext" title="Next step" aria-label="Next step"><svg viewBox="0 0 14 14"><path d="M10 1h2v12h-2zM1 1v12l8-6z"/></svg></button>
        <button id="bRestart" title="Start again" aria-label="Start again"><svg viewBox="0 0 14 14"><path d="M7 2a5 5 0 1 0 4.9 6h-1.6A3.5 3.5 0 1 1 7 3.5c1 0 1.8.4 2.4 1L7.5 6.5H12V2l-1.5 1.5A5 5 0 0 0 7 2z"/></svg></button>
        <span id="hint">Drag to rotate · scroll to zoom · ← → to step · space to pause</span>
    </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
(function () {

    var num = function (x, dp) { return x.toFixed(dp === undefined ? 1 : dp); };
    var sgn = function (d, dp) { var t = Math.abs(d).toFixed(dp === undefined ? 2 : dp); return (d > 0 && +t !== 0 ? '+' : d < 0 && +t !== 0 ? '−' : '') + t; };

    var XB = '<span style="text-decoration:overline">X</span>';

    // ---------- time series: trend, season, decomposition, autocorrelation, forecasting ----------
    var STEPS = [
        {
                "t": "A series in time order",
                "n": "Monthly tax revenue for four years. Each tower is one month. Unlike a cross-section, the order is the information: you cannot shuffle the months.",
                "s": "",
                "on": [
                        "fY"
                ]
        },
        {
                "t": "The line plot",
                "n": "Join the tops in order. The eye picks up two things at once: a slow climb, and a pattern that repeats every year.",
                "s": "",
                "on": [
                        "fY"
                ]
        },
        {
                "t": "Smooth it: the moving average",
                "n": "Average each month with the 6 months before and after (a centred 12-month average). Each average covers a full year, so the seasonal ups and downs cancel and the underlying level shows.",
                "s": "",
                "on": [
                        "fT"
                ]
        },
        {

                "n": "A straight line through time gives the trend: the average change per month. Here revenue grows steadily.",
                "s": "T = b₀ + b₁t",
                "on": [
                        "fT"

        {

                "n": "Subtract the trend from each month. What is left swings above and below zero in the same pattern every year: the seasonal component.",

                "on": [
                        "fS"

        {

                "on": [
                        "fS"

                "n": "Split the series into layers: trend, seasonal and the residual left over. Adding the layers back gives the original series exactly.",

                "on": [
                        "fY",
                        "fT",
                        "fS",
                        "fE"
                ]
        },
        {
                "t": "The residual",
                "n": "The residual is what trend and season cannot explain. It should look like random noise: no trend, no repeating pattern.",
                "s": "",
                "on": [
                        "fE"
                ]

        {
                "t": "Seasonally adjusted series",
                "n": "Subtract only the seasonal factors. The adjusted series (green) shows the underlying movement month by month, so a rise in December is not mistaken for real growth.",
                "s": "",
                "on": [
                        "fY",
                        "fS"
                ]
        },
        {
                "t": "Autocorrelation: compare with the past",
                "n": "Lay a copy of the series shifted by k months on top of the original. Shifted by 1 month the two do not match well; shifted by 12 the peaks line up. The correlation at each shift is the autocorrelation at lag k.",
                "s": "",
                "on": [
                        "fY"
                ]
        },
        {
                "t": "The correlogram",
                "n": "Plot the autocorrelation for lags 1 to 24. The white band is ±1.96 ÷ √n: bars beyond it are significant. Big spikes at lags 12 and 24 reveal the yearly season.",
                "s": "",
                "on": [
                        "fY"
                ]
        },
        {
                "t": "Correlogram of the residuals",
                "n": "After removing trend and season, the residual bars sit almost entirely inside the band. That is white noise: the model has captured the structure.",
                "s": "",
                "on": [
                        "fE"
                ]
        },
        {
                "t": "Forecasting",
                "n": "Extend the trend and add the seasonal factor for each future month. The bars show a rough 95% range from the residual spread. Uncertainty grows further ahead.",

                "on": [
                        "fT",
                        "fS"
                ]
        },
        {
                "t": "Growth rates: which comparison?",
                "n": "Month-on-month change mixes growth with the season (December always jumps). Year-on-year change compares the same month a year apart, so the season cancels.",
                "s": "",
                "on": [
                        "fY"
                ]
        },
        {
                "t": "Cautions",
                "n": "Check for breaks (a new tax law, a crisis), moving holidays and outliers before modelling. Two series that both trend can look related when they are not: compare changes or residuals instead.",
                "s": "",
                "on": [
                        "fY",
                        "fT",
                        "fS",
                        "fE"
                ]
