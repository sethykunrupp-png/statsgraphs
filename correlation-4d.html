<style>
    /* Layout: full-screen 3D stage, story panel (with the live formula) top-left, step bar along the bottom. Single dark look by design. */

           padding: 10px 16px calc(12px + env(safe-area-inset-bottom, 0px));
           background: linear-gradient(to top, rgba(5,5,16,0.92), rgba(5,5,16,0)); }

           background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; z-index: 9; font-size: 13px; backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); box-shadow: 0 0 24px rgba(0,255,255,0.12); }

    #tbl .hc { opacity: 0; }
    #tbl tr.tot td { border-top: 1px solid rgba(0,255,255,0.3); color: var(--amber); font-weight: 600; }
</style></head><body>

<div id="tbl"></div>

<div id="bar">

        <button id="bPrev" title="Previous step" aria-label="Previous step"><svg viewBox="0 0 14 14"><path d="M2 1h2v12H2zM13 1v12L5 7z"/></svg></button>
        <button id="bPlay" title="Play or pause" aria-label="Play or pause"><svg viewBox="0 0 14 14"><path id="playIcon" d="M3 1h3v12H3zM8 1h3v12H8z"/></svg></button>
        <button id="bNext" title="Next step" aria-label="Next step"><svg viewBox="0 0 14 14"><path d="M10 1h2v12h-2zM1 1v12l8-6z"/></svg></button>
        <button id="bRestart" title="Start again" aria-label="Start again"><svg viewBox="0 0 14 14"><path d="M7 2a5 5 0 1 0 4.9 6h-1.6A3.5 3.5 0 1 1 7 3.5c1 0 1.8.4 2.4 1L7.5 6.5H12V2l-1.5 1.5A5 5 0 0 0 7 2z"/></svg></button>
        <span id="hint">Drag to rotate · scroll to zoom · ← → to step · space to pause</span>
    </div>
</div>

                "on": []

        {

                "n": "Draw a line at the mean of x and another at the mean of y. They cross at the centre of the cloud and split the picture into four quadrants.",

                "on": [

        var t4 = new THREE.Mesh(tickGeoH, mat('#ffb454')); t4.position.set(fx0, ZWY(v), 0); scene.add(t4); zT.push({ m: t4, lb: label((v > 0 ? '+' : v < 0 ? '−' : '') + Math.abs(v), fx0 - 1.0, ZWY(v), 0, 'key') });
    }
    var lbX = label('x: hours of study', fx1 + 0.2, fy0, 0, 'key', true), lbY = label('y: test score', fx0, fy1 + 0.45, 0, 'key');

    // ----- points, mean cross, quadrants, rectangles -----
    var sph = new THREE.SphereGeometry(0.2, 18, 12), pts = [], rects = [], plane = new THREE.PlaneGeometry(1, 1);
    for (var i = 0; i < N; i++) {
        var p = new THREE.Mesh(sph, mat(COL[i])); scene.add(p); pts.push(p);
        var rb = box(POS, 0.3, true); rb.visible = false; rects.push(rb);
    }
    var mxL = post('#00ffff', 1), myL = bar('#00ffff', 1);
    var quads = [0, 1, 2, 3].map(function (q) { var m = new THREE.Mesh(plane, mat(q === 0 || q === 2 ? POS : NEG, 0)); m.position.z = -0.08; scene.add(m); return m; });
    var lbQ = [label('+ × + = +', 0, 0, 0, ''), label('− × + = −', 0, 0, 0, ''), label('− × − = +', 0, 0, 0, ''), label('+ × − = −', 0, 0, 0, '')];
    lbQ[0].el.style.color = lbQ[2].el.style.color = POS; lbQ[1].el.style.color = lbQ[3].el.style.color = '#7fe0ff';
    var lbMx = label('', 0, fy0 - 0.45, 0.1, 'key'), lbMy = label('', fx1 + 0.2, 0, 0.1, 'key', true);
    var lbTP = label('', -7.9, 0, 1.4, ''), lbTN = label('', -5.9, 0, 1.4, ''), lbSum = label('', -6.9, 0, 1.4, 'key');
    lbTP.el.style.color = POS; lbTN.el.style.color = '#7fe0ff';
    // r gauge
    var gL = -4, gR = 4, gY = -1.7, gauge = bar('#3c6d80', 1.2), gMark = post('#ffffff', 2.2), gFill = bar(POS, 1.6);
    var lbG = [label('−1', gL, gY - 0.5, 0, 'tick'), label('0', 0, gY - 0.5, 0, 'tick'), label('+1', gR, gY - 0.5, 0, 'tick')], lbR = label('', 0, gY + 0.55, 0.2, 'key');
    lbR.el.style.fontSize = '18px';

    function update() {
        var i;
        // ----- live data -----
        var y = YB.slice();
        var w9 = [ph(9.1, 9.35), ph(9.4, 9.65), ph(9.7, 9.92)], back10 = ph(10.02, 10.12), out = ph(10.2, 10.75) * (1 - ph(11.0, 11.08)), uu = ph(11.15, 11.6) * (1 - ph(12.02, 12.15));
        for (i = 0; i < N; i++) {
            var yy = lerp(lerp(lerp(YB[i], YP[i], w9[0]), YC[i], w9[1]), YN[i], w9[2]);
            yy = lerp(yy, YB[i], back10);
            if (i === N - 1) yy = lerp(yy, 1.5, out);
            y[i] = lerp(yy, YU[i], uu);
        }
        var s = stats(PX, y), zf = ph(7.1, 7.6) * (1 - ph(9.02, 9.12)) + (T >= 9.12 ? 0 : 0);
        var unit10 = ph(6.15, 6.35) * (1 - ph(6.95, 7.05));
        var WX = function (xv) { return lerp(RWX(xv), ZWX((xv - s.mx) / s.sx), zf); }, WY = function (yv) { return lerp(RWY(yv), ZWY((yv - s.my) / s.sy), zf); };

        // points
        for (i = 0; i < N; i++) { var a = ph(0.05 + i * 0.08, 0.2 + i * 0.08); pts[i].scale.setScalar(Math.max(a, 0.001)); pts[i].visible = a > 0; pts[i].position.set(WX(PX[i]), WY(y[i]), 0.05); }
        // ticks: raw or z
        rawT.forEach(function (t) { t.m.visible = zf < 0.98; t.m.material.opacity = 1 - zf; t.lb.a = 0.85 * (1 - zf); setText(t.lb, String(t.ax === 'y' && unit10 > 0.5 ? t.v * 10 : t.v)); });
        zT.forEach(function (t) { t.m.visible = zf > 0.02; t.m.material.opacity = zf; t.lb.a = zf; });
        lbX.a = lbY.a = 1; setText(lbX, zf > 0.5 ? 'z of x' : 'x: hours of study'); setText(lbY, zf > 0.5 ? 'z of y' : unit10 > 0.5 ? 'y: score × 10' : 'y: test score');
        // mean cross
        var mc = ph(1.1, 1.45), cx = WX(s.mx), cy = WY(s.my);
        setPost(mxL, cx, 0, (fy1 - fy0) * mc, fy0); setBar(myL, fx0, cy, 0, (fx1 - fx0) * mc);
        lbMx.p.x = cx; lbMx.a = mc * (1 - zf); setText(lbMx, 'x̄ = ' + s.mx.toFixed(1)); lbMy.p.y = cy; lbMy.a = mc * (1 - zf); setText(lbMy, 'ȳ = ' + (s.my * (unit10 > 0.5 ? 10 : 1)).toFixed(1));
        // quadrants
        var qa = ph(2.1, 2.4) * (1 - 0.6 * ph(3.0, 3.2)) * (1 - ph(9.02, 9.1));
        var qx = [[cx, fx1], [fx0, cx], [fx0, cx], [cx, fx1]], qy = [[cy, fy1], [cy, fy1], [fy0, cy], [fy0, cy]];
        for (i = 0; i < 4; i++) { var w = Math.max(qx[i][1] - qx[i][0], 0.01), h = Math.max(qy[i][1] - qy[i][0], 0.01); quads[i].scale.set(w, h, 1); quads[i].position.set(qx[i][0] + w / 2, qy[i][0] + h / 2, -0.08); quads[i].material.opacity = 0.16 * qa; quads[i].visible = qa > 0; lbQ[i].p.set(qx[i][0] + w / 2, qy[i][0] + h / 2, 0); lbQ[i].a = ph(2.3, 2.5) * (1 - ph(3.0, 3.1)); }

        // rectangles and towers
        var ra = ph(3.1, 3.6);
        var tw = ph(5.15, 5.6) * (1 - ph(5.9, 6.0)) + ph(8.15, 8.6) * (1 - ph(8.95, 9.05)), K = lerp(0.07, 0.55, zf);
        var hp = 0, hn = 0, sumP = 0, sumZ = 0;
        for (i = 0; i < N; i++) {
            var dx = PX[i] - s.mx, dy = y[i] - s.my, prod = dx * dy, zp = (dx / s.sx) * (dy / s.sy), val = lerp(prod, zp, zf), hh = Math.abs(val) * K, pos = val >= 0;
            sumP += prod; sumZ += zp;
            var x0 = Math.min(cx, WX(PX[i])), y0 = Math.min(cy, WY(y[i])), rw = Math.max(Math.abs(WX(PX[i]) - cx), 0.01), rh = Math.max(Math.abs(WY(y[i]) - cy), 0.01);
            var tx = pos ? -8.4 : -6.4, ty = pos ? hp : hn; if (pos) hp += hh; else hn += hh;
            var rb = rects[i]; rb.visible = cl(ra) > 0 && rw * rh > 0.0004; rb.material.color.set(pos ? POS : NEG); rb.material.opacity = 0.32 * cl(ra) + 0.4 * tw;
            rb.scale.set(lerp(rw, 1, tw), lerp(rh, Math.max(hh, 0.01), tw), lerp(0.03, 1, tw));
            rb.position.set(lerp(x0, tx, tw), lerp(y0, ty, tw) + Math.sin(Math.PI * tw) * 1.5, lerp(-0.02, 0.6, tw));
        }
        lbTP.p.y = hp + 0.5; lbTN.p.y = hn + 0.5; lbTP.a = lbTN.a = lbSum.a = ph(5.55, 5.65) * (1 - ph(5.9, 5.95)) + ph(8.55, 8.65) * (1 - ph(8.95, 9.0));
        var mult = unit10 > 0.5 ? 10 : 1;
        setText(lbTP, 'positive: ' + f2(T < 8 ? hp / 0.07 * mult : hp / 0.55)); setText(lbTN, 'negative: ' + f2(-(T < 8 ? hn / 0.07 * mult : hn / 0.55)));
        lbSum.p.y = -0.8; setText(lbSum, T < 8 ? 'sum = ' + f2(sumP) + ' → ÷ 7 = covariance ' + f2(s.cov) : 'sum = ' + f2(sumZ) + ' → ÷ 7 = r = ' + f2(s.r));

        // table
        var cols = step < 4 ? 2 : step < 8 ? 5 : 6;
        for (i = 0; i < N; i++) {
            var c = trs[i].children, dxx = PX[i] - s.mx, dyy = y[i] - s.my;
            setCell(c[0], String(PX[i])); setCell(c[1], (y[i] * mult).toFixed(Math.abs(y[i] - Math.round(y[i])) < 0.01 ? 0 : 1)); setCell(c[2], f2(dxx)); setCell(c[3], f2(dyy * mult)); setCell(c[4], f2(dxx * dyy * mult)); setCell(c[5], f2(dxx / s.sx * dyy / s.sy));
            for (var j = 0; j < 6; j++) { var k = j >= cols ? 'hc' : ''; if (c[j].className !== k) c[j].className = k; }
            var rc = ph(0.05 + i * 0.08, 0.2 + i * 0.08) > 0 ? '' : 'hid'; if (trs[i].className !== rc) trs[i].className = rc;
        }
        var tc = trs[N].children; setCell(tc[4], f2(sumP * mult)); setCell(tc[5], f2(sumZ));
        for (j = 0; j < 6; j++) { var k2 = j >= cols ? 'hc' : ''; if (tc[j].className !== k2) tc[j].className = k2; if (ths[j].className !== k2) ths[j].className = k2; }
        trs[N].className = step >= 4 ? 'tot' : 'tot hid';

        // r gauge
        var ga = ph(8.6, 8.8);
        setBar(gauge, gL, gY, 0, (gR - gL) * ga); setPost(gMark, s.r * gR, 0, 0.9 * ga, gY - 0.45);
        setBar(gFill, Math.min(0, s.r * gR), gY, 0.02, Math.abs(s.r * gR) * ga); gFill.material.color.set(s.r >= 0 ? POS : NEG);
        for (i = 0; i < 3; i++) lbG[i].a = 0.85 * ga; lbR.p.x = s.r * gR; lbR.a = ga; setText(lbR, 'r = ' + f2(s.r));

        if (step === 5) setStats('Σ products = ' + f2(sumP) + ' · covariance = ' + f2(sumP) + ' ÷ 7 = <b>' + f2(s.cov) + '</b>');
        else if (step === 6) setStats('covariance = <b>' + f2(s.cov * mult) + '</b> <span class="dim">(same picture, different units)</span>');
        else if (step >= 8) setStats('r = <b>' + f2(s.r) + '</b> · r² = ' + (s.r * s.r).toFixed(2));
    }

    // ---------- camera ----------
    var V = [[2, 4.6, 16.5], [1.6, 3.9, 0.2], -2.6], TW = [[-2.5, 6, 19], [-2, 3.0, 0.5], -1.5], G = [[1.2, 4.4, 19.5], [0.8, 3.1, 0], -2.6];
    var CAM = [V, V, V, V, V, TW, V, V, TW, G, G, G, G];
    var tw = null;
    function preset(s) {
        var p = new THREE.Vector3().fromArray(CAM[s][0]), tg = new THREE.Vector3().fromArray(CAM[s][1]);
        var kk = Math.min(2.8, Math.max(1, 1.55 / camera.aspect));
        var out = { p: tg.clone().add(p.sub(tg).multiplyScalar(kk)), t: tg };
        if (camera.aspect > 1.25) { var off = CAM[s][2] === undefined ? 2.2 : CAM[s][2]; out.p.x -= off; out.t.x -= off; }   // keep the wall clear of the story panel
        return out;
    }
    function flyTo(s, instant) {
        var d = preset(s);
        if (instant) { camera.position.copy(d.p); controls.target.copy(d.t); tw = null; return; }
        tw = { p0: camera.position.clone(), t0: controls.target.clone(), p1: d.p, t1: d.t, x: 0 };
    }
    controls.addEventListener('start', function () { tw = null; });

    // ---------- ui ----------
    var segs = [], parts = ["fR", "fS", "fZ", "fN"];
    STEPS.forEach(function (st, i) {
        var bt = document.createElement('button'); bt.title = (i + 1) + '. ' + st.t; bt.setAttribute('aria-label', 'Step ' + (i + 1) + ': ' + st.t);
        bt.innerHTML = '<span><i></i></span>'; bt.onclick = function () { go(i); };
        $('progress').appendChild(bt); segs.push(bt.querySelector('i'));
    });
    function showStep() {
        var st = STEPS[step];
        $('chapter').textContent = 'Step ' + (step + 1) + ' of ' + NS;
        $('status').textContent = st.t; $('note').textContent = st.n; $('stats').innerHTML = st.s;
        parts.forEach(function (id) { $(id).classList.toggle('on', st.on.indexOf(id) >= 0); });
    }
    function setPlay(p) {
        playing = p;
        $('playIcon').setAttribute('d', p ? 'M3 1h3v12H3zM8 1h3v12H8z' : 'M3 1v12l9-6z');
    }
    function go(s) { step = Math.max(0, Math.min(NS - 1, s)); u = 0; showStep(); flyTo(step); setPlay(true); }
    $('bPrev').onclick = function () { go(u > 0.15 || step === 0 ? step : step - 1); };
    $('bNext').onclick = function () { if (step < NS - 1) go(step + 1); else { u = 1; } };
    $('bRestart').onclick = function () { go(0); };
    $('bPlay').onclick = function () { if (!playing && step === NS - 1 && u >= 1) go(0); else setPlay(!playing); };
    window.addEventListener('keydown', function (e) {
        if (e.key === 'ArrowRight') $('bNext').onclick();
        else if (e.key === 'ArrowLeft') $('bPrev').onclick();
        else if (e.key === ' ' && e.target === document.body) { e.preventDefault(); $('bPlay').onclick(); }
    });

    function resize() {
        var w = window.innerWidth, h = window.innerHeight;
        renderer.setSize(w, h); camera.aspect = w / h; camera.updateProjectionMatrix();
    }
    window.addEventListener('resize', resize); resize();
    showStep(); setPlay(playing); flyTo(0, true);
    if (!playing) u = 1;      // reduced motion: show each step finished, advance by hand

    var v3 = new THREE.Vector3(), last = performance.now();
    function frame(now) {
        requestAnimationFrame(frame);
        var dt = Math.min(0.1, (now - last) / 1000); last = now; clock += dt;
        if (playing) {
            u += dt / (DUR + HOLD);
            if (u >= 1) { if (step < NS - 1) { step++; u = 0; showStep(); flyTo(step); } else { u = 1; setPlay(false); } }
        }
        T = step + Math.min(u * (DUR + HOLD) / DUR, 0.9999);
        update();
        if (tw) {
            tw.x = Math.min(1, tw.x + dt / 1.5); var e = tw.x * tw.x * (3 - 2 * tw.x);
            camera.position.lerpVectors(tw.p0, tw.p1, e); controls.target.lerpVectors(tw.t0, tw.t1, e);
            if (tw.x >= 1) tw = null;
        }
        controls.update();
        renderer.render(scene, camera);

        for (var i = 0; i < segs.length; i++) segs[i].style.width = (i < step ? 100 : i === step ? u * 100 : 0) + '%';
        var w = window.innerWidth, h = window.innerHeight;
        for (i = 0; i < labels.length; i++) {
            var lb = labels[i];
            v3.copy(lb.p).project(camera);
            var show = lb.a > 0.01 && v3.z < 1 && v3.z > -1;
            lb.el.style.opacity = show ? lb.a : 0;
            if (show) lb.el.style.transform = 'translate(' + ((v3.x + 1) / 2 * w).toFixed(1) + 'px,' + ((1 - v3.y) / 2 * h).toFixed(1) + 'px) translate(' + (lb.left ? '0' : '-50%') + ',-50%)';
        }
    }
    requestAnimationFrame(frame);
})();
</script>
