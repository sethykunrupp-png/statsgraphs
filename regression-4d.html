<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Regression in 4D</title>

<style>

               border-top: 1px solid rgba(0,255,255,0.18); }

    #formula .frac { display: inline-flex; flex-direction: column; align-items: center; }

    .lb.eq { color: var(--amber); font-weight: 600; font-size: 14px; }

           padding: 10px 16px calc(12px + env(safe-area-inset-bottom, 0px));

    #progress button span { display: block; height: 4px; border-radius: 2px; background: rgba(0,255,255,0.16); overflow: hidden; }
    #progress button i { display: block; height: 100%; width: 0; background: var(--cyan); box-shadow: 0 0 8px var(--cyan); }

    #controls button { width: 40px; height: 34px; border-radius: 8px; border: 1px solid var(--line);

        #formula { font-size: 17px; }
        #stats { font-size: 12.5px; }
        #hint { display: none; }
    }

        var sse = 0;
        for (i = 0; i < N; i++) {
            var a = ph(0.05 + i * 0.09, 0.22 + i * 0.09); pts[i].scale.setScalar(Math.max(a, 0.001)); pts[i].visible = a > 0; pts[i].position.set(X(PX[i]), YY(PX[i], py[i]), 0);
            var yh = fy(PX[i]), r = py[i] - yh, ar = Math.abs(r), rg = ph(2.1 + i * 0.1, 2.25 + i * 0.1), sg = ph(3.1 + i * 0.1, 3.3 + i * 0.1);
            sse += r * r;
            setPost(res[i], X(PX[i]), 0, Y(ar) * rg, YY(PX[i], Math.min(py[i], yh)));
            var side = Y(ar);
            sq[i].visible = sg > 0 && side > 0.01; sq[i].scale.set(1, Math.max(side, 0.001), Math.max(side * sg, 0.001)); sq[i].position.set(X(PX[i]), YY(PX[i], (py[i] + yh) / 2), side * sg / 2);
        }
        // the line
        var lg = ph(1.1, 1.6), x1 = 0.2, x2 = lerp(0.2, T >= 7 ? 9.4 : 8.6, lg);
        setSeg(line, X(x1), YY(x1, fy(x1)), X(x2), YY(x2, fy(x2)), 0); line.visible = lg > 0;
        lbEq.p.set(X(8.2), YY(8.2, fy(8.2)) + 0.7, 0); lbEq.a = (ph(1.55, 1.7) * (1 - ph(7.0, 7.1)) + ph(8.0, 8.1)) * (1 - un);
        setText(lbEq, T < 4.1 ? 'ŷ = 7 (the mean of y)' : 'ŷ = ' + num(b0, 1) + ' + ' + num(b, 2) + 'x');
        for (i = 0; i < lbYt.length; i++) lbYt[i].a = 0.8 * (1 - un); lbYn.a = 1 - un; lbZero.a = un;

        // sum-of-squares meter
        var mg = ph(3.75, 3.95), mh = sse / sst * MH;
        meter.visible = mg > 0; meter.scale.set(1, Math.max(mh * mg, 0.01), 1); meter.position.set(MX, 0, 0);
        meterGhost.visible = mg > 0; lbTotal.a = mg * 0.8 * (1 - ph(6.3, 6.4)); setText(lbTotal, 'total: ' + num(sst, 0));
        lbMeter.p.y = Math.max(mh / 2, 0.3); lbMeter.a = mg; setText(lbMeter, (T >= 6.1 ? 'left over: ' : 'sum of squares: ') + num(sse));
        var mm = ph(4.97, 5.0) * (1 - ph(12.0, 12.1)); setBar(minMark, MX - 0.3, SSEMIN / 75 * MH, 0.5, 1.6 * mm);

        // slope and intercept
        var tr = ph(5.15, 5.45), ic = ph(5.5, 5.75);
        setBar(run, X(4), Y(7), 0.02, X(1) * tr); setPost(rise, X(5), 0.02, Y(1.5) * cl(tr * 2 - 1), Y(7)); lbRun.a = lbRise.a = tr * (1 - ph(7.0, 7.1));
        if (T >= 7) { run.visible = false; rise.visible = false; }
        icpt.visible = ic > 0 && T < 7; icpt.position.set(0, Y(b0), 0); icpt.scale.setScalar(Math.max(ic, 0.001)); lbIc.a = ic * (1 - ph(7.0, 7.1));

        // R squared
        var eg = ph(6.1, 6.4), r2 = 1 - sse / sst;
        explained.visible = eg > 0; explained.material.opacity = 0.75 * eg; explained.scale.set(1, Math.max((MH - mh) * eg, 0.01), 1); explained.position.set(MX, mh, 0);
        lbExp.p.y = mh + (MH - mh) / 2; lbExp.a = eg; setText(lbExp, 'explained: ' + num(sst - sse)); lbR2.a = ph(6.45, 6.6); setText(lbR2, 'R² = ' + num(sst - sse, 0) + ' ÷ ' + num(sst, 0) + ' = ' + r2.toFixed(2));

        // prediction probe
        var pg = ph(7.05, 7.15) * (1 - ph(8.0, 8.1)), xp = lerp(lerp(2, 6, ph(7.15, 7.5)), 9, ph(7.55, 7.95)), yp = fy(xp), outside = xp > 7.001, pc = outside ? '#ff5c8a' : '#ffb454';
        setPost(probeV, X(xp), 0.03, Y(yp) * pg); setBar(probeH, 0, Y(yp), 0.03, X(xp) * pg); probeDot.visible = pg > 0; probeDot.position.set(X(xp), Y(yp), 0.03);
        probeV.material.color.set(pc); probeH.material.color.set(pc); probeDot.material.color.set(pc);
        lbProbe.p.set(X(xp) - 0.2, Y(yp) + 0.75, 0); lbProbe.a = pg; lbProbe.el.style.color = pc;
        setText(lbProbe, 'x = ' + num(xp) + ' → ŷ = ' + num(yp) + (outside ? ' (beyond the data)' : ''));

        // lines from other samples, then the bands
        var fo = 1 - ph(10.0, 10.1);
        for (i = 0; i < 14; i++) {
            var f = fan[i], fa = ph(8.15 + i * 0.045, 8.27 + i * 0.045) * fo, fb = B1 + f.db, fc = 7 + f.dl;
            setSeg(f.m, X(0.2), Y(fc + fb * (0.2 - XM)), X(lerp(0.2, 8.8, fa)), Y(fc + fb * (lerp(0.2, 8.8, fa) - XM)), -0.02); f.m.visible = fa > 0; f.m.material.opacity = 0.4 * fo;
        }
        lbFan.a = ph(8.6, 8.75) * fo;
        var ba = ph(9.15, 9.5) * (1 - ph(11.0, 11.1)), pa = ph(10.15, 10.5) * (1 - ph(11.0, 11.1));
        band.m.visible = ba > 0; band.m.material.opacity = 0.3 * ba; pband.m.visible = pa > 0; pband.m.material.opacity = 0.16 * pa;
        for (i = 0; i < 41; i++) {
            var xx = 0.2 + 8.6 * i / 40, lev = (xx - XM) * (xx - XM) / SXX, h1 = TSTAR * S_E * Math.sqrt(1 / N + lev), h2 = TSTAR * S_E * Math.sqrt(1 + 1 / N + lev), yc = 1 + 1.5 * xx;
            band.set(i, X(xx), Y(yc + h1), -0.04, X(xx), Y(yc - h1), -0.04); pband.set(i, X(xx), Y(yc + h2), -0.06, X(xx), Y(Math.max(yc - h2, -1)), -0.06);
        }
        band.done(); pband.done(); lbBand.a = ph(9.5, 9.65) * (1 - ph(11.0, 11.1)); lbPred.a = ph(10.5, 10.65) * (1 - ph(11.0, 11.1));

        if (step === 3) setStats('sum of squared residuals = <b>' + num(sse) + '</b>');
        else if (step === 4) setStats('slope ' + num(b, 2) + ' → sum of squares <b>' + num(sse) + '</b>');
        else if (step === 7) setStats('ŷ = 1 + 1.5 × ' + num(xp) + ' = <b>' + num(yp) + '</b>' + (outside ? ' <span class="dim">(extrapolating: risky)</span>' : ''));
        else if (step === 12) setStats('slope <b>' + num(b, 2) + '</b> · R² = <b>' + r2.toFixed(2) + '</b>');
    }

    // ---------- camera ----------
    var WALL = [[6, 4.5, 17], [6, 3.6, 0]], DEEP = [[17, 8, 19], [8.5, 3, 1], 0], METER = [[14, 7, 21], [9, 3.2, 1], 0.5];
    var FRONTV = [[8.5, 4.6, 21], [8.5, 3.8, 0], 0.8];
    var CAM = [WALL, WALL, WALL, DEEP, METER, [[9.5, 5, 20], [8, 3.6, 0], 0.5], METER, FRONTV, FRONTV, FRONTV, FRONTV, FRONTV, METER, METER];
    var tw = null;
    function preset(s) {
        var p = new THREE.Vector3().fromArray(CAM[s][0]), tg = new THREE.Vector3().fromArray(CAM[s][1]);
        var kk = Math.min(2.8, Math.max(1, 1.55 / camera.aspect));
        var out = { p: tg.clone().add(p.sub(tg).multiplyScalar(kk)), t: tg };
        if (camera.aspect > 1.25) { var off = CAM[s][2] === undefined ? 2.2 : CAM[s][2]; out.p.x -= off; out.t.x -= off; }   // keep the wall clear of the story panel
        return out;
    }
    function flyTo(s, instant) {
        var d = preset(s);
        if (instant) { camera.position.copy(d.p); controls.target.copy(d.t); tw = null; return; }
        tw = { p0: camera.position.clone(), t0: controls.target.clone(), p1: d.p, t1: d.t, x: 0 };
    }
    controls.addEventListener('start', function () { tw = null; });

    // ---------- ui ----------
    var segs = [], parts = ["fY", "fB0", "fB1", "fXv"];
    STEPS.forEach(function (st, i) {
        var bt = document.createElement('button'); bt.title = (i + 1) + '. ' + st.t; bt.setAttribute('aria-label', 'Step ' + (i + 1) + ': ' + st.t);
        bt.innerHTML = '<span><i></i></span>'; bt.onclick = function () { go(i); };
        $('progress').appendChild(bt); segs.push(bt.querySelector('i'));
    });
    function showStep() {
        var st = STEPS[step];
        $('chapter').textContent = 'Step ' + (step + 1) + ' of ' + NS;
        $('status').textContent = st.t; $('note').textContent = st.n; $('stats').innerHTML = st.s;
        parts.forEach(function (id) { $(id).classList.toggle('on', st.on.indexOf(id) >= 0); });
    }
    function setPlay(p) {
        playing = p;
        $('playIcon').setAttribute('d', p ? 'M3 1h3v12H3zM8 1h3v12H8z' : 'M3 1v12l9-6z');
    }
    function go(s) { step = Math.max(0, Math.min(NS - 1, s)); u = 0; showStep(); flyTo(step); setPlay(true); }
    $('bPrev').onclick = function () { go(u > 0.15 || step === 0 ? step : step - 1); };
    $('bNext').onclick = function () { if (step < NS - 1) go(step + 1); else { u = 1; } };
    $('bRestart').onclick = function () { go(0); };
    $('bPlay').onclick = function () { if (!playing && step === NS - 1 && u >= 1) go(0); else setPlay(!playing); };
    window.addEventListener('keydown', function (e) {
        if (e.key === 'ArrowRight') $('bNext').onclick();
        else if (e.key === 'ArrowLeft') $('bPrev').onclick();
        else if (e.key === ' ' && e.target === document.body) { e.preventDefault(); $('bPlay').onclick(); }
    });

    function resize() {
        var w = window.innerWidth, h = window.innerHeight;
        renderer.setSize(w, h); camera.aspect = w / h; camera.updateProjectionMatrix();
    }
    window.addEventListener('resize', resize); resize();
    showStep(); setPlay(playing); flyTo(0, true);
    if (!playing) u = 1;      // reduced motion: show each step finished, advance by hand

    var v3 = new THREE.Vector3(), last = performance.now();
    function frame(now) {
        requestAnimationFrame(frame);
        var dt = Math.min(0.1, (now - last) / 1000); last = now; clock += dt;
        if (playing) {
            u += dt / (DUR + HOLD);
            if (u >= 1) { if (step < NS - 1) { step++; u = 0; showStep(); flyTo(step); } else { u = 1; setPlay(false); } }
        }
        T = step + Math.min(u * (DUR + HOLD) / DUR, 0.9999);
        update();
        if (tw) {
            tw.x = Math.min(1, tw.x + dt / 1.5); var e = tw.x * tw.x * (3 - 2 * tw.x);
            camera.position.lerpVectors(tw.p0, tw.p1, e); controls.target.lerpVectors(tw.t0, tw.t1, e);
            if (tw.x >= 1) tw = null;
        }
        controls.update();
        renderer.render(scene, camera);

        for (var i = 0; i < segs.length; i++) segs[i].style.width = (i < step ? 100 : i === step ? u * 100 : 0) + '%';
        var w = window.innerWidth, h = window.innerHeight;
        for (i = 0; i < labels.length; i++) {
            var lb = labels[i];
            v3.copy(lb.p).project(camera);
            var show = lb.a > 0.01 && v3.z < 1 && v3.z > -1;
            lb.el.style.opacity = show ? lb.a : 0;
            if (show) lb.el.style.transform = 'translate(' + ((v3.x + 1) / 2 * w).toFixed(1) + 'px,' + ((1 - v3.y) / 2 * h).toFixed(1) + 'px) translate(' + (lb.left ? '0' : '-50%') + ',-50%)';
        }
    }
    requestAnimationFrame(frame);
})();
</script>
