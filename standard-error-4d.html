<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Standard Error in 4D</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
    /* Layout: full-screen 3D stage, story panel (with the live formula) top-left, step bar along the bottom. Single dark look by design. */
    :root {
        --bg: #050510;
        --cyan: #00ffff;
        --amber: #ffb454;
        --ink: #e9f6ff;
        --muted: #8fb3c7;
        --panel: rgba(4, 8, 22, 0.78);
        --line: rgba(0, 255, 255, 0.35);
        color-scheme: dark;
    }
    html, body { height: 100%; }
    body { margin: 0; overflow: hidden; background: var(--bg); color: var(--ink);
           font-family: 'IBM Plex Sans', 'Segoe UI', system-ui, sans-serif; font-variant-numeric: tabular-nums; }
    canvas { display: block; position: fixed; inset: 0; touch-action: none; }

    #ui { position: absolute; top: calc(16px + env(safe-area-inset-top, 0px)); left: 16px;
          width: min(410px, calc(100% - 32px)); box-sizing: border-box;
          background: var(--panel); padding: 14px 16px 15px; border-radius: 10px;
          border: 1px solid var(--line); box-shadow: 0 0 24px rgba(0,255,255,0.12);
          backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
          pointer-events: none; z-index: 10; }
    #chapter { font-size: 12px; color: var(--muted); margin-bottom: 4px; letter-spacing: 0.04em; text-transform: uppercase; }
    #status { font-size: clamp(18px, 2.6vw, 23px); font-weight: 600; line-height: 1.2; margin-bottom: 7px;
              color: var(--cyan); text-shadow: 0 0 12px rgba(0,255,255,0.55); text-wrap: balance; }
    #note { font-size: 13.5px; line-height: 1.5; opacity: 0.92; }
    #mathrow { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; margin-top: 9px; padding-top: 9px;
               border-top: 1px solid rgba(0,255,255,0.18); }
    #formula { display: flex; align-items: center; gap: 7px; font-family: Georgia, 'Times New Roman', serif; font-style: italic; font-size: 21px; flex: none; }
    #formula .frac { display: inline-flex; flex-direction: column; align-items: center; }
    #formula .top { padding: 0 6px 2px; border-bottom: 1.5px solid var(--ink); }
    #formula .bot { padding-top: 1px; }
    #formula .bar { text-decoration: overline; }
    #formula .p { opacity: 0.3; transition: opacity 0.4s, color 0.4s, text-shadow 0.4s; }
    #formula .p.on { opacity: 1; color: var(--amber); text-shadow: 0 0 10px rgba(255,180,84,0.6); }
    #formula .sym { opacity: 0.6; font-style: normal; }
    #stats { font-size: 13.5px; line-height: 1.5; font-weight: 500; color: var(--amber); flex: 1 1 150px; min-width: 0; }
    #stats .dim { color: var(--muted); font-weight: 400; }
    #error { color: #ff5c5c; font-weight: 600; font-size: 13px; }
    #error:empty { display: none; }

    #labels { position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 5; }
    .lb { position: absolute; left: 0; top: 0; white-space: nowrap; font-size: 13px; font-weight: 500;
          color: var(--ink); text-shadow: 0 0 4px #050510, 0 0 8px #050510, 0 1px 2px #050510; will-change: transform, opacity; }
    .lb.tick { font-size: 11px; color: var(--muted); font-weight: 400; }
    .lb.eq { color: var(--amber); font-weight: 600; font-size: 14px; }
    .lb.key { color: var(--cyan); font-weight: 600; font-size: 15px; }

    #bar { position: absolute; left: 0; right: 0; bottom: 0; z-index: 10;
           padding: 10px 16px calc(12px + env(safe-area-inset-bottom, 0px));
           background: linear-gradient(to top, rgba(5,5,16,0.92), rgba(5,5,16,0)); }
    #progress { display: flex; gap: 3px; margin-bottom: 8px; }
    #progress button { flex: 1; height: 18px; padding: 6px 0; margin: 0; border: 0; background: none; cursor: pointer; }
    #progress button span { display: block; height: 4px; border-radius: 2px; background: rgba(0,255,255,0.16); overflow: hidden; }
    #progress button i { display: block; height: 100%; width: 0; background: var(--cyan); box-shadow: 0 0 8px var(--cyan); }
    #progress button:hover span { background: rgba(0,255,255,0.32); }
    #controls { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    #controls button { width: 40px; height: 34px; border-radius: 8px; border: 1px solid var(--line);
                       background: var(--panel); color: var(--cyan); cursor: pointer; display: grid; place-items: center; }
    #controls button:hover { background: rgba(0,255,255,0.14); }
    button:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }
    #controls svg { width: 14px; height: 14px; fill: currentColor; }
    #hint { font-size: 12px; color: var(--muted); margin-left: 6px; }
    @media (max-width: 560px) {
        #ui { padding: 10px 12px 11px; }
        #note { font-size: 12.5px; line-height: 1.4; }
        #mathrow { margin-top: 6px; padding-top: 6px; gap: 10px; }
        #formula { font-size: 17px; }
        #stats { font-size: 12.5px; }
        #hint { display: none; }
    }
</style>
</head>
<body>
<div id="labels"></div>

<div id="ui">
    <div id="chapter"></div>
    <div id="status"></div>
    <div id="note"></div>
    <div id="mathrow">
        <div id="formula" aria-label="Sigma of X bar equals sigma divided by the square root of n">
            <span class="p" id="fSE">σ<sub style="font-size:0.6em"><span class="bar">X</span></sub></span><span class="sym">=</span>
            <span class="frac">
                <span class="top"><span class="p" id="fSig">σ</span></span>
                <span class="bot"><span class="p" id="fN">√<span class="bar">n</span></span></span>
            </span>
        </div>
        <div id="stats"></div>
    </div>
    <div id="error"></div>
</div>

<div id="bar">
    <div id="progress"></div>
    <div id="controls">
        <button id="bPrev" title="Previous step" aria-label="Previous step"><svg viewBox="0 0 14 14"><path d="M2 1h2v12H2zM13 1v12L5 7z"/></svg></button>
        <button id="bPlay" title="Play or pause" aria-label="Play or pause"><svg viewBox="0 0 14 14"><path id="playIcon" d="M3 1h3v12H3zM8 1h3v12H8z"/></svg></button>
        <button id="bNext" title="Next step" aria-label="Next step"><svg viewBox="0 0 14 14"><path d="M10 1h2v12h-2zM1 1v12l8-6z"/></svg></button>
        <button id="bRestart" title="Start again" aria-label="Start again"><svg viewBox="0 0 14 14"><path d="M7 2a5 5 0 1 0 4.9 6h-1.6A3.5 3.5 0 1 1 7 3.5c1 0 1.8.4 2.4 1L7.5 6.5H12V2l-1.5 1.5A5 5 0 0 0 7 2z"/></svg></button>
        <span id="hint">Drag to rotate · scroll to zoom · ← → to step · space to pause</span>
    </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
(function () {
    'use strict';
    var $ = function (id) { return document.getElementById(id); };
    if (!window.THREE || !THREE.OrbitControls) { $('error').textContent = 'The 3D library did not load. Check the connection and reload.'; return; }

    // ---------- the population (the same six values, now treated as a whole population) ----------
    var POP = [1, 4, 5, 8, 8, 10], MU = 6, SIG = 3;
    var NSZ = [4, 9, 16], K = 100, SEED = 203;       // three sample sizes, 100 samples each
    var CV_ = { 1: '#ff5c8a', 4: '#ff9f43', 5: '#ffe066', 8: '#5cff9d', 10: '#b388ff' };
    var ZT = 4.5, ZM = 9;                            // depth of the sample tray and of the pile of means
    var SX = 13.5, SZ = 4;                           // corner of the variance square on the floor
    var XB = '<span style="text-decoration:overline">X</span>';

    function rng(seed) { return function () { seed |= 0; seed = seed + 0x6D2B79F5 | 0; var t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
    function draw(n) {
        var r = rng(SEED + n), ms = [], first = [];
        for (var j = 0; j < K; j++) { var sum = 0, vs = []; for (var i = 0; i < n; i++) { var v = POP[Math.floor(r() * 6)]; sum += v; vs.push(v); } ms.push(sum / n); if (j < 3) first.push(vs); }
        return { ms: ms, first: first };
    }
    function spread(a) { var m = a.reduce(function (x, y) { return x + y; }) / a.length; return Math.sqrt(a.reduce(function (x, y) { return x + (y - m) * (y - m); }, 0) / a.length); }
    function stack(ms) {                             // dot-plot positions: bins of 0.25, stacked upward
        var cnt = {}; return ms.map(function (m) { var b = Math.round(m / 0.25), n = cnt[b] || 0; cnt[b] = n + 1; return [b * 0.25, 0.11 + n * 0.22]; });
    }
    var sims = NSZ.map(draw), FIRST = sims[0].first, MS4 = sims[0].ms;
    var order = MS4.map(function (m, j) { return j; }).sort(function (a, b) { return MS4[a] - MS4[b]; }), rank = [];
    order.forEach(function (j, r) { rank[j] = r; });
    var EMP = sims.map(function (d) { return spread(d.ms); });
    var PILE = sims.map(function (d, g) {
        if (g === 0) return stack(d.ms);
        var sorted = d.ms.slice().sort(function (a, b) { return a - b; });
        return stack(MS4.map(function (m, j) { return sorted[rank[j]]; }));   // keep each dot's rank so the pile squeezes smoothly
    });

    var STEPS = [
        { t: 'The population', n: 'Every unit in the population has one of these values. Its mean is μ = 6 and its standard deviation is σ = 3, the white ruler.',
          s: 'μ = 6 · σ = 3', on: ['fSig'] },
        { t: 'Take a sample of n = 4', n: 'Four units are picked at random and fall onto the tray. Their average is the sample mean, the amber dot.',
          s: '(1 + 10 + 10 + 8) ÷ 4 = <b>7.25</b>', on: ['fN'] },
        { t: 'Do it again, and again', n: 'Each new sample gives a different mean. The means collect on the front line, one dot per sample.',
          s: XB + ' = 7.25, 5.00, 6.75, …', on: ['fN'] },
        { t: 'Repeat it 100 times', n: 'The pile of sample means takes shape. It is centred on μ, and it is much narrower than the population behind it.',
          s: '', on: ['fSE'] },
        { t: 'Means spread less than the data', n: 'Measure the spread of the pile and compare it with σ. Averaging cancels the highs against the lows, so the means stay closer to μ.',
          s: '', on: ['fSE', 'fSig'] },
        { t: 'Why the square root of n', n: 'Build the variance square σ² and share it among the n = 4 values in a sample. One share is a smaller square, and its side is σ ÷ √n.',
          s: 'σ² ÷ n = 9 ÷ 4 = 2.25 → side = <b>1.5</b>', on: ['fSig', 'fN'] },
        { t: 'That side is the standard error', n: 'Carry the side to the pile of means. It matches the spread we measured. This is the standard error of the mean.',
          s: 'σ<sub>' + XB + '</sub> = 3 ÷ √4 = <b>1.5</b>', on: ['fSE', 'fSig', 'fN'] },
        { t: 'Bigger samples: n = 9', n: 'Share the same square among 9 and each side shrinks to 1. Samples of 9 give means that sit closer together.',
          s: '', on: ['fN', 'fSE'] },
        { t: 'Bigger still: n = 16', n: 'Four times the sample size of the start, and the standard error is only cut in half. Precision grows with √n, not with n.',
          s: '', on: ['fSE', 'fSig', 'fN'] }
    ];
    var NS = STEPS.length, DUR = 8;

    // ---------- scene ----------
    var renderer;
    try { renderer = new THREE.WebGLRenderer({ antialias: true }); }
    catch (e) { $('error').textContent = 'This browser could not start 3D graphics (WebGL).'; return; }
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    renderer.setClearColor(0x050510, 1);
    document.body.insertBefore(renderer.domElement, document.body.firstChild);
    var scene = new THREE.Scene();
    scene.fog = new THREE.Fog(0x050510, 50, 120);
    var camera = new THREE.PerspectiveCamera(45, 1, 0.1, 300);
    var controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true; controls.dampingFactor = 0.08; controls.maxDistance = 90; controls.minDistance = 4;

    var grid = new THREE.GridHelper(60, 60, 0x0b4a5c, 0x0a2233);
    grid.position.set(10, -0.03, 6); scene.add(grid);

    function mat(color, opacity) {
        return new THREE.MeshBasicMaterial({ color: color, transparent: true, opacity: opacity === undefined ? 1 : opacity, side: THREE.DoubleSide, depthWrite: false });
    }
    var barGeo = new THREE.BoxGeometry(1, 0.1, 0.1);
    function bar(color, thick) { var m = new THREE.Mesh(barGeo, mat(color)); if (thick) { m.scale.y = m.scale.z = thick; } scene.add(m); return m; }
    function setBar(m, left, y, z, len) {
        m.visible = len > 0.001; m.scale.x = Math.max(len, 0.001); m.position.set(left + len / 2, y, z);
    }
    var postGeo = new THREE.BoxGeometry(0.06, 1, 0.06);
    function post(color) { var m = new THREE.Mesh(postGeo, mat(color)); scene.add(m); return m; }
    function setPost(m, x, z, h) { m.visible = h > 0.001; m.scale.y = Math.max(h, 0.001); m.position.set(x, h / 2 - 0.1, z); }

    // three number lines: population (back), sample tray (middle), sample means (front)
    var tickGeo = new THREE.BoxGeometry(0.04, 0.3, 0.04);
    [[0, '#3c6d80'], [ZT, '#1d3f4d'], [ZM, '#3c6d80']].forEach(function (a) {
        var ax = bar(a[1], 0.5); setBar(ax, -0.5, 0, a[0], 12);
        for (var k = 0; k <= 11; k++) { var tk = new THREE.Mesh(tickGeo, mat(a[1])); tk.position.set(k, 0, a[0]); scene.add(tk); }
    });

    // population dots, stacked in columns on the back wall
    var sph = new THREE.SphereGeometry(0.2, 20, 12), popDots = [], colH = {};
    POP.forEach(function (v) {
        for (var c = 0; c < 6; c++) {
            var h = colH[v] || 0; colH[v] = h + 1;
            var p = new THREE.Mesh(sph, mat(CV_[v], 0.9)); p.position.set(v, 0.32 + h * 0.42, 0); scene.add(p); popDots.push({ m: p, h: h });
        }
    });
    var muLine = post('#00ffff'); muLine.scale.x = muLine.scale.z = 1.4;
    var muFloor = new THREE.Mesh(new THREE.BoxGeometry(0.05, 0.05, 1), mat('#00ffff', 0.5)); scene.add(muFloor);
    var sigRuler = bar('#ffffff', 1.5);

    // the four sample dots (reused for the three slow samples)
    var samp = []; for (var i = 0; i < 4; i++) { var sm = new THREE.Mesh(sph, mat('#ffffff')); scene.add(sm); samp.push(sm); }
    // sample means
    var mGeo = new THREE.SphereGeometry(0.11, 12, 8), mMat = mat('#ffb454'), means = [];
    for (i = 0; i < K; i++) { var md = new THREE.Mesh(mGeo, mMat); md.visible = false; scene.add(md); means.push(md); }
    var empBar = bar('#ffb454', 1.8), seBar = bar('#ffffff', 1.8), sigCopy = bar('#ffffff', 1.8), sideBar = bar('#ffffff', 1.8), sqRuler = bar('#ffffff', 1.5);

    // variance square and its shares
    var whole = new THREE.Mesh(new THREE.PlaneGeometry(3, 3), mat('#00ffff', 0)); whole.geometry.rotateX(-Math.PI / 2); scene.add(whole);
    var cellGeo = new THREE.PlaneGeometry(1, 1); cellGeo.rotateX(-Math.PI / 2);
    var shares = NSZ.map(function (n) {
        var r = Math.sqrt(n), side = SIG / r, mA = mat('#00ffff', 0), mB = mat('#ffb454', 0);
        for (var a = 0; a < r; a++) for (var b = 0; b < r; b++) {
            var c = new THREE.Mesh(cellGeo, a === 0 && b === r - 1 ? mB : mA);
            c.scale.set(side * 0.92, 1, side * 0.92); c.position.set(SX + (a + 0.5) * side, 0.03, SZ + (b + 0.5) * side); scene.add(c);
        }
        return { a: mA, b: mB };
    });

    // ---------- labels ----------
    var labelBox = $('labels'), labels = [];
    function label(text, x, y, z, cls, left) {
        var el = document.createElement('div'); el.className = 'lb' + (cls ? ' ' + cls : ''); el.textContent = text;
        labelBox.appendChild(el);
        var o = { el: el, p: new THREE.Vector3(x, y, z), a: 0, txt: text, left: !!left }; labels.push(o); return o;
    }
    function setText(lb, t) { if (lb.txt !== t) { lb.txt = t; lb.el.textContent = t; } }
    for (var k = 0; k <= 11; k++) { label(String(k), k, -0.5, 0, 'tick').a = 0.7; label(String(k), k, 0.02, ZM + 0.5, 'tick').a = 0.8; }
    var lbPop = label('population', -1.6, 0.4, 0, 'tick');
    var lbTray = label('one sample, n = 4', -2.2, 0.3, ZT, 'tick');
    var lbPile = label('sample means', -1.9, 0.3, ZM, 'tick');
    var lbMu = label('μ = 6', MU, 7.3, 0, 'key');
    var lbSig = label('σ = 3', MU + 1.5, 6.75, 0, 'key');
    var lbXbar = label('', 0, 0, 0, 'eq');
    var lbCount = label('', 12.2, 0.4, ZM, 'eq', true);
    var lbEmp = label('', 0, 0.1, ZM + 1.3, 'eq', true);
    var lbSE = label('', 0, 0.1, ZM + 2.2, 'key', true);
    var lbSigC = label('σ = 3', MU + 3.3, 0.1, ZM + 3.1, '', true);
    var lbSq = label('σ² = 9', SX + 1.5, 0.6, SZ + 1.5, 'key');
    var lbSide = label('', SX, 0.1, SZ + 3.85, 'key', true);

    // ---------- timeline ----------
    var step = 0, u = 0, playing = !window.matchMedia('(prefers-reduced-motion: reduce)').matches, T = 0, clock = 0;
    function ph(a, b) { var x = (T - a) / (b - a); x = x < 0 ? 0 : x > 1 ? 1 : x; return x * x * (3 - 2 * x); }
    function lerp(a, b, t) { return a + (b - a) * t; }
    var SLOW = [[1.1, 1.92], [2.05, 2.5], [2.5, 2.95]];          // time windows of the three slow samples
    function startOf(j) { return j < 3 ? lerp(SLOW[j][0], SLOW[j][1], 0.6) : 3.05 + (j - 3) / (K - 3) * 0.72; }
    function durOf(j) { return j < 3 ? (SLOW[j][1] - SLOW[j][0]) * 0.36 : 0.14; }

    function update() {
        var i, j;
        // population
        popDots.forEach(function (d) { var a = ph(0.05 + d.h * 0.035, 0.2 + d.h * 0.035); d.m.scale.setScalar(Math.max(a, 0.001)); d.m.visible = a > 0; });
        lbPop.a = ph(0.3, 0.45) * 0.9;
        var mg = ph(0.5, 0.72);
        setPost(muLine, MU, 0, 7 * mg); lbMu.a = ph(0.66, 0.76);
        var sg = ph(0.76, 0.92); setBar(sigRuler, MU, 6.35, 0, SIG * sg); lbSig.a = sg;

        // the slow samples: four dots fall from the population onto the tray
        var cur = -1; for (j = 0; j < 3; j++) if (T >= SLOW[j][0] && T < SLOW[j][1]) cur = j;
        for (i = 0; i < 4; i++) {
            var sm = samp[i]; sm.visible = cur >= 0;
            if (cur < 0) continue;
            var w = SLOW[cur], v = FIRST[cur][i], dup = 0;
            for (var q = 0; q < i; q++) if (FIRST[cur][q] === v) dup++;
            var f = ph(lerp(w[0], w[1], 0.04 * i), lerp(w[0], w[1], 0.3 + 0.04 * i)), out = 1 - ph(lerp(w[0], w[1], 0.9), w[1]);
            sm.material.color.set(CV_[v]);
            sm.position.set(v, lerp(0.32 + (i + 1) * 0.42, 0.25 + dup * 0.42, f) + Math.sin(Math.PI * f) * 1.2, lerp(0, ZT, f));
            sm.scale.setScalar(Math.max(out, 0.001));
        }
        lbTray.a = (cur >= 0 ? 1 : 0) * 0.9;

        // sample means: born on the tray, land on the pile; the pile squeezes as n grows
        var g1 = ph(7.15, 7.75), g2 = ph(8.15, 8.75), landed = 0;
        lbXbar.a = 0;
        for (j = 0; j < K; j++) {
            var t0 = startOf(j), d = durOf(j), md = means[j], born = j < 3 ? lerp(SLOW[j][0], SLOW[j][1], 0.42) : t0;
            md.visible = T >= born;
            if (!md.visible) continue;
            var fl = ph(t0, t0 + d);
            if (fl >= 1) landed++;
            var px = lerp(lerp(PILE[0][j][0], PILE[1][j][0], g1), PILE[2][j][0], g2), py = lerp(lerp(PILE[0][j][1], PILE[1][j][1], g1), PILE[2][j][1], g2);
            md.position.set(lerp(MS4[j], px, fl), lerp(0.3, py, fl) + Math.sin(Math.PI * fl) * 1.3, lerp(ZT, ZM, fl));
            md.scale.setScalar(j < 3 ? lerp(2, 1, fl) : 1);
            if (j === cur) { lbXbar.p.copy(md.position); lbXbar.p.y += 0.6; lbXbar.a = 1; setText(lbXbar, 'X̄ = ' + MS4[j].toFixed(2)); }
        }
        lbPile.a = ph(1.6, 1.75) * 0.9;
        lbCount.a = ph(3.05, 3.15) * (1 - ph(4.0, 4.1)); setText(lbCount, landed + ' samples');
        var fz = ph(3.8, 3.95); muFloor.visible = fz > 0; muFloor.scale.z = Math.max((ZM + 3.4) * fz, 0.001); muFloor.position.set(MU, 0.02, (ZM + 3.4) * fz / 2);

        // measured spread of the pile against sigma, then against sigma / root n
        var se = lerp(lerp(1.5, 1, g1), 0.75, g2), emp = lerp(lerp(EMP[0], EMP[1], g1), EMP[2], g2);
        var eg = ph(4.15, 4.5), cg = ph(4.5, 4.9);
        setBar(empBar, MU, 0.06, ZM + 1.3, emp * eg); lbEmp.p.x = MU + emp + 0.3; lbEmp.a = ph(4.4, 4.5); setText(lbEmp, 'spread of the means = ' + emp.toFixed(2));
        setBar(sigCopy, MU, lerp(6.35, 0.06, cg) + Math.sin(Math.PI * cg) * 1.5, lerp(0, ZM + 3.1, cg), T >= 4.5 ? SIG : 0); lbSigC.a = ph(4.85, 4.95);

        // variance square shared among n
        var rf = ph(5.05, 5.25), sw = ph(5.25, 5.4), split = ph(5.55, 5.75);
        setBar(sqRuler, lerp(MU, SX, rf), lerp(6.35, 0.06, rf) + Math.sin(Math.PI * rf) * 1.5, lerp(0, SZ + 3.1, rf), T >= 5.05 ? SIG : 0);
        whole.visible = sw > 0; whole.scale.z = Math.max(sw, 0.001); whole.position.set(SX + 1.5, 0.02, SZ + 3 - 1.5 * sw);
        whole.material.opacity = lerp(0.55, 0.1, split);
        lbSq.a = ph(5.36, 5.44) * (1 - ph(5.55, 5.62));
        var al = [split * (1 - ph(7.12, 7.3)), ph(7.3, 7.5) * (1 - ph(8.12, 8.3)), ph(8.3, 8.5)];
        shares.forEach(function (sh, g) { sh.a.opacity = 0.5 * al[g]; sh.b.opacity = 0.95 * al[g]; });
        var sd = ph(5.75, 5.9);
        setBar(sideBar, SX, 0.08, SZ + 3.3, se * sd); lbSide.a = sd; setText(lbSide, 'side = σ ÷ √n = ' + se.toFixed(2));

        // the side travels to the pile: the standard error
        var go6 = ph(6.1, 6.6);
        setBar(seBar, lerp(SX, MU, go6), 0.06 + Math.sin(Math.PI * go6) * 1.5, lerp(SZ + 3.3, ZM + 2.2, go6), T >= 6.1 ? se : 0);
        lbSE.p.x = MU + se + 0.3; lbSE.a = ph(6.6, 6.72); setText(lbSE, 'standard error = ' + se.toFixed(2));

        if (step === 3) setStats(landed + ' of 100 sample means');
        else if (step === 4) setStats('σ = 3 · spread of the means = <b>' + emp.toFixed(2) + '</b>');
        else if (step >= 7) { var n = step === 7 ? 9 : 16, r = Math.sqrt(n); setStats('n = ' + n + ': 3 ÷ √' + n + ' = 3 ÷ ' + r + ' = <b>' + (3 / r) + '</b> · measured ' + emp.toFixed(2)); }
    }
    function setStats(h) { if ($('stats').innerHTML !== h) $('stats').innerHTML = h; }

    // ---------- camera ----------
    var WALL = [[5.5, 5, 18], [5.5, 3.3, 0]], SAMP = [[5, 10.5, 25], [5, 1.8, 4.5]], FRONT = [[7.5, 8.5, 24], [7.5, 0.8, 8.5]], ALL = [[9, 10, 23.5], [9, 1.6, 6]];
    var CAM = [WALL, SAMP, SAMP, SAMP, FRONT, [[12.5, 10, 20], [12.5, 0.6, 6.5]], ALL, ALL, ALL];
    var tw = null;
    function preset(s) {
        var p = new THREE.Vector3().fromArray(CAM[s][0]), tg = new THREE.Vector3().fromArray(CAM[s][1]);
        var kk = Math.min(2.8, Math.max(1, 1.55 / camera.aspect));
        var out = { p: tg.clone().add(p.sub(tg).multiplyScalar(kk)), t: tg };
        if (camera.aspect > 1.25) { var off = CAM[s] === ALL ? 3 : 2.2; out.p.x -= off; out.t.x -= off; }   // keep the wall clear of the story panel
        return out;
    }
    function flyTo(s, instant) {
        var d = preset(s);
        if (instant) { camera.position.copy(d.p); controls.target.copy(d.t); tw = null; return; }
        tw = { p0: camera.position.clone(), t0: controls.target.clone(), p1: d.p, t1: d.t, x: 0 };
    }
    controls.addEventListener('start', function () { tw = null; });

    // ---------- ui ----------
    var segs = [], parts = ['fSE', 'fSig', 'fN'];
    STEPS.forEach(function (st, i) {
        var bt = document.createElement('button'); bt.title = (i + 1) + '. ' + st.t; bt.setAttribute('aria-label', 'Step ' + (i + 1) + ': ' + st.t);
        bt.innerHTML = '<span><i></i></span>'; bt.onclick = function () { go(i); };
        $('progress').appendChild(bt); segs.push(bt.querySelector('i'));
    });
    function showStep() {
        var st = STEPS[step];
        $('chapter').textContent = 'Step ' + (step + 1) + ' of ' + NS;
        $('status').textContent = st.t; $('note').textContent = st.n; $('stats').innerHTML = st.s;
        parts.forEach(function (id) { $(id).classList.toggle('on', st.on.indexOf(id) >= 0); });
    }
    function setPlay(p) {
        playing = p;
        $('playIcon').setAttribute('d', p ? 'M3 1h3v12H3zM8 1h3v12H8z' : 'M3 1v12l9-6z');
    }
    function go(s) { step = Math.max(0, Math.min(NS - 1, s)); u = 0; showStep(); flyTo(step); setPlay(true); }
    $('bPrev').onclick = function () { go(u > 0.15 || step === 0 ? step : step - 1); };
    $('bNext').onclick = function () { if (step < NS - 1) go(step + 1); else { u = 1; } };
    $('bRestart').onclick = function () { go(0); };
    $('bPlay').onclick = function () { if (!playing && step === NS - 1 && u >= 1) go(0); else setPlay(!playing); };
    window.addEventListener('keydown', function (e) {
        if (e.key === 'ArrowRight') $('bNext').onclick();
        else if (e.key === 'ArrowLeft') $('bPrev').onclick();
        else if (e.key === ' ' && e.target === document.body) { e.preventDefault(); $('bPlay').onclick(); }
    });

    function resize() {
        var w = window.innerWidth, h = window.innerHeight;
        renderer.setSize(w, h); camera.aspect = w / h; camera.updateProjectionMatrix();
    }
    window.addEventListener('resize', resize); resize();
    showStep(); setPlay(playing); flyTo(0, true);
    if (!playing) u = 1;      // reduced motion: show each step finished, advance by hand

    var v3 = new THREE.Vector3(), last = performance.now();
    function frame(now) {
        requestAnimationFrame(frame);
        var dt = Math.min(0.1, (now - last) / 1000); last = now; clock += dt;
        if (playing) {
            u += dt / DUR;
            if (u >= 1) { if (step < NS - 1) { step++; u = 0; showStep(); flyTo(step); } else { u = 1; setPlay(false); } }
        }
        T = step + Math.min(u, 0.9999);
        update();
        if (tw) {
            tw.x = Math.min(1, tw.x + dt / 1.5); var e = tw.x * tw.x * (3 - 2 * tw.x);
            camera.position.lerpVectors(tw.p0, tw.p1, e); controls.target.lerpVectors(tw.t0, tw.t1, e);
            if (tw.x >= 1) tw = null;
        }
        controls.update();
        renderer.render(scene, camera);

        for (var i = 0; i < segs.length; i++) segs[i].style.width = (i < step ? 100 : i === step ? u * 100 : 0) + '%';
        var w = window.innerWidth, h = window.innerHeight;
        for (i = 0; i < labels.length; i++) {
            var lb = labels[i];
            v3.copy(lb.p).project(camera);
            var show = lb.a > 0.01 && v3.z < 1 && v3.z > -1;
            lb.el.style.opacity = show ? lb.a : 0;
            if (show) lb.el.style.transform = 'translate(' + ((v3.x + 1) / 2 * w).toFixed(1) + 'px,' + ((1 - v3.y) / 2 * h).toFixed(1) + 'px) translate(' + (lb.left ? '0' : '-50%') + ',-50%)';
        }
    }
    requestAnimationFrame(frame);
})();
</script>
</body>
