           background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; z-index: 9; font-size: 13px; backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); box-shadow: 0 0 24px rgba(0,255,255,0.12); }

        lbA.a = lbB.a = lbC.a = 0;
        var L = function (lb, x, y, z, txt, a, colr) { lb.p.set(x, y, z); lb.a = a; setText(lb, txt); lb.el.style.color = colr || ''; };
        if (step >= 1 && step <= 3) L(lbA, SX(12.8), H(cf(14.5)) + 0.5, SZ, 'ŷ = ' + f1(CSB[0]) + ' − ' + f2(-CSB[1]) + 'x', ph(1.6, 1.75));
        if (step === 3) L(lbB, SX(10), H(66), SZ, 'each firm sits in its own cloud', ph(3.6, 3.75));
        if (step === 5) L(lbA, X(11) + 0.3, H(tsfit(11)) + 0.9, zf, 'fitted: x + trend + season', ph(5.5, 5.65));
        if (step === 6) L(lbA, X(6), H(52), zf, 'residuals (×6) · Durbin-Watson = ' + f2(DW), ph(6.5, 6.65));
        if (step === 7) L(lbA, X(6), H(56), zf, 'y(t) on y(t − 4): ρ = ' + f2(DYN.b[1]), ph(7.4, 7.55), '#ffb454');
        if (step === 8) L(lbA, X(7.5), H(22), zf, 'Δ₄y = y(t) − y(t − 4)', ph(8.6, 8.75));
        if (step === 9) L(lbA, SX(12.5), H(pf(14)) + 0.6, SZ, 'pooled slope ' + f2(PF.b[1]), ph(9.7, 9.85));
        if (step === 10) L(lbA, SX(10.8), H(bf(12.4)) - 0.5, SZ, 'between firms: ' + f2(BBET), ph(10.7, 10.85));
        if (step === 11) L(lbA, SX(9), H(70), SZ, 'own intercept aᵢ, common slope +' + f2(BFE), ph(11.5, 11.65));
        if (step === 12) L(lbA, SX(GX + 5.5), H(GY + BFE * 5.5) + 0.5, SZ, 'demeaned: slope +' + f2(BFE), ph(12.7, 12.85), '#00ffff');
        if (step === 13) L(lbA, SX(GX + 5.5), H(GY + B2W * 5.5) + 0.5, SZ, 'firm and quarter removed: +' + f2(B2W), ph(13.7, 13.85), '#00ffff');
        if (step === 14 || step === 15) { L(lbA, SX(GX + 5.5) + 0.2, H(GY + BFE * 5.5), SZ, 'FE +' + f2(BFE), ph(14.4, 14.55), '#00ffff'); L(lbB, SX(GX + 5.5) + 0.2, H(GY + BRE * 5.5), SZ, 'RE ' + (BRE >= 0 ? '+' : '−') + Math.abs(BRE).toFixed(2), ph(14.6, 14.75), '#ffb454'); L(lbC, SX(12.4) + 0.2, H(bf(12.4)), SZ, 'between ' + f2(BBET), ph(14.4, 14.55)); }
        if (step === 16) L(lbA, SX(9), H(70), SZ, 'cluster = one firm: its errors move together', ph(16.5, 16.65));
        if (step === 17) L(lbA, SX(GX + 5.5), H(GY + BFD * 5.5) + 0.5, SZ, 'changes on changes: +' + f2(BFD), ph(17.7, 17.85), '#00ffff');

        // ----- table -----
        buildTable(); var c = cur();
        trs.forEach(function (tr, k) { var cl2 = (step < MOD[k].s && !(step === 18) ? 'hid' : '') + (k === c ? ' hl' : ''); if (tr.className !== cl2) tr.className = cl2; });

        // ----- stats -----
        var st = '';
        if (step === 1) st = 'b = <b>' + f2(CSB[1]) + '</b> · SE ' + f2(CSSE) + ' · R² = ' + f2(CSF.r2);
        else if (step === 2) st = 'with few units and unequal spread, use robust (White) standard errors';
        else if (step === 3) st = 'cross-section slope <b>' + f2(CSB[1]) + '</b> mixes advertising with firm size';
        else if (step === 5) st = 'b on x = <b>' + f2(TSB[1]) + '</b> · trend ' + f2(TSB[2]) + ' · Q4 effect ' + f1(TSB[5]) + ' · R² = ' + f2(TSFt.r2);
        else if (step === 6) st = 'DW = <b>' + f2(DW) + '</b> (2 = no autocorrelation) · r(eₜ, eₜ₋₁) = ' + f2(RR1);
        else if (step === 7) st = 'ρ on y(t − 4) = <b>' + f2(DYN.b[1]) + '</b> · b on x = <b>' + f2(DYN.b[2]) + '</b>';
        else if (step === 8) st = 'seasonal differences remove the season and most of the trend';
        else if (step === 9) st = 'pooled OLS b = <b>' + f2(PF.b[1]) + '</b> · n = 72';
        else if (step === 10) st = 'between-firm slope = <b>' + f2(BBET) + '</b> · aᵢ is tied to x';
        else if (step === 11 || step === 12) st = 'fixed effects b = <b>+' + f2(BFE) + '</b> · SE ' + f2(FESE);
        else if (step === 13) st = 'two-way FE b = <b>+' + f2(B2W) + '</b>';
        else if (step === 14) st = 'θ = ' + f2(TH) + ' · RE b = <b>' + f2(BRE) + '</b> (θ = 1 gives FE, θ = 0 gives pooled)';
        else if (step === 15) st = 'Hausman (Mundlak form) χ² = <b>' + f1(HAU) + '</b> · p ' + (HAUP < 0.001 ? '< 0.001' : '= ' + HAUP.toFixed(3)) + ' → use fixed effects';
        else if (step === 16) st = '6 clusters · cluster-robust SE by firm';
        else if (step === 17) st = 'first-difference b = <b>+' + f2(BFD) + '</b>';
        setStats(st);
    }
    // ---------- camera ----------
    var ISO = [[14.5, 10, 10.5], [4.6, 1.8, -3.4], -1.6], FRT = [[5.5, 5.6, 12.5], [5.0, 2.4, -1.6], -2.2], SCAT = [[5.4, 3.9, 17.5], [5.4, 3.3, 2.2], -1.9];
    var CAM = [ISO, SCAT, SCAT, SCAT, FRT, FRT, FRT, FRT, FRT, SCAT, SCAT, SCAT, SCAT, SCAT, SCAT, SCAT, SCAT, SCAT, SCAT];
    var tw = null;
    function preset(s) {
        var p = new THREE.Vector3().fromArray(CAM[s][0]), tg = new THREE.Vector3().fromArray(CAM[s][1]);
        var kk = Math.min(2.8, Math.max(1, 1.55 / camera.aspect));
        var out = { p: tg.clone().add(p.sub(tg).multiplyScalar(kk)), t: tg };
        if (camera.aspect > 1.25) { var off = CAM[s][2] === undefined ? 2.2 : CAM[s][2]; out.p.x -= off; out.t.x -= off; }   // keep the wall clear of the story panel
        return out;
    }
    function flyTo(s, instant) {
        var d = preset(s);
        if (instant) { camera.position.copy(d.p); controls.target.copy(d.t); tw = null; return; }
        tw = { p0: camera.position.clone(), t0: controls.target.clone(), p1: d.p, t1: d.t, x: 0 };
    }
    controls.addEventListener('start', function () { tw = null; });

    // ---------- ui ----------
    var segs = [], parts = ["fY", "fA", "fB", "fX", "fE"];
    STEPS.forEach(function (st, i) {
        var bt = document.createElement('button'); bt.title = (i + 1) + '. ' + st.t; bt.setAttribute('aria-label', 'Step ' + (i + 1) + ': ' + st.t);
        bt.innerHTML = '<span><i></i></span>'; bt.onclick = function () { go(i); };
        $('progress').appendChild(bt); segs.push(bt.querySelector('i'));
    });
    function showStep() {
        var st = STEPS[step];
        $('chapter').textContent = 'Step ' + (step + 1) + ' of ' + NS;
        $('status').textContent = st.t; $('note').textContent = st.n; $('stats').innerHTML = st.s;
        parts.forEach(function (id) { $(id).classList.toggle('on', st.on.indexOf(id) >= 0); });
    }
    function setPlay(p) {
        playing = p;
        $('playIcon').setAttribute('d', p ? 'M3 1h3v12H3zM8 1h3v12H8z' : 'M3 1v12l9-6z');
    }
    function go(s) { step = Math.max(0, Math.min(NS - 1, s)); u = 0; showStep(); flyTo(step); setPlay(true); }
    $('bPrev').onclick = function () { go(u > 0.15 || step === 0 ? step : step - 1); };
    $('bNext').onclick = function () { if (step < NS - 1) go(step + 1); else { u = 1; } };
    $('bRestart').onclick = function () { go(0); };
    $('bPlay').onclick = function () { if (!playing && step === NS - 1 && u >= 1) go(0); else setPlay(!playing); };
    window.addEventListener('keydown', function (e) {
        if (e.key === 'ArrowRight') $('bNext').onclick();
        else if (e.key === 'ArrowLeft') $('bPrev').onclick();
        else if (e.key === ' ' && e.target === document.body) { e.preventDefault(); $('bPlay').onclick(); }
    });

    function resize() {
        var w = window.innerWidth, h = window.innerHeight;
        renderer.setSize(w, h); camera.aspect = w / h; camera.updateProjectionMatrix();
    }
    window.addEventListener('resize', resize); resize();
    showStep(); setPlay(playing); flyTo(0, true);
    if (!playing) u = 1;      // reduced motion: show each step finished, advance by hand

    var v3 = new THREE.Vector3(), last = performance.now();
    function frame(now) {
        requestAnimationFrame(frame);
        var dt = Math.min(0.1, (now - last) / 1000); last = now; clock += dt;
        if (playing) {
            u += dt / (DUR + HOLD);
            if (u >= 1) { if (step < NS - 1) { step++; u = 0; showStep(); flyTo(step); } else { u = 1; setPlay(false); } }
        }
        T = step + Math.min(u * (DUR + HOLD) / DUR, 0.9999);
        update();
        if (tw) {
            tw.x = Math.min(1, tw.x + dt / 1.5); var e = tw.x * tw.x * (3 - 2 * tw.x);
            camera.position.lerpVectors(tw.p0, tw.p1, e); controls.target.lerpVectors(tw.t0, tw.t1, e);
            if (tw.x >= 1) tw = null;
        }
        controls.update();
        renderer.render(scene, camera);

        for (var i = 0; i < segs.length; i++) segs[i].style.width = (i < step ? 100 : i === step ? u * 100 : 0) + '%';
        var w = window.innerWidth, h = window.innerHeight;
        for (i = 0; i < labels.length; i++) {
            var lb = labels[i];
            v3.copy(lb.p).project(camera);
            var show = lb.a > 0.01 && v3.z < 1 && v3.z > -1;
            lb.el.style.opacity = show ? lb.a : 0;
            if (show) lb.el.style.transform = 'translate(' + ((v3.x + 1) / 2 * w).toFixed(1) + 'px,' + ((1 - v3.y) / 2 * h).toFixed(1) + 'px) translate(' + (lb.left ? '0' : '-50%') + ',-50%)';
        }
    }
    requestAnimationFrame(frame);
})();
</script>
</body></html>
