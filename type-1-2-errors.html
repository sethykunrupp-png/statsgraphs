<style>
    /* Layout: full-screen 3D stage, story panel (with the live formula) top-left, step bar along the bottom. Single dark look by design. */
    :root {

              color: var(--cyan); text-shadow: 0 0 12px rgba(0,255,255,0.55); text-wrap: balance; }

    #formula { display: flex; align-items: center; gap: 7px; font-family: Georgia, 'Times New Roman', serif; font-style: italic; font-size: 21px; flex: none; }
    #formula .frac { display: inline-flex; flex-direction: column; align-items: center; }
    #formula .top { padding: 0 6px 2px; border-bottom: 1.5px solid var(--ink); }

    #tbl table.mx tbody th { color: var(--cyan); text-align: left; border-bottom: 0; }

    #tbl table.mx td span { font-size: 12px; color: var(--muted); }
    #tbl table.mx td.ce span { color: #04121c; }
    #tbl .hc { opacity: 0; }
    #tbl table.av td { text-align: left; }
    #tbl table.av th span { font-size: 12px; color: var(--muted); font-weight: 400; }
    #tbl table.av ul { margin: 0; padding-left: 18px; }
    #tbl table.av li { margin: 3px 0; }

    // ----- axis -----
    var axis = bar('#3c6d80', 0.5); setBar(axis, wx(41), 0, 0, wx(65) - wx(41));
    var tickGeo = new THREE.BoxGeometry(0.04, 0.3, 0.04);
    for (var v = 42; v <= 64; v += 2) { var tk = new THREE.Mesh(tickGeo, mat('#5d9ab3')); tk.position.set(wx(v), 0, 0); scene.add(tk); label(String(v), wx(v), -0.5, 0, 'tick').a = 0.85; }
    label('sample mean X̄', wx(66.2), 0, 0, 'key').a = 1;

    // ----- curves and shaded areas -----
    var NP = 161, c0 = polyline(NP, '#00ffff'), f0 = strip(NP, '#00ffff', 0), c1 = polyline(NP, AMB), f1 = strip(NP, AMB, 0);
    var aSh = strip(61, PINK, 0), bSh = strip(61, VIO, 0), pSh = strip(61, GRN, 0);
    function curveSet(pl, st, m, s, z) { for (var i = 0; i < NP; i++) { var x = 40 + 26 * i / (NP - 1), h = dn(x, m, s) * HS; pl.set(i, wx(x), h, z); st.set(i, wx(x), h, z - 0.02, wx(x), 0, z - 0.02); } st.done(); }
    function area(st, a, b, m, s, z) { for (var i = 0; i < 61; i++) { var x = a + (b - a) * i / 60; st.set(i, wx(x), dn(x, m, s) * HS, z, wx(x), 0, z); } st.done(); }
    var cutL = post('#ffffff', 1.8), m0L = post('#00ffff', 1.2), m1L = post(AMB, 1.2);
    var lbH0 = label('', 0, 0, 0, 'key'), lbH1 = label('', 0, 0, 0, ''), lbCut = label('', 0, 0, 0, ''), lbA = label('', 0, 0, 0, ''), lbB = label('', 0, 0, 0, ''), lbP = label('', 0, 0, 0, ''), lbRain = label('', 0, 0, 0, 'eq');
    lbH1.el.style.color = AMB; lbA.el.style.color = '#ff8fae'; lbB.el.style.color = '#c9aaff'; lbP.el.style.color = GRN;
    [lbA, lbB, lbP, lbH1, lbCut].forEach(function (l) { l.el.style.fontWeight = '600'; l.el.style.fontSize = '14px'; });

    // ----- 100 sample means drawn from the H0 world -----
    var ND = 100, r0 = rng(3), order = []; for (var i = 0; i < ND; i++) order.push(i);
    for (i = ND - 1; i > 0; i--) { var j = Math.floor(r0() * (i + 1)), t = order[i]; order[i] = order[j]; order[j] = t; }
    var sph = new THREE.SphereGeometry(0.19, 14, 10), dCy = mat('#00ffff', 0.9), dPk = mat(PINK, 1), dots = [], bins = {};
    for (i = 0; i < ND; i++) {
        var xv = M0 + 2 * invPhi((i + 0.5) / ND), b = Math.round(xv / 0.5), n = bins[b] || 0; bins[b] = n + 1;
        var d = new THREE.Mesh(sph, dCy); d.visible = false; scene.add(d);
        dots.push({ m: d, x: wx(b * 0.5), y: 0.22 + n * 0.48, v: b * 0.5, t0: 4.1 + order[i] * 0.0065 });
    }

    var X1 = 52.4, sDot = new THREE.Mesh(new THREE.SphereGeometry(0.32, 20, 14), mat('#ffffff')), sStem = post('#ffffff', 1.2); scene.add(sDot);
    var lbSamp = label('', wx(X1), 2.1, 0.3, 'key'), lbQ0 = label('population mean 50?', wx(50), 4.4, 0, ''), lbQ1 = label('or 54?', wx(54), 4.4, 0, '');
    lbQ1.el.style.color = AMB;
    var tests = []; for (i = 0; i < 20; i++) { var cb = box('#00ffff', 0.6, true); cb.scale.set(0.5, 0.5, 0.5); cb.position.set(wx(45.5) + i * 0.68, 0.05, 3.2); cb.visible = false; tests.push(cb); }
    var lbTests = label('', wx(52), 0.05, 4.7, 'eq');

    function update() {
        var i;
        // two steps added at the start of the story and two near the end; the original timeline is replayed in between
        var RT = T, pr = function (a, b) { var x = (RT - a) / (b - a); x = x < 0 ? 0 : x > 1 ? 1 : x; return x * x * (3 - 2 * x); };
        var ost = step === 0 ? 0 : step === 1 ? 0 : step <= 11 ? step - 1 : 11;
        T = step === 0 ? RT : step === 1 ? 0.999 : step <= 11 ? RT - 1 : 11.6;
        // ----- the situation now -----
        var se = lerp(lerp(2, 1, ph(9.15, 9.6)), 2, ph(10.02, 10.12));
        var mu1 = lerp(lerp(54, 58, ph(10.2, 10.75)), 54, ph(11.05, 11.4));
        var alpha = T < 8 ? 0.05 : lerp(lerp(lerp(0.05, 0.01, ph(8.1, 8.45)), 0.10, ph(8.5, 8.85)), 0.05, ph(8.9, 8.98));
        var nPlan = lerp(25, 39, pr(12.15, 12.75));
        if (RT >= 12) se = lerp(10 / Math.sqrt(nPlan), 2, pr(13.05, 13.3));
        if (RT >= 13) alpha = lerp(lerp(0.05, 0.0025, pr(13.5, 13.85)), 0.05, pr(14.02, 14.2));
        var cut = M0 + invPhi(1 - alpha) * se, beta = Phi((cut - mu1) / se), power = 1 - beta;

        // H0 curve
        var g0 = ph(1.1, 1.6); curveSet(c0, f0, M0, se, 0); c0.done(Math.floor(NP * g0)); f0.m.material.opacity = 0.12 * g0;
        var top0 = dn(M0, M0, se) * HS;
        setPost(m0L, wx(M0), 0, (top0 + 0.4) * g0); lbH0.p.set(wx(M0), top0 + 0.85, 0); lbH0.a = g0; setText(lbH0, 'population mean 50 (H₀)'); lbH0.p.x = wx(M0) - 1.6;
        // cut-off
        var cg = ph(2.1, 2.4); setPost(cutL, wx(cut), 0.05, (top0 * 0.8 + 1.2) * cg);
        lbCut.p.set(wx(cut) + 0.25, top0 * 0.8 + 1.0, 0); lbCut.left = true; lbCut.a = cg; setText(lbCut, 'cut-off ' + cut.toFixed(1) + ' · reject H₀ to the right');
        // alpha
        var ag = ph(3.1, 3.4); aSh.m.visible = ag > 0; aSh.m.material.opacity = 0.65 * ag; area(aSh, cut, 66, M0, se, 0.04);
        lbA.p.set(wx(cut) + 1.6, dn(cut, M0, se) * HS * 0.5 + 0.35, 0.1); lbA.a = ag; setText(lbA, 'α = ' + alpha.toFixed(3));
        // rain of samples under H0
        var dg = 1 - ph(5.0, 5.2), beyond = 0, landed = 0;
        for (i = 0; i < ND; i++) {
            var dd = dots[i], f = ph(dd.t0, dd.t0 + 0.12), out = dd.v > cut;
            dd.m.visible = T >= dd.t0 && dg > 0; dd.m.position.set(dd.x, lerp(11, dd.y * se / 2 + 0 * se, f * f), 0.25); dd.m.scale.setScalar(Math.max(dg, 0.001));
            dd.m.material = f >= 1 && out ? dPk : dCy; if (f >= 1) { landed++; if (out) beyond++; }
        }
        lbRain.p.set(wx(60), 3.2, 0); lbRain.a = (T >= 4.2 ? 1 : 0) * dg; setText(lbRain, beyond + ' of ' + landed + ' landed beyond the line');
        // H1 curve
        var g1 = ph(5.1, 5.6); curveSet(c1, f1, mu1, se, -0.6); c1.done(Math.floor(NP * g1)); f1.m.material.opacity = 0.1 * g1; c1.m.visible = g1 > 0;
        var top1 = dn(mu1, mu1, se) * HS;
        setPost(m1L, wx(mu1), -0.6, (top1 + 0.4) * g1); lbH1.p.set(wx(mu1) + 0.3, top1 + 0.85, -0.6); lbH1.a = g1; setText(lbH1, 'population mean ' + mu1.toFixed(0) + ' (H₁)'); lbH1.left = true;
        // beta and power
        var bg = ph(6.1, 6.4), pg = ph(7.1, 7.4);
        bSh.m.visible = bg > 0; bSh.m.material.opacity = 0.6 * bg; area(bSh, 40, cut, mu1, se, -0.55);
        pSh.m.visible = pg > 0; pSh.m.material.opacity = 0.45 * pg; area(pSh, cut, 66, mu1, se, -0.56);
        lbB.p.set(wx(cut) - 1.3, dn(cut, mu1, se) * HS * 0.45 + 0.3, -0.5); lbB.a = bg; setText(lbB, 'β = ' + beta.toFixed(3));
        lbP.p.set(wx(mu1) + 1.4, top1 * 0.45, -0.5); lbP.a = pg; setText(lbP, 'power = ' + power.toFixed(3));

        // ----- the decision table -----
        buildTable(step === 14 ? 'av' : 'mx');
        var st = ost, rv = Math.floor(5 * ph(0.15, 0.9));
        var hi = { 0: [], 1: [], 2: [], 3: ['c01'], 4: ['c01'], 5: [], 6: ['c10'], 7: ['c11'], 8: ['c01', 'c10'], 9: ['c10', 'c11'], 10: ['c10', 'c11'], 11: ['c01', 'c10', 'c11'] }[st];
        var known = st >= 3, kb = st >= 6;
        if (tblKind === 'mx') {
        cell('c00', 'Correct', known ? '1 − α = ' + (1 - alpha).toFixed(3) : 'keep H₀, and it is true', false, st > 0 || rv >= 1);
        cell('c01', 'Type I error', known ? 'false alarm · α = ' + alpha.toFixed(3) : 'false alarm', hi.indexOf('c01') >= 0, st > 0 || rv >= 2);
        cell('c10', 'Type II error', kb ? 'miss · β = ' + beta.toFixed(3) : 'miss', hi.indexOf('c10') >= 0, st > 0 || rv >= 3);
        cell('c11', 'Correct', st >= 7 ? 'power = 1 − β = ' + power.toFixed(3) : 'catch the real effect', hi.indexOf('c11') >= 0, st > 0 || rv >= 4);
        }

        if (st >= 6 && st !== 11 && step < 12) setStats('α = <b>' + alpha.toFixed(3) + '</b> · β = <b>' + beta.toFixed(3) + '</b> · power = <b>' + power.toFixed(3) + '</b>' + (st === 9 ? ' <span class="dim">(n × 4)</span>' : ''));
        if (step === 5) setStats(beyond + ' false alarms in ' + landed + ' samples <span class="dim">(expected about 5)</span>');
        // ----- the one sample -----
        var sa = pr(1.1, 1.5), sx = sa > 0 ? 1 : 0;
        sDot.visible = sa > 0; sDot.position.set(wx(X1), lerp(9, 0.32, sa * sa), 0.3); setPost(sStem, wx(X1), 0.3, 0);
        lbSamp.a = pr(1.45, 1.6) * (RT < 5 ? 1 : 0); setText(lbSamp, RT < 3 ? 'your sample: X̄ = 52.4' : 'X̄ = 52.4: left of the line, keep H₀');
        lbSamp.p.y = 1.2;
        lbQ0.a = lbQ1.a = pr(1.6, 1.75) * (1 - pr(1.95, 2.05));
        // ----- many tests -----
        var tg = pr(13.1, 13.5), ta = 1 - pr(14.0, 14.1);
        for (i = 0; i < 20; i++) { var on = cl(tg * 22 - i); tests[i].visible = on > 0 && ta > 0; tests[i].scale.setScalar(0.5 * Math.max(on, 0.01)); tests[i].material.color.set(i === 13 && on >= 1 && RT < 13.5 ? PINK : '#00ffff'); }
        lbTests.a = tg * ta; setText(lbTests, RT < 13.5 ? '20 tests, H₀ true in all: P(at least one false alarm) = 1 − 0.95²⁰ = 64%' : 'Bonferroni: α = 0.05 ÷ 20 = 0.0025 per test → about 5% overall');
        if (step === 12) setStats('n = ' + Math.round(nPlan) + ' → standard error ' + se.toFixed(2) + ' → power = <b>' + power.toFixed(2) + '</b>');
        else if (step === 13) setStats('cut-off ' + cut.toFixed(1) + ' · α per test = <b>' + alpha.toFixed(4) + '</b>');
        T = RT;
    }
    // ---------- camera ----------
    var V = [[1.5, 5.6, 19.5], [1.5, 3, 0], -2.6], TALL = [[1.5, 8, 24], [1.5, 4.6, 0], -2.6];
    var HIGHV = [[1.5, 6.5, 21], [1.5, 2.2, 1.2], -2.6];
    var CAM = [V, V, V, V, V, V, V, V, V, V, TALL, V, V, HIGHV, V];
    var tw = null;
    function preset(s) {
        var p = new THREE.Vector3().fromArray(CAM[s][0]), tg = new THREE.Vector3().fromArray(CAM[s][1]);
        var kk = Math.min(2.8, Math.max(1, 1.55 / camera.aspect));
        var out = { p: tg.clone().add(p.sub(tg).multiplyScalar(kk)), t: tg };
        if (camera.aspect > 1.25) { var off = CAM[s][2] === undefined ? 2.2 : CAM[s][2]; out.p.x -= off; out.t.x -= off; }   // keep the wall clear of the story panel
        return out;
    }
    function flyTo(s, instant) {
        var d = preset(s);
        if (instant) { camera.position.copy(d.p); controls.target.copy(d.t); tw = null; return; }
        tw = { p0: camera.position.clone(), t0: controls.target.clone(), p1: d.p, t1: d.t, x: 0 };
    }
    controls.addEventListener('start', function () { tw = null; });

    // ---------- ui ----------
    var segs = [], parts = ["fP", "fB", "fA"];
    STEPS.forEach(function (st, i) {
        var bt = document.createElement('button'); bt.title = (i + 1) + '. ' + st.t; bt.setAttribute('aria-label', 'Step ' + (i + 1) + ': ' + st.t);
        bt.innerHTML = '<span><i></i></span>'; bt.onclick = function () { go(i); };
        $('progress').appendChild(bt); segs.push(bt.querySelector('i'));
    });
    function showStep() {
        var st = STEPS[step];
        $('chapter').textContent = 'Step ' + (step + 1) + ' of ' + NS;
        $('status').textContent = st.t; $('note').textContent = st.n; $('stats').innerHTML = st.s;
        parts.forEach(function (id) { $(id).classList.toggle('on', st.on.indexOf(id) >= 0); });
    }
    function setPlay(p) {
        playing = p;
        $('playIcon').setAttribute('d', p ? 'M3 1h3v12H3zM8 1h3v12H8z' : 'M3 1v12l9-6z');
    }
    function go(s) { step = Math.max(0, Math.min(NS - 1, s)); u = 0; showStep(); flyTo(step); setPlay(true); }
    $('bPrev').onclick = function () { go(u > 0.15 || step === 0 ? step : step - 1); };
    $('bNext').onclick = function () { if (step < NS - 1) go(step + 1); else { u = 1; } };
    $('bRestart').onclick = function () { go(0); };
    $('bPlay').onclick = function () { if (!playing && step === NS - 1 && u >= 1) go(0); else setPlay(!playing); };
    window.addEventListener('keydown', function (e) {
        if (e.key === 'ArrowRight') $('bNext').onclick();
        else if (e.key === 'ArrowLeft') $('bPrev').onclick();
        else if (e.key === ' ' && e.target === document.body) { e.preventDefault(); $('bPlay').onclick(); }
    });

    function resize() {
        var w = window.innerWidth, h = window.innerHeight;
        renderer.setSize(w, h); camera.aspect = w / h; camera.updateProjectionMatrix();
    }
    window.addEventListener('resize', resize); resize();
    showStep(); setPlay(playing); flyTo(0, true);
    if (!playing) u = 1;      // reduced motion: show each step finished, advance by hand

    var v3 = new THREE.Vector3(), last = performance.now();
    function frame(now) {
        requestAnimationFrame(frame);
        var dt = Math.min(0.1, (now - last) / 1000); last = now; clock += dt;
        if (playing) {
            u += dt / (DUR + HOLD);
            if (u >= 1) { if (step < NS - 1) { step++; u = 0; showStep(); flyTo(step); } else { u = 1; setPlay(false); } }
        }
        T = step + Math.min(u * (DUR + HOLD) / DUR, 0.9999);
        update();
        if (tw) {
            tw.x = Math.min(1, tw.x + dt / 1.5); var e = tw.x * tw.x * (3 - 2 * tw.x);
            camera.position.lerpVectors(tw.p0, tw.p1, e); controls.target.lerpVectors(tw.t0, tw.t1, e);
            if (tw.x >= 1) tw = null;
        }
        controls.update();
        renderer.render(scene, camera);

        for (var i = 0; i < segs.length; i++) segs[i].style.width = (i < step ? 100 : i === step ? u * 100 : 0) + '%';
        var w = window.innerWidth, h = window.innerHeight;
        for (i = 0; i < labels.length; i++) {
            var lb = labels[i];
            v3.copy(lb.p).project(camera);
            var show = lb.a > 0.01 && v3.z < 1 && v3.z > -1;
            lb.el.style.opacity = show ? lb.a : 0;
            if (show) lb.el.style.transform = 'translate(' + ((v3.x + 1) / 2 * w).toFixed(1) + 'px,' + ((1 - v3.y) / 2 * h).toFixed(1) + 'px) translate(' + (lb.left ? '0' : '-50%') + ',-50%)';
        }
    }
    requestAnimationFrame(frame);
})();
</script>
</body></html>
