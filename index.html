<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>3D Statistical Data Evolution</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #050510;
            --cyan: #00ffff;
            --ink: #e9f6ff;
            --muted: #8fb3c7;
            --panel: rgba(4, 8, 22, 0.72);
            --line: rgba(0, 255, 255, 0.35);
            box-sizing: border-box;
            padding-top: env(safe-area-inset-top, 0px);
            padding-bottom: env(safe-area-inset-bottom, 0px);
        }
        html, body { height: 100%; }
        body { margin: 0; overflow: hidden; background-color: var(--bg); color: var(--ink);
               font-family: 'IBM Plex Sans', 'Segoe UI', system-ui, sans-serif; font-variant-numeric: tabular-nums; }
        canvas { display: block; position: fixed; inset: 0; }

        #ui { position: absolute; top: calc(16px + env(safe-area-inset-top, 0px)); left: 16px;
              width: min(430px, calc(100% - 32px)); box-sizing: border-box;
              background: var(--panel); padding: 14px 16px 15px; border-radius: 10px;
              border: 1px solid var(--line); box-shadow: 0 0 24px rgba(0,255,255,0.12);
              backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
              pointer-events: none; z-index: 10; }
        #chapter { font-size: 12px; color: var(--muted); margin-bottom: 4px; }
        #status { font-size: clamp(18px, 2.6vw, 23px); font-weight: 600; line-height: 1.2; margin-bottom: 7px;
                  color: var(--cyan); text-shadow: 0 0 12px rgba(0,255,255,0.55); }
        #note { font-size: 13.5px; line-height: 1.5; color: var(--ink); opacity: 0.92; }
        #stats { font-size: 13px; line-height: 1.6; margin-top: 9px; padding-top: 9px;
                 border-top: 1px solid rgba(0,255,255,0.18); }
        #stats:empty { display: none; }
        #stats .eq { font-weight: 500; color: #ffb454; }
        #stats .dim { color: var(--muted); }
        .chip { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 6px; vertical-align: baseline; }
        .key { display: inline-block; width: 14px; height: 3px; margin: 0 5px 3px 0; vertical-align: middle; border-radius: 2px; }
        #error { color: #ff5c5c; font-weight: 600; font-size: 13px; }
        #error:empty { display: none; }

        #bar { position: absolute; left: 0; right: 0; bottom: 0; z-index: 10;
               padding: 10px 16px calc(12px + env(safe-area-inset-bottom, 0px));
               background: linear-gradient(to top, rgba(5,5,16,0.9), rgba(5,5,16,0)); }
        #progress { display: flex; gap: 3px; margin-bottom: 8px; }
        #progress button { flex: 1; height: 18px; padding: 6px 0; margin: 0; border: 0; background: none; cursor: pointer; }
        #progress button span { display: block; height: 4px; border-radius: 2px; background: rgba(0,255,255,0.16); overflow: hidden; }
        #progress button i { display: block; height: 100%; width: 0; background: var(--cyan); box-shadow: 0 0 8px var(--cyan); }
        #progress button.done i { width: 100%; opacity: 0.55; }
        #progress button:hover span { background: rgba(0,255,255,0.32); }
        #controls { display: flex; align-items: center; gap: 8px; }
        #controls button { width: 36px; height: 32px; border-radius: 8px; border: 1px solid var(--line);
                           background: var(--panel); color: var(--cyan); cursor: pointer; display: grid; place-items: center; }
        #controls button:hover { background: rgba(0,255,255,0.14); }
        button:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }
        #controls svg { width: 14px; height: 14px; fill: currentColor; }
        #hint { font-size: 12px; color: var(--muted); margin-left: 6px; }
        body.compact #note, body.compact #stats, body.compact #why { display: none; }
        /* objective of the current topic: in the panel, or above the scene bar when an embedded page fills the stage */
        #why { font-size: 13px; line-height: 1.45; margin-bottom: 8px; padding: 6px 9px; border-left: 3px solid #ffb454;
               background: rgba(255,180,84,0.09); border-radius: 0 6px 6px 0; color: var(--ink); }
        #why b, #whyBar b { color: #ffb454; font-weight: 600; }
        #why:empty { display: none; }
        #whyBar { display: none; font-size: 13px; line-height: 1.4; margin: 0 0 6px; color: var(--ink); max-width: 110ch; }
        body.embedding #whyBar { display: block; }
        body.embedding #bar { background: var(--bg); border-top: 1px solid rgba(0,255,255,0.18); }
        .tocWhy { margin: 0 0 7px; font-size: 12.5px; line-height: 1.45; color: var(--muted); }
        @media (max-width: 560px) { #why { font-size: 12px; line-height: 1.4; margin-bottom: 6px; padding: 5px 8px; } #whyBar { font-size: 12px; } }

        /* embedded pages and sheets (the six 4D animations and their two summary sheets), shown unchanged */
        #embed { position: fixed; inset: 0; z-index: 8; display: none; background: var(--bg); }
        body.embedding #embed { display: block; }
        body.embedding #ui { display: none; }
        #embed iframe { position: absolute; left: 0; top: 0; width: 100%; height: calc(100% - var(--barh, 74px)); border: 0; background: var(--bg); }
        #embed .sheet { position: absolute; left: 0; right: 0; top: 0; bottom: var(--barh, 74px); overflow: auto; box-sizing: border-box;
                        padding: 12px; display: grid; place-items: center; }
        #embed .sheet img { display: block; max-width: 100%; max-height: calc(100vh - var(--barh, 74px) - 24px); cursor: zoom-in; }
        #embed .sheet.zoom { display: block; }
        #embed .sheet.zoom img { max-width: none; max-height: none; width: max(100%, 1200px); cursor: zoom-out; }

        /* contents screen */
        #toc { position: fixed; inset: 0; z-index: 20; display: none; overflow-y: auto; box-sizing: border-box;
               background: rgba(5, 5, 16, 0.80); backdrop-filter: blur(5px); -webkit-backdrop-filter: blur(5px);
               padding: calc(28px + env(safe-area-inset-top, 0px)) 28px calc(28px + env(safe-area-inset-bottom, 0px)); }
        #toc.open { display: block; }
        #tocInner { max-width: 1080px; margin: 0 auto; }
        #toc h1 { font-size: clamp(24px, 4vw, 38px); font-weight: 600; line-height: 1.15; margin: 0 0 6px; color: var(--cyan); text-shadow: 0 0 14px rgba(0,255,255,0.5); }
        #tocSub { margin: 0 0 18px; font-size: 14px; color: var(--muted); max-width: 60ch; line-height: 1.5; }
        #tocActions { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 26px; }
        #tocActions button { font: inherit; font-size: 14px; font-weight: 500; padding: 9px 16px; border-radius: 8px; cursor: pointer;
                             border: 1px solid var(--line); background: var(--panel); color: var(--cyan); }
        #tocActions button.primary { background: var(--cyan); color: #04121c; border-color: var(--cyan); }
        #tocActions button:hover { box-shadow: 0 0 14px rgba(0,255,255,0.35); }
        #tocList { columns: 3 270px; column-gap: 34px; }
        .tocCh { break-inside: avoid; margin: 0 0 22px; }
        .tocCh h2 { font-size: 14px; font-weight: 600; color: var(--cyan); margin: 0 0 6px; padding-bottom: 5px; border-bottom: 1px solid rgba(0,255,255,0.22); }
        .tocCh h2 span { color: var(--muted); font-weight: 400; margin-left: 6px; }
        .tocCh button { display: flex; gap: 8px; width: 100%; text-align: left; font: inherit; font-size: 13.5px; line-height: 1.35;
                        padding: 4px 6px; margin: 0 -6px; border: 0; border-radius: 5px; background: none; color: var(--ink); cursor: pointer; }
        .tocCh button i { font-style: normal; color: var(--muted); min-width: 1.6em; text-align: right; }
        .tocCh button:hover { background: rgba(0,255,255,0.12); color: #fff; }
        .tocCh button.cur { background: rgba(0,255,255,0.16); color: var(--cyan); }
        @media (max-width: 560px) { #toc { padding-left: 16px; padding-right: 16px; } }
        @media (max-width: 560px) {
            #hint { display: none; }
            #ui { top: calc(10px + env(safe-area-inset-top, 0px)); left: 10px; width: calc(100% - 20px); padding: 10px 12px 11px; }
            #status { font-size: 17px; margin-bottom: 5px; }
            #note { font-size: 12.5px; line-height: 1.4; }
            #stats { font-size: 12px; line-height: 1.5; margin-top: 7px; padding-top: 7px; }
        }
    </style>
</head>
<body>
    <div id="ui">
        <div id="chapter"></div>
        <div id="status">Initializing...</div>
        <div id="why"></div>
        <div id="note"></div>
        <div id="stats"></div>
        <div id="error"></div>
    </div>

    <div id="embed"></div>

    <div id="toc" role="dialog" aria-modal="true" aria-label="Contents">
        <div id="tocInner">
            <h1>3D Statistical Data Evolution</h1>
            <p id="tocSub"></p>
            <div id="tocActions">
                <button id="tocStart" class="primary">Start from scene 1</button>
                <button id="tocClose">Close contents</button>
            </div>
            <div id="tocList"></div>
        </div>
    </div>

    <div id="bar">
        <div id="whyBar"></div>
        <div id="progress"></div>
        <div id="controls">
            <button id="contents" aria-label="Open contents" title="Contents (C)"><svg viewBox="0 0 16 16"><path d="M1 3h2v2H1zM5 3h10v2H5zM1 7h2v2H1zM5 7h10v2H5zM1 11h2v2H1zM5 11h10v2H5z"/></svg></button>
            <button id="prev" aria-label="Previous scene"><svg viewBox="0 0 16 16"><path d="M3 2h2v12H3zM14 2v12L6 8z"/></svg></button>
            <button id="play" aria-label="Pause"><svg viewBox="0 0 16 16"><path id="playIcon" d="M3 2h4v12H3zM9 2h4v12H9z"/></svg></button>
            <button id="next" aria-label="Next scene"><svg viewBox="0 0 16 16"><path d="M11 2h2v12h-2zM2 2v12l8-6z"/></svg></button>
            <button id="notes" aria-label="Hide notes" title="Show or hide the notes (N)"><svg viewBox="0 0 16 16"><path d="M2 3h12v2H2zM2 7h12v2H2zM2 11h8v2H2z"/></svg></button>
            <button id="glow" aria-label="Turn glow off" title="Glow on or off (G)"><svg viewBox="0 0 16 16"><path d="M8 4a4 4 0 100 8 4 4 0 000-8zM7 0h2v3H7zM7 13h2v3H7zM0 7h3v2H0zM13 7h3v2h-3z"/></svg></button>
            <span id="hint">C for contents, Space to pause, arrow keys to change scene, drag to orbit</span>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <!-- Optional glow (bloom). If any of these fail to load the animation still runs without it. -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/CopyShader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/LuminosityHighPassShader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/EffectComposer.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/RenderPass.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/ShaderPass.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/UnrealBloomPass.js"></script>

    <script>
        try {
            if (!window.THREE) throw new Error("Three.js failed to load. Check your internet connection.");

            // ================= RENDERER, CAMERA, GLOW =================
            const scene = new THREE.Scene();
            const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
            const renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setClearColor(0x050510);
            document.body.appendChild(renderer.domElement);

            let composer = null;
            try {
                if (THREE.EffectComposer && THREE.RenderPass && THREE.UnrealBloomPass) {
                    composer = new THREE.EffectComposer(renderer);
                    composer.addPass(new THREE.RenderPass(scene, camera));
                    composer.addPass(new THREE.UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 0.5, 0.4, 0.22));
                }
            } catch (e) { composer = null; console.warn("Bloom disabled:", e); }

            const controls = THREE.OrbitControls
                ? new THREE.OrbitControls(camera, renderer.domElement)
                : { update() {}, target: new THREE.Vector3(), addEventListener() {} };
            controls.enableDamping = true;
            controls.target.set(0, 0, 0);
            let userCam = false;                       // true once the viewer drags; released at the next scene
            controls.addEventListener('start', () => { userCam = true; });

            function camDist() { return Math.max(30, 17 / (0.577 * camera.aspect)); }
            camera.position.set(0, 3, camDist());

            scene.add(new THREE.AmbientLight(0xffffff, 0.6));
            const dirLight = new THREE.DirectionalLight(0xffffff, 1);
            dirLight.position.set(10, 20, 10);
            scene.add(dirLight);

            // Backdrop: faint star field
            (function () {
                const n = 1400, pos = new Float32Array(n * 3);
                for (let i = 0; i < n; i++) {
                    const r = 140 + Math.random() * 160, th = Math.random() * Math.PI * 2, ph = Math.acos(2 * Math.random() - 1);
                    pos[i * 3] = r * Math.sin(ph) * Math.cos(th); pos[i * 3 + 1] = r * Math.cos(ph); pos[i * 3 + 2] = r * Math.sin(ph) * Math.sin(th);
                }
                const g = new THREE.BufferGeometry();
                g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
                const stars = new THREE.Points(g, new THREE.PointsMaterial({ color: 0x7fa8d8, size: 0.7, transparent: true, opacity: 0.55 }));
                stars.name = 'stars';
                scene.add(stars);
            })();
            const stars = scene.getObjectByName('stars');

            // Wall grid (behind 2D plots) and floor grid (under the 3D panel view)
            const gridHelper = new THREE.GridHelper(60, 30, 0x0a4a66, 0x06283a);
            gridHelper.rotation.x = Math.PI / 2;
            gridHelper.position.z = -0.6;
            gridHelper.visible = false;
            scene.add(gridHelper);
            const floorGrid = new THREE.GridHelper(60, 30, 0x0a4a66, 0x06283a);
            floorGrid.position.y = -9;
            floorGrid.visible = false;
            scene.add(floorGrid);

            // ================= STATISTICS HELPERS =================
            // Box-Muller standard normal
            function randn() {
                let u = 0, v = 0;
                while (u === 0) u = Math.random();
                while (v === 0) v = Math.random();
                return Math.sqrt(-2.0 * Math.log(u)) * Math.cos(2.0 * Math.PI * v);
            }
            function normalPDF(x, mean, stdDev) {
                const exp = -0.5 * Math.pow((x - mean) / stdDev, 2);
                return (1 / (stdDev * Math.sqrt(2 * Math.PI))) * Math.exp(exp);
            }
            const sum = a => a.reduce((s, v) => s + v, 0);
            const mean = a => sum(a) / a.length;
            // FIX: sample standard deviation divides by n - 1 (the data are a sample, not the population)
            function sampleSD(a, m) { return Math.sqrt(a.reduce((s, v) => s + (v - m) * (v - m), 0) / (a.length - 1)); }
            // FIX: for an even n the median is the average of the two middle values (input must be sorted)
            function median(sorted) {
                const n = sorted.length, h = Math.floor(n / 2);
                return n % 2 ? sorted[h] : (sorted[h - 1] + sorted[h]) / 2;
            }
            function pearson(xs, ys) {
                const mx = mean(xs), my = mean(ys);
                let sxy = 0, sxx = 0, syy = 0;
                for (let i = 0; i < xs.length; i++) { sxy += (xs[i] - mx) * (ys[i] - my); sxx += (xs[i] - mx) ** 2; syy += (ys[i] - my) ** 2; }
                return sxy / Math.sqrt(sxx * syy);
            }
            // Solve A b = v by Gaussian elimination with partial pivoting
            function solve(A, v) {
                const n = v.length, M = A.map((r, i) => r.concat([v[i]]));
                for (let c = 0; c < n; c++) {
                    let p = c;
                    for (let r = c + 1; r < n; r++) if (Math.abs(M[r][c]) > Math.abs(M[p][c])) p = r;
                    [M[c], M[p]] = [M[p], M[c]];
                    for (let r = c + 1; r < n; r++) {
                        const f = M[r][c] / M[c][c];
                        for (let k = c; k <= n; k++) M[r][k] -= f * M[c][k];
                    }
                }
                const b = new Array(n).fill(0);
                for (let r = n - 1; r >= 0; r--) {
                    let s = M[r][n];
                    for (let k = r + 1; k < n; k++) s -= M[r][k] * b[k];
                    b[r] = s / M[r][r];
                }
                return b;
            }
            // FIX: fitted lines are now ESTIMATED from the data by least squares
            // (the old version drew the true generating formula and called it "best fit").
            function lsq(xs, ys, basis) {
                const p = basis.length, A = [], v = new Array(p).fill(0);
                for (let j = 0; j < p; j++) A.push(new Array(p).fill(0));
                for (let i = 0; i < xs.length; i++) {
                    const phi = basis.map(fn => fn(xs[i]));
                    for (let j = 0; j < p; j++) { v[j] += phi[j] * ys[i]; for (let k = 0; k < p; k++) A[j][k] += phi[j] * phi[k]; }
                }
                const beta = solve(A, v);
                const f = x => basis.reduce((s, fn, j) => s + beta[j] * fn(x), 0);
                const my = mean(ys);
                let sse = 0, sst = 0;
                for (let i = 0; i < xs.length; i++) { sse += (ys[i] - f(xs[i])) ** 2; sst += (ys[i] - my) ** 2; }
                return { beta, f, sse, r2: 1 - sse / sst };
            }
            // Non-linear least squares with one non-linear parameter: search it on a grid,
            // solve the remaining (linear) coefficients exactly, keep the smallest SSE.
            function gridFit(xs, ys, lo, hi, step, makeBasis) {
                let best = null;
                for (let q = lo; q <= hi + 1e-9; q += step) {
                    const fit = lsq(xs, ys, makeBasis(q));
                    if (!best || fit.sse < best.sse) { best = fit; best.q = q; }
                }
                return best;
            }
            const num = (v, d = 2) => (Math.abs(v) < 0.5 * Math.pow(10, -d) ? 0 : v).toFixed(d).replace('-', '\u2212');
            const signed = (v, d = 2) => (v < 0 ? '\u2212 ' : '+ ') + Math.abs(v).toFixed(d);

            // quantile by linear interpolation between order statistics (input must be sorted)
            function quantile(sorted, p) {
                const h = (sorted.length - 1) * p, lo = Math.floor(h), hi = Math.ceil(h);
                return sorted[lo] + (sorted[hi] - sorted[lo]) * (h - lo);
            }
            function normalCDF(z) {
                const t = 1 / (1 + 0.2316419 * Math.abs(z)), d = 0.3989422804 * Math.exp(-z * z / 2);
                const p = d * t * (0.319381530 + t * (-0.356563782 + t * (1.781477937 + t * (-1.821255978 + t * 1.330274429))));
                return z > 0 ? 1 - p : p;
            }
            function invertCDF(cdf, p, lo, hi) {            // bisection
                for (let k = 0; k < 48; k++) { const mid = (lo + hi) / 2; if (cdf(mid) < p) lo = mid; else hi = mid; }
                return (lo + hi) / 2;
            }
            function lgamma(x) {                             // Lanczos approximation
                const c = [0.99999999999980993, 676.5203681218851, -1259.1392167224028, 771.32342877765313,
                           -176.61502916214059, 12.507343278686905, -0.13857109526572012, 9.9843695780195716e-6, 1.5056327351493116e-7];
                x -= 1;
                let a = c[0];
                const t = x + 7.5;
                for (let i = 1; i < 9; i++) a += c[i] / (x + i);
                return 0.5 * Math.log(2 * Math.PI) + (x + 0.5) * Math.log(t) - t + Math.log(a);
            }
            // Student t distribution with df degrees of freedom
            function tDist(df) {
                const k = Math.exp(lgamma((df + 1) / 2) - lgamma(df / 2)) / Math.sqrt(df * Math.PI);
                const pdf = x => k * Math.pow(1 + x * x / df, -(df + 1) / 2);
                const cdf = x => {                           // Simpson's rule from 0 to |x|
                    const n = 200, h = Math.abs(x) / n;
                    let acc = pdf(0) + pdf(Math.abs(x));
                    for (let i = 1; i < n; i++) acc += pdf(i * h) * (i % 2 ? 4 : 2);
                    const area = acc * h / 3;
                    return x >= 0 ? 0.5 + area : 0.5 - area;
                };
                return { pdf, cdf, inv: p => invertCDF(cdf, p, -12, 12) };
            }

            // ================= THE 150 POINTS =================
            const totalPoints = 150, perGroup = 50;
            const xScale = 0.8;      // world units per data unit on the distribution axis
            const BASE = -4;         // baseline of the dot plots
            const DOT = 0.6;         // one dot = one observation = 0.6 world units of height
            const BIN = 0.75;        // histogram bin width (data units) -> 0.6 world units = one dot wide
            const groupConfigs = [
                { mean: -10.0, color: 0x8800ff, css: '#b061ff' },
                { mean: 0.0,   color: 0x00ffff, css: '#00ffff' },
                { mean: 9.6,   color: 0x00ff00, css: '#3dff3d' }
            ];
            const CYAN = 0x00ffff, RED = 0xff2a2a, ORANGE = 0xff8800, YELLOW = 0xffe14d, PINK = 0xff3d88, BLUE = 0x2a9dff;
            const CATS = [
                { name: 'A', p: 0.15, color: 0x8800ff, css: '#b061ff' },
                { name: 'B', p: 0.25, color: 0x00ffff, css: '#00ffff' },
                { name: 'C', p: 0.40, color: 0x00ff00, css: '#3dff3d' },
                { name: 'D', p: 0.20, color: 0xffaa00, css: '#ffb733' }
            ];
            const CTRL = 0x00ffff, TRT = 0xff6a00, ARM = [{ name: 'control', color: CTRL, css: '#00ffff' }, { name: 'treatment', color: TRT, css: '#ff8a3d' }];
            // standard normal quantiles for a sample of 50 (used by the Q-Q plot)
            const QN = [];
            for (let k = 0; k < perGroup; k++) QN.push(invertCDF(normalCDF, (k + 0.5) / perGroup, -6, 6));

            const spheres = [];
            const sphereGeo = new THREE.SphereGeometry(0.3, 16, 16);
            const baseMat = new THREE.MeshStandardMaterial({ color: CYAN, emissive: CYAN, emissiveIntensity: 0.55, roughness: 0.4 });
            for (let i = 0; i < totalPoints; i++) {
                const sphere = new THREE.Mesh(sphereGeo, baseMat.clone());

            function makeDistributions() {
                const planted = Math.random() < 0.5 ? 0 : 2;   // one genuinely extreme value, on an outer edge

                const groups = groupConfigs.map((cfg, g) => {
                    const v = [];
                    for (let k = 0; k < perGroup; k++) v.push(randn() * 2.0 + cfg.mean);
                    if (g === planted) v[0] = cfg.mean + (g === 0 ? -1 : 1) * 2.0 * (3.8 + Math.random() * 0.8);
                    v.sort((a, b) => a - b);
                    const m = mean(v), s = sampleSD(v, m), med = median(v);
                    v.forEach((x, k) => {
                        const i = g * perGroup + k, bin = Math.floor(x / BIN), c = stacks[bin] || 0;
                        stacks[bin] = c + 1;
                        // FIX: a data value has no "height". Dots are stacked where they fall, so the

            function makeTimeSeries() {
                // trend + season + AR(1) noise: neighbouring errors are correlated, as in real series
                const x = [], y = [];
                let e = 0;
                for (let i = 0; i < totalPoints; i++) {
                    const t = -10 + 20 * i / (totalPoints - 1);
                    e = 0.6 * e + randn() * 0.7;
                    x.push(t); y.push(0.5 * t + 3 * Math.sin(0.8 * t) + e);
                }
                const fit = lsq(x, y, [() => 1, t => t]);
                // centred moving average over one full season (59 points) removes the cycle
                const w = 59, h = (w - 1) / 2, ma = [];
                for (let i = h; i < totalPoints - h; i++) ma.push({ x: x[i], y: mean(y.slice(i - h, i + h + 1)) });
                const res = y.map((v, i) => v - fit.f(x[i]));

                    for (let i = 0; i + lag < res.length; i++) c += res[i] * res[i + lag];
                    acf.push({ lag, r: c / den });
                }
                return { x, y, fit, ma, r1, acf, bound: 1.96 / Math.sqrt(totalPoints) };
            }

            function makePanel() {

                const pos = [], allX = [], allY = [];

            function makeObservational() {

            function makeDiD() {

            function makeRD() {
                // treated when the running variable reaches the cutoff (0); true jump = 4
                const x = [], y = [];
                for (let i = 0; i < totalPoints; i++) x.push(Math.random() * 20 - 10);
                x.sort(asc);
                x.forEach(v => y.push(-2 + 0.4 * v + (v >= 0 ? 4 : 0) + randn() * 1.2));

            function makeDose() {

                    const v = [];
                    for (let k = 0; k < 30; k++) v.push(8 * d / (1.5 + d) + randn() * 1.5);
                    const m = mean(v), half = tc * sampleSD(v, m) / Math.sqrt(30);

            function makeSurvival() {

                const T = 12, arms = [6, 10].map(mu => {

            function makeMacro() {

            function makePyramid() {

                const eq = a => { const q = (a - sfit.beta[0]) / (sfit.beta[1] - d.beta[1]); return { q, p: sfit.f(q) }; };
                // demand shifted right by SHIFT units of quantity: P = a - b (Q - SHIFT)
                return { dq, dp, sq, sp, d, s: sfit, SHIFT, e0: eq(d.beta[0]), e1: eq(d.beta[0] - d.beta[1] * SHIFT) };
            }

            function newSample() {
                const xs = [];
                for (let i = 0; i < totalPoints; i++) xs.push(Math.random() * 20 - 10);
                xs.sort((a, b) => a - b);
                D = {
                    dist: makeDistributions(),
                    lin:  makeScatter(xs, x => 0.8 * x, 1.6, (X, Y) => lsq(X, Y, [() => 1, x => x])),
                    quad: makeScatter(xs, x => 0.15 * x * x - 6, 1.3, (X, Y) => lsq(X, Y, [() => 1, x => x, x => x * x])),
                    exp:  makeScatter(xs, x => 2.5 * Math.pow(1.2, x) - 10, 1.2,
                              (X, Y) => gridFit(X, Y, 1.02, 1.60, 0.002, b => [() => 1, x => Math.pow(b, x)])),
                    sin:  makeScatter(xs, x => 6 * Math.sin(0.6 * x), 1.3,
                              (X, Y) => gridFit(X, Y, 0.20, 1.50, 0.004, w => [() => 1, x => Math.sin(w * x), x => Math.cos(w * x)])),
                    ts:   makeTimeSeries(),
                    cat:  makeCategories(),
                    samp: makeSampling(),
                    ci:   makeIntervals(),
                    tt:   makeTwoGroups(),
                    multi: makeMultiple(),
                    gdp: makeGDP(), macro: makeMacro(), incomes: makeIncomes(), pyr: makePyramid(), market: makeMarket(),
                    rct: makeRCT(), obs: makeObservational(), did: makeDiD(), rd: makeRD(), dose: makeDose(), km: makeSurvival(),
                    panel: makePanel()
                };
                D.quad.line = lsq(xs, D.quad.y, [() => 1, x => x]);      // a deliberately wrong (straight) model
                spheres.forEach(s => s.userData.home.set((Math.random() - 0.5) * 50, (Math.random() - 0.5) * 30, (Math.random() - 0.5) * 20));
            }

            // ================= DRAWING HELPERS =================
            let tempObjects = [], animators = [];
            function addTemp(obj, anim) {
                scene.add(obj); tempObjects.push(obj);
                if (anim) animators.push(anim);
                return obj;
            }
            function clearTempObjects() {
                tempObjects.forEach(obj => {
                    scene.remove(obj);
                    if (!obj.isSprite && obj.geometry) obj.geometry.dispose();
                    if (obj.material) { if (obj.material.map) obj.material.map.dispose(); obj.material.dispose(); }
                });
                tempObjects = []; animators = [];
            }
            const clamp01 = v => Math.max(0, Math.min(1, v));
            // progress 0..1 of a reveal that runs from t0 to t1 seconds into the scene
            const span = (t, t0, t1) => clamp01((t - t0) / (t1 - t0));

            // Glowing tube that can be drawn in progressively
            function makeTube(points, color, radius) {
                const radial = 6, seg = Math.max(8, points.length * 2);
                const geo = new THREE.TubeGeometry(new THREE.CatmullRomCurve3(points), seg, radius || 0.07, radial, false);
                const mesh = new THREE.Mesh(geo, new THREE.MeshBasicMaterial({ color }));
                const total = geo.index.count, chunk = radial * 6;
                mesh.userData.reveal = p => geo.setDrawRange(0, Math.floor(p * total / chunk) * chunk);
                return mesh;
            }
            function makeLine(points, color, opacity) {
                const geo = new THREE.BufferGeometry().setFromPoints(points);
                const line = new THREE.Line(geo, new THREE.LineBasicMaterial({ color, transparent: true, opacity: opacity == null ? 1 : opacity }));
                line.userData.reveal = p => geo.setDrawRange(0, Math.floor(p * points.length));
                return line;
            }
            // Many independent segments in one object: segs = [{a, b, color}]
            function makeSegments(segs, opacity) {
                const pos = new Float32Array(segs.length * 6), col = new Float32Array(segs.length * 6), c = new THREE.Color();
                segs.forEach((s, i) => {
                    pos.set([s.a.x, s.a.y, s.a.z, s.b.x, s.b.y, s.b.z], i * 6);
                    c.setHex(s.color); col.set([c.r, c.g, c.b, c.r, c.g, c.b], i * 6);
                });
                const geo = new THREE.BufferGeometry();
                geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
                geo.setAttribute('color', new THREE.BufferAttribute(col, 3));
                const obj = new THREE.LineSegments(geo, new THREE.LineBasicMaterial({ vertexColors: true, transparent: true, opacity }));
                obj.userData.reveal = p => geo.setDrawRange(0, Math.floor(p * segs.length) * 2);
                return obj;
            }
            // Add an object and reveal it between t0 and t1 (t0 === t1 -> shown immediately)
            function reveal(obj, t0, t1) {
                if (t1 <= t0) { obj.userData.reveal(1); return addTemp(obj); }
                obj.userData.reveal(0);
                return addTemp(obj, t => obj.userData.reveal(span(t, t0, t1)));
            }
            const V = (x, y, z) => new THREE.Vector3(x, y, z || 0);
            function curvePoints(f, lo, hi, step) {
                const pts = [];
                for (let x = lo; x <= hi + 1e-9; x += step) pts.push(V(x, f(x), 0));
                return pts;
            }

            // ----- sphere targets -----
            function setAll(fn) { spheres.forEach((s, i) => fn(s.userData, i, s)); }
            function toDistribution(stagger) {
                setAll((u, i) => {
                    const g = Math.floor(i / perGroup);
                    u.target.copy(D.dist.pos[i]); u.col.setHex(groupConfigs[g].color);
                    u.scale = 1; u.pulse = false; u.delay = stagger ? g * 0.35 + (i % perGroup) * 0.022 : 0;
                });
            }
            function toScatter(ds, stagger) {
                setAll((u, i) => {
                    u.target.set(ds.x[i], ds.y[i], 0); u.col.setHex(CYAN);
                    u.scale = 1; u.pulse = false; u.delay = stagger ? i * 0.006 : 0;
                });
            }

            // ----- distribution furniture -----
            function drawBaseline() { addTemp(makeLine([V(-17, BASE), V(17, BASE)], 0x2a6f8f, 0.9)); }
            function drawNormalCurves(t0, t1) {
                D.dist.groups.forEach((g, i) => {
                    const pts = [];
                    for (let k = 0; k <= 60; k++) {
                        const x = g.mean - 4 * g.sd + (8 * g.sd) * k / 60;
                        // expected dots per bin = n * binWidth * density, drawn at one DOT per observation
                        pts.push(V(x * xScale, BASE + g.n * BIN * normalPDF(x, g.mean, g.sd) * DOT, 0.05));
                    }
                    reveal(makeTube(pts, groupConfigs[i].color, 0.05), t0, t1);
                });
            }
            function drawMeasures(t0) {
                D.dist.groups.forEach((g, i) => {
                    const band = new THREE.Mesh(new THREE.PlaneGeometry(2 * g.sd * xScale, 8),
                        new THREE.MeshBasicMaterial({ color: groupConfigs[i].color, transparent: true, opacity: 0.09, depthWrite: false }));
                    band.position.set(g.mean * xScale, BASE + 4, -0.3);
                    const med = makeTube([V(g.median * xScale, BASE, 0.1), V(g.median * xScale, BASE + 6.6, 0.1)], YELLOW, 0.035);
                    const mn = makeTube([V(g.mean * xScale, BASE, 0.12), V(g.mean * xScale, BASE + 8, 0.12)], 0xffffff, 0.035);
                    reveal(med, t0, t0 + 0.8);
                    reveal(mn, t0 + 1.0, t0 + 1.8);
                    band.visible = t0 <= 0 ? true : false;
                    addTemp(band, t0 > 0 ? t => { band.visible = t > t0 + 2.0; } : null);
                });
            }
            function drawDeviations(t0, t1) {
                const segs = spheres.map((s, i) => {
                    const g = D.dist.groups[Math.floor(i / perGroup)], p = D.dist.pos[i];
                    return { a: V(g.mean * xScale, p.y, 0), b: V(p.x, p.y, 0), color: 0xffffff };
                });
                reveal(makeSegments(segs, 0.38), t0, t1);
            }
            const groupLine = (i, text) => `<span class="chip" style="background:${groupConfigs[i].css}"></span>${text}<br>`;
            const measureKey = `<span class="dim"><span class="key" style="background:#fff"></span>mean &nbsp; ` +
                               `<span class="key" style="background:#ffe14d"></span>median &nbsp; shaded band = mean &plusmn; 1 s</span>`;

            // ----- scatter furniture -----
            function drawAxes() {
                addTemp(makeLine([V(-11, 0, -0.1), V(11, 0, -0.1)], 0x2a6f8f, 0.9));
                addTemp(makeLine([V(0, -11, -0.1), V(0, 11, -0.1)], 0x2a6f8f, 0.9));
            }
            function drawFitAndResiduals(ds) {
                reveal(makeTube(curvePoints(ds.fit.f, -10, 10, 0.25), ORANGE, 0.08), 0.4, 2.4);
                // residual = observed - fitted, always measured vertically
                const segs = ds.x.map((x, i) => {
                    const yhat = ds.fit.f(x);
                    return { a: V(x, ds.y[i], 0), b: V(x, yhat, 0), color: ds.y[i] >= yhat ? 0xff6fa3 : 0x5cc8ff };
                });
                reveal(makeSegments(segs, 0.75), 2.4, 6.0);
            }
            const residualKey = `<span class="dim"><span class="key" style="background:#ff8800"></span>least-squares fit &nbsp; ` +
                                `<span class="key" style="background:#ff6fa3"></span>above &nbsp; <span class="key" style="background:#5cc8ff"></span>below</span>`;

            // ----- extra furniture for the added graphs -----
            function drawHistogram(t0, t1) {
                const bins = Object.keys(D.dist.stacks).map(Number).sort(asc), segs = [];
                bins.forEach(b => {
                    const x0 = b * BIN * xScale, x1 = (b + 1) * BIN * xScale, top = BASE + D.dist.stacks[b] * DOT;
                    segs.push({ a: V(x0, BASE, 0.35), b: V(x0, top, 0.35), color: 0xcfefff },
                              { a: V(x0, top, 0.35), b: V(x1, top, 0.35), color: 0xcfefff },
                              { a: V(x1, top, 0.35), b: V(x1, BASE, 0.35), color: 0xcfefff });
                    const bar = new THREE.Mesh(new THREE.PlaneGeometry(x1 - x0, top - BASE),
                        new THREE.MeshBasicMaterial({ color: 0x66ccff, transparent: true, opacity: 0.10, depthWrite: false }));
                    bar.position.set((x0 + x1) / 2, (top + BASE) / 2, -0.35);
                    addTemp(bar);
                });
                reveal(makeSegments(segs, 0.9), t0, t1);
            }
            function residualPlot(ds, f, S) {
                setAll((u, i) => {
                    const e = ds.y[i] - f(ds.x[i]);
                    u.target.set(ds.x[i], e * S, 0); u.col.setHex(e >= 0 ? PINK : BLUE);
                    u.scale = 1; u.pulse = false; u.delay = i * 0.004;
                });
                addTemp(makeLine([V(0, -11, -0.1), V(0, 11, -0.1)], 0x2a6f8f, 0.9));
                reveal(makeTube([V(-10.5, 0, 0), V(10.5, 0, 0)], ORANGE, 0.06), 0, 0);
            }
            function toBars() {
                setAll((u, i) => {
                    const c = D.cat.cat[i], j = D.cat.idx[i];
                    u.target.set(-9 + c * 6 + (j % 5 - 2) * 0.62, -5 + 0.31 + Math.floor(j / 5) * 0.62, 0);
                    u.col.setHex(CATS[c].color); u.scale = 1; u.pulse = false; u.delay = j * 0.012;
                });
                addTemp(makeLine([V(-12.5, -5, 0), V(12.5, -5, 0)], 0x2a6f8f, 0.9));
            }
            const catLines = extra => D.cat.counts.map((n, c) =>
                `<span class="chip" style="background:${CATS[c].css}"></span>${CATS[c].name}: ${n} (${num(100 * n / totalPoints, 1)}%)${extra ? extra(n, c) : ''}<br>`).join('');
            const pText = p => p < 0.001 ? 'p &lt; 0.001' : 'p = ' + num(p, 3);

            // ================= EMBEDDED PAGES AND SHEETS =================
            // Each of these scenes shows one original file, unchanged, in a frame (pages) or as a picture (sheets).
            const embedDiv = document.getElementById('embed');
            let embedFrame = null;
            // The eight originals sit unchanged in the six-measures folder next to this page.
            const EMB = {"sd": "standard-deviation-4d.html", "z": "z-score-4d.html", "cv": "coefficient-of-variation-4d.html", "se": "standard-error-4d.html", "skew": "skewness-4d.html", "kurt": "kurtosis-4d.html", "sum": "six-measures-summary.png", "tools": "six-measures-in-four-tools.png"};

            function showEmbed(sc) {

            // The embedded animations have their own play button; these read and set it so the main controls stay in step.

            // ================= SCENES =================

                          D.dist.groups.map((g, i) => groupLine(i, `\u03A3 deviations ${num(g.devSum)} &nbsp; s\u00B2 ${num(g.variance)} &nbsp; s ${num(g.sd)}`)).join(''));

                // ---- Outliers ----

                { ch: 'one', title: "Box Plot", dur: 9, cam: 'dist', grid: true,

                                    { a: V(X(b.q3), BY + 0.8, z), b: V(X(b.q1), BY + 0.8, z), color: c }, { a: V(X(b.q1), BY + 0.8, z), b: V(X(b.q1), BY - 0.8, z), color: c },
                                    { a: V(X(b.wlo), BY, z), b: V(X(b.q1), BY, z), color: c }, { a: V(X(b.q3), BY, z), b: V(X(b.whi), BY, z), color: c },
                                    { a: V(X(b.wlo), BY - 0.4, z), b: V(X(b.wlo), BY + 0.4, z), color: c }, { a: V(X(b.whi), BY - 0.4, z), b: V(X(b.whi), BY + 0.4, z), color: c });

                      });
                      reveal(makeSegments(segs, 1), 0.8, 2.6);
                      hud("Box = the middle 50% (Q1 to Q3), yellow line = median, whiskers reach the furthest values within 1.5 \u00D7 IQR. Anything beyond is drawn on its own. This rule uses quartiles, so the outlier cannot hide by inflating s.",
                          D.dist.groups.map((g, i) => groupLine(i, `Q1 ${num(g.box.q1)} &nbsp; median ${num(g.median)} &nbsp; Q3 ${num(g.box.q3)}`)).join('') + `Beyond the fences: ${out}`);
                  } },
                // ---- ECDF ----
                { ch: 'one', title: "Cumulative Distribution", dur: 8, cam: 'dist', grid: true,
                  enter() {
                      const H = 6;
                      setAll((u, i) => {
                          const g = Math.floor(i / perGroup), k = i % perGroup;

                      addTemp(makeLine([V(-17, BASE + H, 0), V(17, BASE + H, 0)], 0x2a6f8f, 0.9));
                      addTemp(makeLine([V(-17, BASE + H / 2, 0), V(17, BASE + H / 2, 0)], YELLOW, 0.45));
                      D.dist.groups.forEach((g, i) => {
                          const pts = [];
                          for (let k = 0; k <= 60; k++) { const x = g.mean - 4 * g.sd + 8 * g.sd * k / 60; pts.push(V(x * xScale, BASE + H * normalCDF((x - g.mean) / g.sd), -0.05)); }
                          reveal(makeTube(pts, groupConfigs[i].color, 0.04), 2.5, 4.5);
                      });
                      hud("Sort the values and climb one step per observation. The height of a dot is the share of the sample at or below its value, from 0% to 100%.",

                  } },
                // ---- Q-Q plot ----
                { ch: 'one', title: "Normal Q-Q Plot", dur: 9, cam: 'front', grid: true,
                  enter() {

                      hud("Is a sample normal? Plot its ordered values (vertical, in standard units) against the values a perfect normal sample would give (horizontal). Normal data hug the line.",

                          `<span class="dim">One panel per sample. Small wobbles at the ends are ordinary sampling noise.</span>`);

                // ---- Bar chart ----
                { ch: 'one', title: "Bar Chart for Categories", dur: 8, cam: 'front', grid: true,
                  enter() {
                      toBars();
                      hud("Categorical data have no numeric scale, so we count. Each bar is built from its observations; its height is the frequency. Bars stand apart because categories have no distance between them.",

                  } },
                // ---- Pie chart ----
                { ch: 'one', title: "Pie Chart", dur: 8, cam: 'front', grid: false,
                  enter() {
                      const cy = -1;
                      setAll((u, i) => {
                          const th = Math.PI / 2 - 2 * Math.PI * (Math.floor(i / 3) + 0.5) / 50, r = 5 + (i % 3) * 0.7;

                  } },

                // ================= SIX MEASURES IN 4D (embedded originals) =================
                embedScene('Standard Deviation in 4D', 'sd', 'page'),
                embedScene('Z-Score in 4D', 'z', 'page'),
                embedScene('Coefficient of Variation in 4D', 'cv', 'page'),
                embedScene('Standard Error in 4D', 'se', 'page'),
                embedScene('Skewness in 4D', 'skew', 'page'),
                embedScene('Kurtosis in 4D', 'kurt', 'page'),
                embedScene('Six Measures, One Page', 'sum', 'sheet', 'Summary sheet: what each of the six measures is used for and the golden rules for reading it'),
                embedScene('Six Measures in Four Tools', 'tools', 'sheet', 'Reference sheet: how to compute the six measures in Excel, Python, Stata and Minitab'),

                // ---- Skewed population ----
                { ch: 'inf', title: "A Skewed Population", dur: 8, cam: 'front', grid: true,
                  enter() {
                      const P = D.samp, X = v => -6 + v * 1.2;
                      setAll((u, i) => { u.target.copy(P.popPos[i]); u.col.setHex(CYAN); u.scale = 1; u.pulse = false; u.delay = i * 0.008; });
                      addTemp(makeLine([V(-7, -7, 0), V(20, -7, 0)], 0x2a6f8f, 0.9));
                      const pts = [];

                      reveal(makeTube(pts, 0x9fdfff, 0.05), 2.5, 4.5);
                      reveal(makeTube([V(X(P.popMedian), -7, 0.1), V(X(P.popMedian), 0, 0.1)], YELLOW, 0.035), 4.6, 5.2);
                      reveal(makeTube([V(X(P.popMean), -7, 0.12), V(X(P.popMean), 1.2, 0.12)], 0xffffff, 0.035), 5.2, 5.8);
                      hud("150 individuals drawn from a strongly right-skewed population (exponential, \u03BC = 4, \u03C3 = 4). Most values are small, a few are very large. Nothing bell-shaped here.",
                          `mean ${num(P.popMean)} &nbsp; median ${num(P.popMedian)}<br><span class="dim">The long right tail pulls the mean above the median.</span>`);
                  } },
                // ---- CLT ----
                { ch: 'inf', title: "Sampling Distribution of the Mean", dur: 9, cam: 'dist', grid: true,
                  enter() {
                      const P = D.samp;
                      setAll((u, i) => { u.target.copy(P.meansPos[i]); u.col.setHex(CYAN); u.scale = 1; u.pulse = false; u.delay = i * 0.008; });
                      addTemp(makeLine([V(-15, -5, 0), V(15, -5, 0)], 0x2a6f8f, 0.9));
                      const pts = [];
                      for (let m = 4 - 3.2; m <= 4 + 3.2; m += 0.08) pts.push(V((m - 4) * 4, -5 + totalPoints * 0.15 * normalPDF(m, 4, P.se) * DOT, 0.05));
                      reveal(makeTube(pts, ORANGE, 0.05), 3.0, 5.0);
                      reveal(makeTube([V(0, -5, 0.12), V(0, 4, 0.12)], 0xffffff, 0.035), 5.0, 5.6);
                      hud("Now each dot is the mean of a fresh sample of 30 from that skewed population. The means pile up in a bell around \u03BC: the central limit theorem. Their spread is the standard error, \u03C3 / \u221An.",
                          `Mean of the 150 sample means: ${num(P.meanOfMeans)} (\u03BC = 4)<br>Their standard deviation: ${num(P.sdOfMeans)} (\u03C3/\u221A30 = ${num(P.se)})<br>` +
                          `<span class="dim"><span class="key" style="background:#ff8800"></span>normal curve predicted by theory. The axis is magnified compared with the previous scene.</span>`);
                  } },
                // ---- Confidence intervals ----
                { ch: 'inf', title: "Confidence Intervals", dur: 10, cam: 'front', grid: true,
                  enter() {
                      const C = D.ci, S = 2.2, segs = [];
                      setAll((u, i) => {
                          const k = Math.floor(i / 3), r = i % 3, c = C.list[k];
                          u.target.set(-12.25 + k * 0.5, (r === 0 ? c.lo : r === 1 ? c.m : c.hi) * S, 0);
                          u.col.setHex(c.cover ? CYAN : RED); u.scale = r === 1 ? 0.8 : 0.4; u.pulse = false; u.delay = k * 0.04;
                      });
                      C.list.forEach((c, k) => segs.push({ a: V(-12.25 + k * 0.5, c.lo * S, 0), b: V(-12.25 + k * 0.5, c.hi * S, 0), color: c.cover ? CYAN : RED }));
                      reveal(makeSegments(segs, 0.9), 2.5, 5.5);
                      reveal(makeTube([V(-13.2, 0, -0.1), V(13.2, 0, -0.1)], ORANGE, 0.05), 0.2, 1.4);
                      hud("50 separate samples, 50 intervals: mean \u00B1 t \u00D7 s/\u221An. In the long run 95% of intervals built this way cover the true \u03BC (orange). The red ones missed, and from inside one sample you cannot tell which kind you have.",
                          `${C.covered} of 50 cover \u03BC (expected about 47.5)<br><span class="dim">n = 20 per sample, t = ${num(C.tcrit, 3)} with 19 degrees of freedom</span>`);
                  } },
                // ---- Two groups ----
                { ch: 'inf', title: "Comparing Two Groups", dur: 8, cam: 'front', grid: true,
                  enter() {
                      const T = D.tt;
                      setAll((u, i) => { u.target.copy(T.pos[i]); u.col.setHex(i < 75 ? groupConfigs[0].color : groupConfigs[2].color); u.scale = 1; u.pulse = false; u.delay = (i % 75) * 0.012; });
                      addTemp(makeLine([V(-13, 0, 0), V(13, 0, 0)], 0x2a6f8f, 0.9));
                      addTemp(makeLine([V(-13, -6.5, 0), V(13, -6.5, 0)], 0x2a6f8f, 0.9));
                      reveal(makeTube([V(T.ma * 1.6, 0, 0.12), V(T.ma * 1.6, 5.5, 0.12)], 0xffffff, 0.035), 2.6, 3.2);
                      reveal(makeTube([V(T.mb * 1.6, -6.5, 0.12), V(T.mb * 1.6, -1, 0.12)], 0xffffff, 0.035), 3.2, 3.8);
                      reveal(makeTube([V(T.ma * 1.6, -0.5, 0.12), V(T.mb * 1.6, -0.5, 0.12)], ORANGE, 0.07), 4.2, 5.0);
                      hud("Two independent samples on the same scale. Their means differ, but two samples never match exactly. Is this gap bigger than chance alone would produce?",
                          groupLine(0, `group 1: mean ${num(T.ma)} &nbsp; s ${num(T.sa)} &nbsp; n 75`) + groupLine(2, `group 2: mean ${num(T.mb)} &nbsp; s ${num(T.sb)} &nbsp; n 75`) +
                          `<span class="eq">difference = ${num(T.mb - T.ma)}</span> &nbsp; standard error ${num(T.se)}`);
                  } },
                // ---- t-test ----
                { ch: 'inf', title: "Hypothesis Test (t-test)", dur: 10, cam: 'dist', grid: true,
                  enter() {
                      const T = D.tt, S = 3.2;
                      setAll((u, i) => { u.target.copy(T.tPos[i]); u.col.setHex(Math.abs(T.tq[i]) > T.crit ? RED : CYAN); u.scale = 1; u.pulse = false; u.delay = i * 0.006; });
                      addTemp(makeLine([V(-16, -5, 0), V(16, -5, 0)], 0x2a6f8f, 0.9));
                      const pts = [];
                      for (let q = -4.5; q <= 4.5; q += 0.1) pts.push(V(q * S, -5 + totalPoints * 0.1875 * T.dist.pdf(q) * DOT, 0.05));
                      reveal(makeTube(pts, 0x9fdfff, 0.05), 2.5, 4.2);
                      addTemp(makeLine([V(-T.crit * S, -5, 0.1), V(-T.crit * S, 3, 0.1)], RED, 0.9));
                      addTemp(makeLine([V(T.crit * S, -5, 0.1), V(T.crit * S, 3, 0.1)], RED, 0.9));
                      const X = Math.max(-15.5, Math.min(15.5, T.t * S));
                      reveal(makeTube([V(X, -5, 0.15), V(X, 4.5, 0.15)], ORANGE, 0.07), 4.8, 5.8);
                      const sig = T.p < 0.05;
                      hud("If the two groups truly had the same mean (H\u2080), the statistic t = difference / standard error would follow this curve. The red tails hold the most extreme 5%. The orange line is the t we observed.",
                          `<span class="eq">t = ${num(T.t)}</span> &nbsp; df = ${num(T.df, 1)} &nbsp; ${pText(T.p)}<br>Critical values \u00B1${num(T.crit, 3)}<br>` +
                          (sig ? `Reject H\u2080 at the 5% level.` : `Do not reject H\u2080. <span class="dim">That is lack of evidence, not proof of no difference.</span>`) +
                          (Math.abs(T.t * S) > 15.5 ? `<br><span class="dim">Observed t is off the chart; the line is drawn at the edge.</span>` : ''));
                  } },
                // ---- ANOVA ----
                { ch: 'inf', title: "Analysis of Variance (ANOVA)", dur: 9, cam: 'dist', grid: true,
                  enter() {
                      const A = D.dist.anova;
                      toDistribution(false); drawBaseline(); drawDeviations(0, 0);
                      D.dist.groups.forEach((g, i) => {
                          reveal(makeTube([V(g.mean * xScale, BASE, 0.12), V(g.mean * xScale, BASE + 8, 0.12)], 0xffffff, 0.035), 0, 0);
                          reveal(makeTube([V(A.grand * xScale, BASE - 0.9 - i * 0.6, 0.1), V(g.mean * xScale, BASE - 0.9 - i * 0.6, 0.1)], groupConfigs[i].color, 0.08), 1.6 + i * 0.5, 2.6 + i * 0.5);
                      });
                      reveal(makeTube([V(A.grand * xScale, BASE - 2.6, 0.12), V(A.grand * xScale, BASE + 8, 0.12)], ORANGE, 0.05), 0.4, 1.4);
                      hud("With three or more groups, compare two kinds of spread: how far the group means sit from the grand mean (thick bars) and how far observations sit from their own group mean (thin lines). F is their ratio.",
                          `<span class="eq">F = ${num(A.F, 1)}</span> &nbsp; df = (${A.dfb}, ${A.dfw})<br>5% critical value 3.06, so the means are not all equal.<br>` +
                          `<span class="dim"><span class="key" style="background:#ff8800"></span>grand mean. F near 1 would mean the groups could share one mean.</span>`);
                  } },
                // ---- Chi-square ----
                { ch: 'inf', title: "Chi-Square Test for Counts", dur: 9, cam: 'front', grid: true,
                  enter() {
                      const C = D.cat, y = -5 + C.expected / 5 * 0.62;
                      toBars();
                      CATS.forEach((c, k) => reveal(makeTube([V(-9 + k * 6 - 2.1, y, 0.4), V(-9 + k * 6 + 2.1, y, 0.4)], ORANGE, 0.06), 2.0 + k * 0.4, 2.8 + k * 0.4));
                      const sig = C.chi2 > 7.815;
                      hud("For counts, compare what we observed (O) with what a hypothesis expects (E). Here H\u2080 says the four categories are equally common, so each expects 37.5 (orange). \u03C7\u00B2 = \u03A3 (O \u2212 E)\u00B2 / E.",
                          catLines((n) => ` &nbsp; O \u2212 E = ${num(n - C.expected, 1)}`) +
                          `<span class="eq">\u03C7\u00B2 = ${num(C.chi2)}</span> &nbsp; df = 3 &nbsp; 5% critical value 7.81<br>` +
                          (sig ? `Reject H\u2080: the categories are not equally common.` : `Do not reject H\u2080.`));
                  } },

                          `r = ${num(D.lin.r, 3)}<br><span class="dim">Correlation describes association; on its own it does not show cause.</span>`);

                // ---- Residual plot ----
                { ch: 'reg', title: "Residual Plot", dur: 8, cam: 'front', grid: true,
                  enter() {
                      const ds = D.lin, se = Math.sqrt(ds.fit.sse / (totalPoints - 2)), S = 1.5;
                      residualPlot(ds, ds.fit.f, S);
                      addTemp(makeLine([V(-10.5, 2 * se * S, 0), V(10.5, 2 * se * S, 0)], 0xffffff, 0.35));
                      addTemp(makeLine([V(-10.5, -2 * se * S, 0), V(10.5, -2 * se * S, 0)], 0xffffff, 0.35));
                      hud("Remove the fitted line and plot only what is left over. A sound model leaves a shapeless band around zero: no curve, no funnel. This is the standard check on a regression.",
                          `Mean residual ${num(mean(ds.x.map((x, i) => ds.y[i] - ds.fit.f(x))))} &nbsp; residual standard error ${num(se)}<br>` +
                          `<span class="dim">Faint lines mark \u00B12 standard errors. Vertical scale magnified 1.5\u00D7.</span>`);
                  } },
                // ---- Multiple regression ----
                { ch: 'reg', title: "Multiple Regression", dur: 11, cam: 'panel', grid: false, floor: true,
                  enter() {
                      const M = D.multi, f = (a, b) => M.fit.f([a, b]), segs = [], grid = [];
                      setAll((u, i) => { u.target.set(M.pts[i][0], M.y[i], M.pts[i][1]); u.col.setHex(CYAN); u.scale = 1; u.pulse = false; u.delay = i * 0.006; });
                      for (let a = -9; a <= 9; a += 3) {
                          grid.push({ a: V(a, f(a, -9), -9), b: V(a, f(a, 9), 9), color: ORANGE }, { a: V(-9, f(-9, a), a), b: V(9, f(9, a), a), color: ORANGE });
                      }
                      reveal(makeSegments(grid, 0.8), 2.0, 3.6);
                      const geo = new THREE.BufferGeometry();
                      geo.setAttribute('position', new THREE.BufferAttribute(new Float32Array([
                          -9, f(-9, -9), -9,  9, f(9, -9), -9,  9, f(9, 9), 9,   -9, f(-9, -9), -9,  9, f(9, 9), 9,  -9, f(-9, 9), 9]), 3));
                      const plane = new THREE.Mesh(geo, new THREE.MeshBasicMaterial({ color: ORANGE, transparent: true, opacity: 0.13, side: THREE.DoubleSide, depthWrite: false }));
                      plane.visible = false;
                      addTemp(plane, t => { plane.visible = t > 3.4; });
                      M.pts.forEach((p, i) => { const yh = f(p[0], p[1]); segs.push({ a: V(p[0], M.y[i], p[1]), b: V(p[0], yh, p[1]), color: M.y[i] >= yh ? PINK : BLUE }); });
                      reveal(makeSegments(segs, 0.75), 4.0, 7.5);

                // ---- Sinusoidal regression ----
                { ch: 'non', title: "Non-Linear Regression (Sinusoidal)", dur: 9, cam: 'front', grid: true,
                  enter() {

                // ---- Time series ----
                { ch: 'time', title: "Time Series Data", dur: 7, cam: 'front', grid: true,
                  enter() {
                      toScatter(D.ts, true); drawAxes();
                      hud("One variable observed at 150 equally spaced times. Order now matters: each value is related to the ones just before it.",

                  } },
                // ---- Time series trend ----
                { ch: 'time', title: "Time Series Trend", dur: 9, cam: 'front', grid: true,
                  enter() {
                      toScatter(D.ts, false); drawAxes();
                      const ts = D.ts;
                      reveal(makeLine(ts.x.map((x, i) => V(x, ts.y[i], 0)), 0xffffff, 0.55), 0.2, 2.6);
                      reveal(makeTube(ts.ma.map(p => V(p.x, p.y, 0.05)), YELLOW, 0.07), 2.8, 4.6);
                      reveal(makeTube(curvePoints(ts.fit.f, -10, 10, 0.5), ORANGE, 0.07), 4.8, 6.2);
                      hud("Connect the points in time order, smooth out the season with a moving average, then estimate the trend.",
                          `<span class="eq">trend = ${num(ts.fit.beta[0])} ${signed(ts.fit.beta[1])}t</span><br>` +
                          `Lag-1 autocorrelation after detrending: ${num(ts.r1, 2)}<br>` +
                          `<span class="dim"><span class="key" style="background:#ffe14d"></span>moving average (one season) &nbsp; ` +
                          `<span class="key" style="background:#ff8800"></span>least-squares trend</span>`);
                  } },
                // ---- Correlogram ----
                { ch: 'time', title: "Autocorrelation (Correlogram)", dur: 9, cam: 'front', grid: true,
                  enter() {
                      const A = D.ts.acf, H = 6, bound = D.ts.bound, segs = [];
                      setAll((u, i) => {
                          const k = Math.floor(i / 5), j = i % 5 + 1, a = A[k];

                          u.col.setHex(Math.abs(a.r) > bound ? CYAN : 0x2f6f85); u.scale = j === 5 ? 0.8 : 0.4; u.pulse = false; u.delay = k * 0.04;
                      });
                      A.forEach((a, k) => segs.push({ a: V(-8.5 + k * 0.62, 0, 0), b: V(-8.5 + k * 0.62, a.r * H, 0), color: Math.abs(a.r) > bound ? CYAN : 0x2f6f85 }));
                      reveal(makeSegments(segs, 0.8), 1.5, 4.0);
                      addTemp(makeLine([V(-9.3, 0, -0.1), V(10.3, 0, -0.1)], 0x2a6f8f, 0.9));
                      addTemp(makeLine([V(-9.3, bound * H, 0), V(10.3, bound * H, 0)], RED, 0.8));
                      addTemp(makeLine([V(-9.3, -bound * H, 0), V(10.3, -bound * H, 0)], RED, 0.8));
                      const low = A.reduce((m, a) => a.r < m.r ? a : m, A[0]);
                      hud("Correlate the detrended series with a copy of itself shifted by k steps. Each stem is one lag (3, 6, \u2026, 90). Stems outside the red band are larger than pure noise would give.",
                          `Lag 3: r = ${num(A[0].r)} &nbsp; lowest at lag ${low.lag}: r = ${num(low.r)}<br>` +
                          `<span class="dim">The wave is the season: values half a cycle apart move oppositely, a full cycle apart (about 59 steps) together again.</span>`);
                  } },
                // ---- Panel data ----
                { ch: 'time', title: "Panel Data", dur: 8, cam: 'panel', grid: false, floor: true,
                  enter() {
                      setAll((u, i) => {

                          reveal(makeTube([V(-10, e.fit.f(-10), e.z), V(10, e.fit.f(10), e.z)], 0xffffff, 0.05), 4.0 + g * 0.5, 5.2 + g * 0.5);

                // ================= TREATMENT AND CONTROL GROUPS =================
                // ---- Random assignment ----
                { ch: 'trt', title: "Random Assignment", dur: 10, cam: 'front', grid: true,
                  enter() {
                      const R = D.rct;
                      this.split = false;
                      setAll((u, i) => { u.target.set(-4.34 + (i % 15) * 0.62, -2.8 + Math.floor(i / 15) * 0.62, 0); u.col.setHex(0xbfd8e6); u.scale = 1; u.pulse = false; u.delay = 0; });
                      addTemp(makeLine([V(-15.5, -5, 0), V(15.5, -5, 0)], 0x2a6f8f, 0.9), t => { tempObjects[0].visible = t > 2.6; });
                      tempObjects[0].visible = false;
                      R.ci.forEach((c, a) => {
                          const x = (a ? 8 : -8) + (c.baseMean - 50) * 0.25;
                          reveal(makeTube([V(x, -5, 0.12), V(x, 1.5, 0.12)], 0xffffff, 0.035), 6.0, 6.8);
                      });
                      hud("Start with 150 comparable units. Chance alone decides who gets the treatment, so the two groups are alike on average in everything, measured or not, before the treatment starts.",

                          `<span class="chip" style="background:${ARM[1].css}"></span>treatment n = 75, baseline mean ${num(R.ci[1].baseMean, 1)}<br>` +
                          `<span class="dim">Each plot shows a baseline characteristic. The small gap between the means is chance imbalance.</span>`);
                  },
                  update(t) {
                      if (t > 2.6 && !this.split) {
                          this.split = true;
                          setAll((u, i) => { u.target.copy(D.rct.basePos[i]); u.col.setHex(ARM[D.rct.arm[i]].color); u.delay = 2.6 + D.rct.rank[i] * 0.012; });
                      }

                // ---- Treatment effect ----
                { ch: 'trt', title: "Treatment Effect with 95% Confidence Intervals", dur: 10, cam: 'front', grid: true,
                  enter() {
                      const R = D.rct, Y = v => (v - R.gm) * 0.35, w = R.w;
                      setAll((u, i) => { u.target.copy(R.outPos[i]); u.col.setHex(ARM[R.arm[i]].color); u.scale = 0.9; u.pulse = false; u.delay = R.rank[i] * 0.008; });
                      R.ci.forEach((c, a) => {
                          const x = a ? 2.6 : -2.6;

                          reveal(makeTube([V(x - 0.5, Y(c.m), 0.1), V(x + 0.5, Y(c.m), 0.1)], 0xffffff, 0.07), 2.5, 3.3);
                          addTemp(makeLine([V(x - 0.4, Y(c.lo), 0.1), V(x + 0.4, Y(c.lo), 0.1)], 0xffffff, 1));
                          addTemp(makeLine([V(x - 0.4, Y(c.hi), 0.1), V(x + 0.4, Y(c.hi), 0.1)], 0xffffff, 1));

                      reveal(makeTube([V(0, Y(R.ci[0].m), 0.1), V(0, Y(R.ci[1].m), 0.1)], YELLOW, 0.09), 4.2, 5.2);
                      hud("After the treatment, measure the outcome. Because assignment was random, the difference between the group means estimates the average treatment effect (yellow). White bars are each mean with its 95% confidence interval.",
                          `<span class="chip" style="background:${ARM[0].css}"></span>control mean ${num(w.ma)} &nbsp; <span class="chip" style="background:${ARM[1].css}"></span>treatment mean ${num(w.mb)}<br>` +
                          `<span class="eq">effect = ${num(w.diff)}</span> &nbsp; 95% CI ${num(w.lo)} to ${num(w.hi)}<br>` +

                // ---- Confounding ----
                { ch: 'trt', title: "Without Randomisation: Confounding", dur: 11, cam: 'front', grid: true,

                      [0, 1].forEach(a => {

                      reveal(makeTube([V(0, Y(f(50, 0)), 0.2), V(0, Y(f(50, 1)), 0.2)], YELLOW, 0.09), 6.4, 7.2);
                      hud("Here people chose their own group, and those with a high baseline (horizontal axis) chose treatment more often. The raw gap between group means (white, right) mixes the treatment with that head start. Comparing like with like, the gap between the parallel lines (yellow) is the adjusted effect.",
                          `<span class="chip" style="background:${ARM[0].css}"></span>baseline mean ${num(O.b0, 1)} &nbsp; <span class="chip" style="background:${ARM[1].css}"></span>baseline mean ${num(O.b1, 1)}<br>` +
                          `Naive difference ${num(O.naive)} &nbsp; <span class="eq">adjusted ${num(O.adjusted)}</span> &nbsp; true 6<br>` +
                          `<span class="dim">Adjustment only removes confounders you measured. Randomisation handles the rest.</span>`);
                  } },
                // ---- Difference in differences ----
                { ch: 'trt', title: "Difference-in-Differences", dur: 12, cam: 'front', grid: true,
                  enter() {
                      const A = D.did, X = p => (p - 7) * 1.3, Y = v => (v - 6) * 1.3;

                      hud("When you cannot randomise: follow both groups before and after the treatment starts (white line). The control group shows what time alone did. Shift its path up to the treated group's starting level (thin yellow) and the remaining gap is the effect.",

                // ---- Regression discontinuity ----

                      addTemp(makeLine([V(-11, -8, -0.1), V(11, -8, -0.1)], 0x2a6f8f, 0.9));

                      reveal(makeTube([V(0, R.fl.f(0), 0.2), V(0, R.fr.f(0), 0.2)], YELLOW, 0.1), 5.2, 6.0);
                      hud("Treatment is given by a rule: everyone at or above a cutoff score (white line) gets it. Units just either side of the cutoff are almost identical, so the jump between the two fitted lines at the cutoff is the effect there.",
                          `<span class="chip" style="background:${ARM[0].css}"></span>below cutoff n = ${R.nL} &nbsp; <span class="chip" style="background:${ARM[1].css}"></span>at or above n = ${R.nR}<br>` +
                          `<span class="eq">jump at cutoff = ${num(R.jump)}</span> &nbsp; true 4<br>` +
                          `<span class="dim">A local estimate: it speaks for units near the cutoff, not for everyone.</span>`);

                // ---- Dose response ----
                { ch: 'trt', title: "Dose-Response", dur: 10, cam: 'front', grid: true,
                  enter() {
                      const Dz = D.dose, Y = v => (v - 3.5) * 1.3, c0 = new THREE.Color(CTRL), c1 = new THREE.Color(TRT);
                      setAll((u, i) => { const d = Math.floor(i / 30); u.target.copy(Dz.pos[i]); u.col.copy(c0).lerp(c1, d / 4); u.scale = 0.9; u.pulse = false; u.delay = d * 0.35 + (i % 30) * 0.01; });
                      addTemp(makeLine([V(-13, Y(0), -0.1), V(13, Y(0), -0.1)], 0x2a6f8f, 0.9));
                      Dz.stats.forEach((s, d) => {

                          reveal(makeTube([V(x - 0.6, Y(s.m), 0.4), V(x + 0.6, Y(s.m), 0.4)], 0xffffff, 0.07), 3.0 + d * 0.3, 3.6 + d * 0.3);

                      reveal(makeLine(Dz.stats.map((s, d) => V(-10 + d * 5, Y(s.m), 0.4)), YELLOW, 1), 5.0, 6.5);
                      hud("More than two arms: a control group (dose 0, left) and four increasing doses. If the outcome climbs step by step with the dose, that pattern is much harder to explain by chance or bias than a single difference.",
                          Dz.stats.map((s, d) => `dose ${d}: mean ${num(s.m)}`).join(' &nbsp; ') +
                          `<br><span class="dim">White bars: mean and 95% CI. The gains shrink at high doses, so a straight line would misdescribe it.</span>`);
                  } },
                // ---- Survival ----
                { ch: 'trt', title: "Survival Curves (Kaplan-Meier)", dur: 12, cam: 'front', grid: true,
                  enter() {
                      const K = D.km, X = t => -6 + t * 16 / K.T, Y = sv => -7 + 11 * sv;
                      setAll((u, i) => {

                      });

                          `<span class="chip" style="background:${ARM[0].css}"></span>control: median ${med(K.arms[0])}, ${num(100 * K.arms[0].sEnd, 0)}% event-free at 12 months<br>` +
                          `<span class="chip" style="background:${ARM[1].css}"></span>treatment: median ${med(K.arms[1])}, ${num(100 * K.arms[1].sEnd, 0)}% event-free at 12 months<br>` +
                          `Log-rank test: \u03C7\u00B2 = ${num(K.chi2)}, ${pText(K.p)}<br>` +
