            // ================= HUD, PROGRESS, CONTROLS =================
            const chapterDiv = document.getElementById('chapter');
            const statusDiv = document.getElementById('status');
            const noteDiv = document.getElementById('note');
            const statsDiv = document.getElementById('stats');
            function hud(note, stats) { noteDiv.textContent = note; statsDiv.innerHTML = stats; }

            const progressDiv = document.getElementById('progress');
            const segFills = scenes.map((sc, i) => {
                const b = document.createElement('button');
                b.title = `${i + 1}. ${sc.title}`; b.setAttribute('aria-label', b.title);
                b.innerHTML = '<span><i></i></span>';
                b.addEventListener('click', () => goTo(i));
                progressDiv.appendChild(b);
                return b;
            });

            let cur = 0, sceneT = 0, paused = false, time = 0, tocOpen = false;

            // ----- contents screen: chapters and scenes, built from the scene list -----
            const tocDiv = document.getElementById('toc'), tocList = document.getElementById('tocList'), tocButtons = [];
            (function () {
                let box = null, last = null, chapters = 0;
                scenes.forEach((sc, i) => {
                    if (sc.ch !== last) {
                        last = sc.ch; chapters++;
                        box = document.createElement('div'); box.className = 'tocCh';
                        const h = document.createElement('h2');
                        h.textContent = chapters + '. ' + CH[sc.ch];
                        box.appendChild(h); tocList.appendChild(box);
                        const why = document.createElement('p'); why.className = 'tocWhy'; why.textContent = CHWHY[sc.ch] || ''; box.appendChild(why);
                    }
                    const b = document.createElement('button'), n = document.createElement('i');
                    n.textContent = i + 1;
                    b.appendChild(n); b.appendChild(document.createTextNode(sc.title));
                    b.addEventListener('click', () => { goTo(i); closeToc(); });
                    box.appendChild(b); tocButtons.push(b);
                });
                tocList.querySelectorAll('.tocCh').forEach(bx => {
                    const s = document.createElement('span');
                    s.textContent = bx.querySelectorAll('button').length + ' scenes';
                    bx.querySelector('h2').appendChild(s);
                });
                document.getElementById('tocSub').textContent = scenes.length + ' animated scenes in ' + chapters +
                    ' chapters. Each chapter states its objective and each scene says why the topic is used. Choose a scene to jump straight to it, or play them all in order. Every loop draws fresh data.';
            })();
            function openToc() {
                tocOpen = true;
                setInner(false);
                tocButtons.forEach((b, i) => b.classList.toggle('cur', i === cur));
                tocDiv.classList.add('open');
                const c = tocButtons[cur];
                if (cur > 0 && c.scrollIntoView) c.scrollIntoView({ block: 'center' });
            }
            function closeToc() { tocOpen = false; tocDiv.classList.remove('open'); setInner(!paused); }
            document.getElementById('tocStart').addEventListener('click', () => { goTo(0); closeToc(); });
            document.getElementById('tocClose').addEventListener('click', closeToc);
            document.getElementById('contents').addEventListener('click', openToc);
            function goTo(i) {
                clearTempObjects();
                cur = (i + scenes.length) % scenes.length;
                sceneT = 0; userCam = false;
                const sc = scenes[cur];
                gridHelper.visible = !!sc.grid;
                floorGrid.visible = !!sc.floor;
                chapterDiv.textContent = CH[sc.ch];
                setWhy(document.getElementById('why'), WHY[sc.title]); setWhy(document.getElementById('whyBar'), WHY[sc.title]);
                statusDiv.innerText = `Scene ${cur + 1}: ${sc.title}`;
                sc.enter();
                showEmbed(sc);
                segFills.forEach((b, k) => { b.classList.toggle('done', k < cur); b.firstChild.firstChild.style.width = k < cur ? '' : '0'; });
            }
            function next() { if (cur === scenes.length - 1) newSample(); goTo(cur + 1); }   // each loop draws a fresh sample
            function prev() { goTo(cur - 1); }
            function togglePause() {
                paused = !paused;
                setInner(!paused);
                document.getElementById('playIcon').setAttribute('d', paused ? 'M4 2v12l9-6z' : 'M3 2h4v12H3zM9 2h4v12H9z');
                document.getElementById('play').setAttribute('aria-label', paused ? 'Play' : 'Pause');
            }
            document.getElementById('prev').addEventListener('click', prev);
            document.getElementById('next').addEventListener('click', next);
            document.getElementById('play').addEventListener('click', togglePause);
            let glowOn = true;
            function toggleNotes() {
                const off = document.body.classList.toggle('compact');
                document.getElementById('notes').setAttribute('aria-label', off ? 'Show notes' : 'Hide notes');
            }
            function toggleGlow() {
                glowOn = !glowOn;
                document.getElementById('glow').setAttribute('aria-label', glowOn ? 'Turn glow off' : 'Turn glow on');
            }
            document.getElementById('notes').addEventListener('click', toggleNotes);
            document.getElementById('glow').addEventListener('click', toggleGlow);
            window.addEventListener('keydown', e => {
                if (e.code === 'KeyC') { tocOpen ? closeToc() : openToc(); return; }
                if (tocOpen) { if (e.code === 'Escape') closeToc(); return; }      // other keys act on the contents screen itself
                if (e.code === 'Space') { e.preventDefault(); togglePause(); }
                else if (e.code === 'ArrowRight') next();
                else if (e.code === 'ArrowLeft') prev();
                else if (e.code === 'KeyN') toggleNotes();
                else if (e.code === 'KeyG') toggleGlow();
            });

            // ================= ANIMATION LOOP =================
            const clock = new THREE.Clock();
            const calm = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
            const desiredCam = new THREE.Vector3();
            const uiDiv = document.getElementById('ui'), barDiv = document.getElementById('bar'), errorDiv = document.getElementById('error');
            let viewShift = 0;
            // On narrow screens the notes panel spans the full width, so move the picture into the free space below it.
            function wantedShift() {
                const r = uiDiv.getBoundingClientRect(), W = window.innerWidth, H = window.innerHeight;
                if (r.width < W * 0.55) return 0;
                return Math.max(0, (r.bottom + (H - barDiv.offsetHeight)) / 2 - H / 2);
            }

            function animate() {
                requestAnimationFrame(animate);
                try { frame(); } catch (err) { errorDiv.innerText = "Animation error: " + err.message; console.error(err); }
            }
            function frame() {
                const delta = Math.min(clock.getDelta(), 0.1);
                time += delta;
                if (!paused && !tocOpen) sceneT += delta;      // the scene waits while the contents screen is open

                const sc = scenes[cur];
                if (sc.update) sc.update(sceneT, time);
                animators.forEach(fn => fn(sceneT));

                // frame-rate independent easing toward each sphere's target
                const kMove = 1 - Math.exp(-delta * 4.5), kCol = 1 - Math.exp(-delta * 6);
                spheres.forEach(s => {
                    const u = s.userData;
                    if (sceneT >= u.delay) s.position.lerp(u.target, kMove);
                    s.material.color.lerp(u.col, kCol);
                    s.material.emissive.copy(s.material.color);
                    const want = u.scale * (u.pulse ? 1 + 0.22 * Math.sin(time * 6) : 1);
                    s.scale.setScalar(s.scale.x + (want - s.scale.x) * kCol);
                });

                // camera: gentle guided moves until the viewer takes over by dragging
                if (!userCam) {
                    const d = camDist(), sway = calm ? 0 : 1;
                    if (sc.cam === 'orbit') { const a = calm ? 0 : time * 0.12; desiredCam.set(Math.sin(a) * d, 4, Math.cos(a) * d); }
                    else if (sc.cam === 'panel') desiredCam.set(-0.58 * d + sway * Math.sin(time * 0.25) * 3, 0.36 * d, 0.80 * d);
                    else { const z = sc.cam === 'dist' ? 0.72 * d : d; desiredCam.set(sway * Math.sin(time * 0.22) * 3.5, 1 + sway * Math.sin(time * 0.17), z); }
                    camera.position.lerp(desiredCam, 1 - Math.exp(-delta * 1.8));
                }
                controls.update();
                if (stars && !calm) stars.rotation.y += delta * 0.004;

                segFills[cur].firstChild.firstChild.style.width = (clamp01(sceneT / sc.dur) * 100).toFixed(1) + '%';
                if (sceneT > sc.dur) next();

                viewShift += (wantedShift() - viewShift) * (1 - Math.exp(-delta * 5));
                if (viewShift > 0.5) camera.setViewOffset(window.innerWidth, window.innerHeight, 0, -viewShift, window.innerWidth, window.innerHeight);
                else if (camera.view) camera.clearViewOffset();

                if (scenes[cur].embed) return;      // an embedded page covers the stage, so skip drawing behind it
                if (composer && glowOn) composer.render(); else renderer.render(scene, camera);
            }

            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
                if (composer) composer.setSize(window.innerWidth, window.innerHeight);
                document.documentElement.style.setProperty('--barh', document.getElementById('bar').offsetHeight + 'px');
            });

            newSample();
            goTo(0);
            openToc();
            animate();

        } catch (err) {
            document.getElementById('status').innerText = "Error:";
            document.getElementById('stats').innerText = "";
            document.getElementById('error').innerText = err.message;
            console.error(err);
        }
    </script>
</body>
</html>
