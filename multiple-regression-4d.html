    #tbl table.nofit th:nth-child(n+5), #tbl table.nofit td:nth-child(n+5) { display: none; }

        for (k = 0; k < 8; k++) {
            var z1 = Math.sqrt(-2 * Math.log(rg() + 1e-9)) * Math.cos(2 * Math.PI * rg()), z2 = Math.sqrt(-2 * Math.log(rg() + 1e-9)) * Math.cos(2 * Math.PI * rg());
            if (g14 > 0) { var d1 = z1 * SE[1], d2 = z2 * SE[2]; ghosts[k].set([B[0] - d1 * X1M - d2 * X2M, B[1] + d1, B[2] + d2], 3, 15, 0, 11, g14 * ph(14.1 + k * 0.04, 14.3 + k * 0.04)); }
            else if (g16 > 0) { var wv = 1.3 * Math.sin(T * 9 + k * 0.8); ghosts[k].set([B[0] - wv * FLR.a, B[1] - wv * FLR.b, B[2] + wv], 3, 15, 0, 11, g16); }
            else ghosts[k].set(B, 3, 15, 0, 11, 0);
        }
        lbV.p.set(WX(11.5), WY(27), WZ(1)); lbV.a = g16; setText(lbV, 'x₁ and x₂ almost in a line → VIF very large');
        // ----- F test towers (step 15) -----
        var fa = vis(15, 16), fs = 0.05, rx = MX - 0.2, ex = MX + 1.6;
        twR.visible = twE.visible = fa > 0.01; twR.scale.set(1, Math.max(MSR * fs * ph(15.15, 15.45), 0.01), 1); twR.position.set(rx, 0, MZ0); twE.scale.set(1, Math.max(S2 * fs * ph(15.45, 15.6), 0.01), 1); twE.position.set(ex, 0, MZ0);
        lbTR.p.set(rx + 0.5, MSR * fs + 0.4, MZ0); lbTR.a = fa * ph(15.3, 15.45); setText(lbTR, 'MS regression ' + f1(MSR));
        lbTE.p.set(ex + 0.5, S2 * fs + 0.45, MZ0); lbTE.a = fa * ph(15.55, 15.65); setText(lbTE, 'MS residual ' + f2(S2));
        lbF.p.set(rx + 1.3, MSR * fs + 1.2, MZ0); lbF.a = fa * ph(15.65, 15.8); setText(lbF, 'F = ' + f1(MSR) + ' ÷ ' + f2(S2) + ' = ' + f1(FV));
        lbZero.p.set(WX(15) + 0.3, WY(YM), 0); lbZero.a = un * (1 - ph(18.0, 18.1)); setText(lbZero, 'residual = 0');

        // ----- table -----
        var kind = step === 14 || step === 16 || step === 18 ? 'coef' : step === 15 ? 'anova' : 'data';
        buildTable(kind);
        if (kind === 'data') {
            setFitCols(T >= 7.6);
            var rev = step === 0 ? Math.floor((w - 0.06) / 0.06) + 1 : N, hl = [];
            if (step === 1) hl = [Math.min(N - 1, Math.max(0, Math.floor((w - 0.1) / 0.06)))];
            markRows(rev, hl);
        } else markRows(99, step === 14 ? (w > 0.5 ? [1, 2] : []) : step === 15 ? [0] : []);

        // ----- stats line -----
        var st = '';
        if (step === 0) st = '12 houses · 3 numbers each';
        else if (step === 2) st = 'size alone: ŷ = ' + f2(SM1.a) + ' + ' + f2(SM1.b) + 'x₁ · R² = <b>' + f2(SM1.r2) + '</b>';
        else if (step === 3) st = 'distance alone: ŷ = ' + f2(SM2.a) + ' + ' + f2(SM2.b) + 'x₂ · R² = <b>' + f2(SM2.r2) + '</b>';
        else if (step === 4) st = 'correlation of size and distance: <b>' + f2(FLR.r) + '</b>';
        else if (step === 6 || step === 7) st = 'sum of squared residuals = <b>' + f1(sse) + '</b>';
        else if (step === 8) st = 'b₁ = <b>' + f2(B[1]) + '</b>: +1 size → price +' + f2(B[1]) + ', distance fixed';
        else if (step === 9) st = 'b₂ = <b>' + f2(B[2]) + '</b>: +1 km → price −' + f2(-B[2]) + ', size fixed';
        else if (step === 10) st = 'size alone <b>' + f2(SM1.b) + '</b> vs size with distance held <b>' + f2(B[1]) + '</b>';
        else if (step === 12) st = 'R² = ' + f1(SSR) + ' ÷ ' + f1(SST) + ' = <b>' + f2(R2) + '</b>';
        else if (step === 13) st = f2(B[0]) + ' + ' + f2(B[1]) + '×9 − ' + f2(-B[2]) + '×3 = <b>' + f1(YP) + '</b>';
        else if (step === 15) st = 'F = <b>' + f1(FV) + '</b> on 2 and 9 df · p = <b>' + pt(PF) + '</b>';
        else if (step === 16) st = 'here VIF = <b>' + f2(VIF) + '</b> (fine) · worry above 5 to 10';
        setStats(st);
    }
    // ---------- camera ----------
    var ISO = [[15.5, 8.8, 10], [4.6, 2.4, -4.4], -1.6], NEAR = [[15, 8.6, 9.5], [5.2, 2.9, -4.0], -1.4], FRONT = [[4.6, 3.4, 13.5], [4.6, 2.9, -4.4], -1.2];
    var SIDE = [[25, 4, -5.6], [4.6, 2.9, -5.6], 0], TOP = [[4.6, 17.5, -1.2], [4.6, 0, -4.4], -1.6], MET = [[18.5, 9.8, 11.5], [7.2, 2.6, -3.4], -1.6];
    var CAM = [ISO, ISO, FRONT, SIDE, TOP, ISO, MET, MET, NEAR, NEAR, FRONT, [[13.5, 8.8, 9.5], [2.6, 2.4, -4.4], -1.4], MET, ISO, ISO, MET, ISO, FRONT, ISO];
    var tw = null;
    function preset(s) {
        var p = new THREE.Vector3().fromArray(CAM[s][0]), tg = new THREE.Vector3().fromArray(CAM[s][1]);
        var kk = Math.min(2.8, Math.max(1, 1.55 / camera.aspect));
        var out = { p: tg.clone().add(p.sub(tg).multiplyScalar(kk)), t: tg };
        if (camera.aspect > 1.25) { var off = CAM[s][2] === undefined ? 2.2 : CAM[s][2]; out.p.x -= off; out.t.x -= off; }   // keep the wall clear of the story panel
        return out;
    }
    function flyTo(s, instant) {
        var d = preset(s);
        if (instant) { camera.position.copy(d.p); controls.target.copy(d.t); tw = null; return; }
        tw = { p0: camera.position.clone(), t0: controls.target.clone(), p1: d.p, t1: d.t, x: 0 };
    }
    controls.addEventListener('start', function () { tw = null; });

    // ---------- ui ----------
    var segs = [], parts = ["fY", "fB0", "fB1", "fX1", "fB2", "fX2"];
    STEPS.forEach(function (st, i) {
        var bt = document.createElement('button'); bt.title = (i + 1) + '. ' + st.t; bt.setAttribute('aria-label', 'Step ' + (i + 1) + ': ' + st.t);
        bt.innerHTML = '<span><i></i></span>'; bt.onclick = function () { go(i); };
        $('progress').appendChild(bt); segs.push(bt.querySelector('i'));
    });
    function showStep() {
        var st = STEPS[step];
        $('chapter').textContent = 'Step ' + (step + 1) + ' of ' + NS;
        $('status').textContent = st.t; $('note').textContent = st.n; $('stats').innerHTML = st.s;
        parts.forEach(function (id) { $(id).classList.toggle('on', st.on.indexOf(id) >= 0); });
    }
    function setPlay(p) {
        playing = p;
        $('playIcon').setAttribute('d', p ? 'M3 1h3v12H3zM8 1h3v12H8z' : 'M3 1v12l9-6z');
    }
    function go(s) { step = Math.max(0, Math.min(NS - 1, s)); u = 0; showStep(); flyTo(step); setPlay(true); }
    $('bPrev').onclick = function () { go(u > 0.15 || step === 0 ? step : step - 1); };
    $('bNext').onclick = function () { if (step < NS - 1) go(step + 1); else { u = 1; } };
    $('bRestart').onclick = function () { go(0); };
    $('bPlay').onclick = function () { if (!playing && step === NS - 1 && u >= 1) go(0); else setPlay(!playing); };
    window.addEventListener('keydown', function (e) {
        if (e.key === 'ArrowRight') $('bNext').onclick();
        else if (e.key === 'ArrowLeft') $('bPrev').onclick();
        else if (e.key === ' ' && e.target === document.body) { e.preventDefault(); $('bPlay').onclick(); }
    });

    function resize() {
        var w = window.innerWidth, h = window.innerHeight;
        renderer.setSize(w, h); camera.aspect = w / h; camera.updateProjectionMatrix();
    }
    window.addEventListener('resize', resize); resize();
    showStep(); setPlay(playing); flyTo(0, true);
    if (!playing) u = 1;      // reduced motion: show each step finished, advance by hand

    var v3 = new THREE.Vector3(), last = performance.now();
    function frame(now) {
        requestAnimationFrame(frame);
        var dt = Math.min(0.1, (now - last) / 1000); last = now; clock += dt;
        if (playing) {
            u += dt / (DUR + HOLD);
            if (u >= 1) { if (step < NS - 1) { step++; u = 0; showStep(); flyTo(step); } else { u = 1; setPlay(false); } }
        }
        T = step + Math.min(u * (DUR + HOLD) / DUR, 0.9999);
        update();
        if (tw) {
            tw.x = Math.min(1, tw.x + dt / 1.5); var e = tw.x * tw.x * (3 - 2 * tw.x);
            camera.position.lerpVectors(tw.p0, tw.p1, e); controls.target.lerpVectors(tw.t0, tw.t1, e);
            if (tw.x >= 1) tw = null;
        }
        controls.update();
        renderer.render(scene, camera);

        for (var i = 0; i < segs.length; i++) segs[i].style.width = (i < step ? 100 : i === step ? u * 100 : 0) + '%';
        var w = window.innerWidth, h = window.innerHeight;
        for (i = 0; i < labels.length; i++) {
            var lb = labels[i];
            v3.copy(lb.p).project(camera);
            var show = lb.a > 0.01 && v3.z < 1 && v3.z > -1;
            lb.el.style.opacity = show ? lb.a : 0;
            if (show) lb.el.style.transform = 'translate(' + ((v3.x + 1) / 2 * w).toFixed(1) + 'px,' + ((1 - v3.y) / 2 * h).toFixed(1) + 'px) translate(' + (lb.left ? '0' : '-50%') + ',-50%)';
        }
    }
    requestAnimationFrame(frame);
})();
</script>
