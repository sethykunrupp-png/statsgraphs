<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kurtosis in 4D</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
    /* Layout: full-screen 3D stage, story panel (with the live formula) top-left, step bar along the bottom. Single dark look by design. */
    :root {
        --bg: #050510;
        --cyan: #00ffff;
        --amber: #ffb454;
        --ink: #e9f6ff;
        --muted: #8fb3c7;
        --panel: rgba(4, 8, 22, 0.78);
        --line: rgba(0, 255, 255, 0.35);
        color-scheme: dark;
    }
    html, body { height: 100%; }
    body { margin: 0; overflow: hidden; background: var(--bg); color: var(--ink);
           font-family: 'IBM Plex Sans', 'Segoe UI', system-ui, sans-serif; font-variant-numeric: tabular-nums; }
    canvas { display: block; position: fixed; inset: 0; touch-action: none; }

    #ui { position: absolute; top: calc(16px + env(safe-area-inset-top, 0px)); left: 16px;
          width: min(410px, calc(100% - 32px)); box-sizing: border-box;
          background: var(--panel); padding: 14px 16px 15px; border-radius: 10px;
          border: 1px solid var(--line); box-shadow: 0 0 24px rgba(0,255,255,0.12);
          backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
          pointer-events: none; z-index: 10; }
    #chapter { font-size: 12px; color: var(--muted); margin-bottom: 4px; letter-spacing: 0.04em; text-transform: uppercase; }
    #status { font-size: clamp(18px, 2.6vw, 23px); font-weight: 600; line-height: 1.2; margin-bottom: 7px;
              color: var(--cyan); text-shadow: 0 0 12px rgba(0,255,255,0.55); text-wrap: balance; }
    #note { font-size: 13.5px; line-height: 1.5; opacity: 0.92; }
    #mathrow { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; margin-top: 9px; padding-top: 9px;
               border-top: 1px solid rgba(0,255,255,0.18); }
    #formula { display: flex; align-items: center; gap: 7px; font-family: Georgia, 'Times New Roman', serif; font-style: italic; font-size: 21px; flex: none; }
    #formula .frac { display: inline-flex; flex-direction: column; align-items: center; }
    #formula .top { padding: 0 6px 2px; border-bottom: 1.5px solid var(--ink); }
    #formula .bot { padding-top: 1px; }
    #formula .bar { text-decoration: overline; }
    #formula .p { opacity: 0.3; transition: opacity 0.4s, color 0.4s, text-shadow 0.4s; }
    #formula .p.on { opacity: 1; color: var(--amber); text-shadow: 0 0 10px rgba(255,180,84,0.6); }
    #formula .sym { opacity: 0.6; font-style: normal; }
    #stats { font-size: 13.5px; line-height: 1.5; font-weight: 500; color: var(--amber); flex: 1 1 150px; min-width: 0; }
    #stats .dim { color: var(--muted); font-weight: 400; }
    #error { color: #ff5c5c; font-weight: 600; font-size: 13px; }
    #error:empty { display: none; }

    #labels { position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 5; }
    .lb { position: absolute; left: 0; top: 0; white-space: nowrap; font-size: 13px; font-weight: 500;
          color: var(--ink); text-shadow: 0 0 4px #050510, 0 0 8px #050510, 0 1px 2px #050510; will-change: transform, opacity; }
    .lb.tick { font-size: 11px; color: var(--muted); font-weight: 400; }
    .lb.eq { color: var(--amber); font-weight: 600; font-size: 14px; }
    .lb.key { color: var(--cyan); font-weight: 600; font-size: 15px; }

    #bar { position: absolute; left: 0; right: 0; bottom: 0; z-index: 10;
           padding: 10px 16px calc(12px + env(safe-area-inset-bottom, 0px));
           background: linear-gradient(to top, rgba(5,5,16,0.92), rgba(5,5,16,0)); }
    #progress { display: flex; gap: 3px; margin-bottom: 8px; }
    #progress button { flex: 1; height: 18px; padding: 6px 0; margin: 0; border: 0; background: none; cursor: pointer; }
    #progress button span { display: block; height: 4px; border-radius: 2px; background: rgba(0,255,255,0.16); overflow: hidden; }
    #progress button i { display: block; height: 100%; width: 0; background: var(--cyan); box-shadow: 0 0 8px var(--cyan); }
    #progress button:hover span { background: rgba(0,255,255,0.32); }
    #controls { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    #controls button { width: 40px; height: 34px; border-radius: 8px; border: 1px solid var(--line);
                       background: var(--panel); color: var(--cyan); cursor: pointer; display: grid; place-items: center; }
    #controls button:hover { background: rgba(0,255,255,0.14); }
    button:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }
    #controls svg { width: 14px; height: 14px; fill: currentColor; }
    #hint { font-size: 12px; color: var(--muted); margin-left: 6px; }
    @media (max-width: 560px) {
        #ui { padding: 10px 12px 11px; }
        #note { font-size: 12.5px; line-height: 1.4; }
        #mathrow { margin-top: 6px; padding-top: 6px; gap: 10px; }
        #formula { font-size: 17px; }
        #stats { font-size: 12.5px; }
        #hint { display: none; }
    }
</style>
</head>
<body>
<div id="labels"></div>

<div id="ui">
    <div id="chapter"></div>
    <div id="status"></div>
    <div id="note"></div>
    <div id="mathrow">
        <div id="formula" aria-label="Excess kurtosis equals one over n times the sum of Z to the fourth, minus 3">
            <span class="p" id="fK" style="font-style:normal;font-size:0.8em">Excess kurt</span><span class="sym">=</span>
            <span class="frac"><span class="top"><span class="p" id="fN">1</span></span><span class="bot"><span class="p" id="fN2">n</span></span></span>
            <span class="p" id="fSum" style="font-style:normal">Σ</span><span class="p" id="fZ">Z<sup style="font-size:0.6em">4</sup></span><span class="p" id="fRef" style="font-style:normal">− 3</span>
        </div>
        <div id="stats"></div>
    </div>
    <div id="error"></div>
</div>

<div id="bar">
    <div id="progress"></div>
    <div id="controls">
        <button id="bPrev" title="Previous step" aria-label="Previous step"><svg viewBox="0 0 14 14"><path d="M2 1h2v12H2zM13 1v12L5 7z"/></svg></button>
        <button id="bPlay" title="Play or pause" aria-label="Play or pause"><svg viewBox="0 0 14 14"><path id="playIcon" d="M3 1h3v12H3zM8 1h3v12H8z"/></svg></button>
        <button id="bNext" title="Next step" aria-label="Next step"><svg viewBox="0 0 14 14"><path d="M10 1h2v12h-2zM1 1v12l8-6z"/></svg></button>
        <button id="bRestart" title="Start again" aria-label="Start again"><svg viewBox="0 0 14 14"><path d="M7 2a5 5 0 1 0 4.9 6h-1.6A3.5 3.5 0 1 1 7 3.5c1 0 1.8.4 2.4 1L7.5 6.5H12V2l-1.5 1.5A5 5 0 0 0 7 2z"/></svg></button>
        <span id="hint">Drag to rotate · scroll to zoom · ← → to step · space to pause</span>
    </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
(function () {
    'use strict';
    var $ = function (id) { return document.getElementById(id); };
    if (!window.THREE || !THREE.OrbitControls) { $('error').textContent = 'The 3D library did not load. Check the connection and reload.'; return; }

    // ---------- the sample (same six values as the other animations) ----------
    var P = 4, KURT = P === 4;                   // power: 3 = skewness, 4 = kurtosis
    var V = [1, 4, 5, 8, 8, 10], N = V.length;
    var MV = 5, TV = 20, AX = 20;       // the point that moves in the last step, where it goes, axis length
    var COL = ['#ff5c8a', '#ff9f43', '#ffe066', '#5cff9d', '#4dd2ff', '#b388ff'], NEG = '#4dd2ff', POS = '#ffb454';
    var rowY = function (i) { return 6 - i; };
    var U = 1.5, CX = AX + 2;                        // world units per 1 Z, and where carried lines are listed
    var B = KURT ? 3 : 2.25, HS = U * U * U / (B * B);   // tower base side; height per unit of volume (volume is preserved)
    var TXN = CX + 0.5, TXP = KURT ? CX + 2 : CX + 5, TZ = 9, SHX = TXP + B + 1.2;
    function slot(i) { return [CX + (i % 3) * 3.3, 1.5 + Math.floor(i / 3) * 3.5]; }
    var XB = '<span style="text-decoration:overline">X</span>';
    var sgn = function (d, dp) { var t = Math.abs(d).toFixed(dp === undefined ? 2 : dp); return (d > 0 && +t !== 0 ? '+' : d < 0 && +t !== 0 ? '−' : '') + t; };
    var num = function (x) { return (Math.round(x * 10) / 10).toString(); };

    var STEPS = [
        {
                "t": "What we already know",
                "n": "The same six measurements, with their mean (cyan line) and their standard deviation S, the white ruler.",
                "s": "",
                "on": []
        },
        {
                "t": "Turn every distance into a Z",
                "n": "Measure each point's distance from the mean in S rulers. Blue lines are below the mean, amber lines are above it.",
                "s": "",
                "on": [
                        "fZ"
                ]
        },
        {
                "t": "Carry the Z lines to the right",
                "n": "Set each Z line down on the right, top to bottom. Its length is how many standard deviations the point is from the mean.",
                "s": "",
                "on": [
                        "fZ"
                ]
        },
        {
                "t": "Raise each Z to the 4th power",
                "n": "Each line sweeps out a square, Z², then rises to a height of Z² again. The volume is Z⁴. Every sign vanishes, and far points dominate even more than with cubes.",
                "s": "",
                "on": [
                        "fZ"
                ]
        },
        {
                "t": "Add them up",
                "n": "Reshape every block to the same base and stack them. Nearly the whole tower comes from the two farthest points.",
                "s": "",
                "on": [
                        "fSum"
                ]
        },
        {
                "t": "Divide by n",
                "n": "Cut the tower into 6 equal shares. One share is the kurtosis.",
                "s": "",
                "on": [
                        "fN",
                        "fN2"
                ]
        },
        {
                "t": "Compare with 3",
                "n": "A bell curve always scores 3. Below 3 means lighter tails and fewer extreme values. Above 3 means heavier tails. The difference is the excess kurtosis.",
                "s": "",
                "on": [
                        "fK",
                        "fRef"
                ]
        },
        {
                "t": "Push one point far out",
                "n": "The highest value slides from 10 to 20 and becomes an outlier. Its block takes over the tower and the kurtosis climbs past 3.",
                "s": "",
                "on": [
                        "fK",
                        "fN",
                        "fN2",
                        "fSum",
                        "fZ",
                        "fRef"
                ]
        }
];
    var NS = STEPS.length, DUR = 8;

    // ---------- scene ----------
    var renderer;
    try { renderer = new THREE.WebGLRenderer({ antialias: true }); }
    catch (e) { $('error').textContent = 'This browser could not start 3D graphics (WebGL).'; return; }
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    renderer.setClearColor(0x050510, 1);
    document.body.insertBefore(renderer.domElement, document.body.firstChild);
    var scene = new THREE.Scene();
    scene.fog = new THREE.Fog(0x050510, 55, 130);
    var camera = new THREE.PerspectiveCamera(45, 1, 0.1, 300);
    var controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true; controls.dampingFactor = 0.08; controls.maxDistance = 100; controls.minDistance = 4;

    var grid = new THREE.GridHelper(70, 70, 0x0b4a5c, 0x0a2233);
    grid.position.set(15, -0.03, 6); scene.add(grid);

    function mat(color, opacity) {
        return new THREE.MeshBasicMaterial({ color: color, transparent: true, opacity: opacity === undefined ? 1 : opacity, side: THREE.DoubleSide, depthWrite: false });
    }
    var barGeo = new THREE.BoxGeometry(1, 0.1, 0.1);
    function bar(color, thick) { var m = new THREE.Mesh(barGeo, mat(color)); if (thick) { m.scale.y = m.scale.z = thick; } scene.add(m); return m; }
    function setBar(m, left, y, z, len) {
        m.visible = len > 0.001; m.scale.x = Math.max(len, 0.001); m.position.set(left + len / 2, y, z);
    }
    var postGeo = new THREE.BoxGeometry(0.06, 1, 0.06);
    function post(color) { var m = new THREE.Mesh(postGeo, mat(color)); scene.add(m); return m; }
    function setPost(m, x, z, h) { m.visible = h > 0.001; m.scale.y = Math.max(h, 0.001); m.position.set(x, h / 2 - 0.1, z); }
    var boxGeo = new THREE.BoxGeometry(1, 1, 1); boxGeo.translate(0.5, 0.5, 0.5);        // origin at the bottom corner
    function box(color, opacity) {
        var m = new THREE.Mesh(boxGeo, mat(color, opacity)); scene.add(m);
        var e = new THREE.LineSegments(new THREE.EdgesGeometry(boxGeo), new THREE.LineBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.55 })); m.add(e);
        return m;
    }

    var axis = bar('#3c6d80', 0.5); setBar(axis, -0.5, 0, 0, AX + 1);
    var tickGeo = new THREE.BoxGeometry(0.04, 0.3, 0.04);
    for (var k = 0; k <= AX; k++) { var tk = new THREE.Mesh(tickGeo, mat('#5d9ab3')); tk.position.set(k, 0, 0); scene.add(tk); }
    var guides = [];
    for (var i = 0; i < N; i++) { var g = bar('#12303d', 0.2); setBar(g, -0.5, rowY(i), -0.02, AX + 1); guides.push(g); }

    var sph = new THREE.SphereGeometry(0.22, 24, 16), pts = [], dev = [], car = [], boxes = [];
    for (i = 0; i < N; i++) {
        var p = new THREE.Mesh(sph, mat(COL[i])); scene.add(p); pts.push(p);
        dev.push(bar(POS)); car.push(bar(POS, 1.3)); boxes.push(box(POS, 0.8));
    }
    var meanLine = post('#00ffff'); meanLine.scale.x = meanLine.scale.z = 1.4;
    var sdRuler = bar('#ffffff', 1.5);
    var plates = []; for (k = 0; k < N; k++) { var pl = new THREE.Mesh(boxGeo, mat('#ffffff', 0)); scene.add(pl); plates.push(pl); }
    var hi = box('#ffffff', 0), shareBox = box(POS, 0.85), refBox = box('#ffffff', 0);

    // ---------- labels ----------
    var labelBox = $('labels'), labels = [];
    function label(text, x, y, z, cls, left) {
        var el = document.createElement('div'); el.className = 'lb' + (cls ? ' ' + cls : ''); el.textContent = text;
        labelBox.appendChild(el);
        var o = { el: el, p: new THREE.Vector3(x, y, z), a: 0, txt: text, left: !!left }; labels.push(o); return o;
    }
    function setText(lb, t) { if (lb.txt !== t) { lb.txt = t; lb.el.textContent = t; } }
    for (k = 0; k <= AX; k += 2) label(String(k), k, -0.5, 0, 'tick').a = 0.8;
    var lbVal = V.map(function () { return label('', 0, 0, 0); });
    var lbZ = V.map(function () { return label('', 0, 0, 0, 'eq'); });
    var lbV = V.map(function () { return label('', 0, 0, 0, 'eq'); });
    var lbMean = label('', 0, 8.0, 0, 'key'), lbS = label('', 0, 6.9, 0, 'key', true);
    var lbNeg = label('', 0, 0, TZ + B / 2, 'key'), lbPos = label('', 0, 0, TZ + B / 2, 'key');
    var lbShare = label('', 0, 0, TZ + B / 2, 'eq', true);
    var lbRes = label('', SHX + B / 2, 0, TZ + B / 2, 'key'); lbRes.el.style.fontSize = '18px';
    var lbRef = label('bell curve = 3', SHX + B + 0.6 + B / 2, 3 * HS + 0.9, TZ + B / 2, '');
    var lbTail = label('', 0, 0, 0, 'key');

    // ---------- timeline ----------
    var step = 0, u = 0, playing = !window.matchMedia('(prefers-reduced-motion: reduce)').matches, T = 0, clock = 0;
    function ph(a, b) { var x = (T - a) / (b - a); x = x < 0 ? 0 : x > 1 ? 1 : x; return x * x * (3 - 2 * x); }
    function lerp(a, b, t) { return a + (b - a) * t; }
    function setStats(h) { if ($('stats').innerHTML !== h) $('stats').innerHTML = h; }
    var NAME = KURT ? 'kurtosis' : 'skewness', PW = KURT ? '⁴' : '³';

    function update() {
        var i, k;
        // the data, live: one point moves in the last step
        var x = V.slice(); x[MV] = lerp(V[MV], TV, ph(7.15, 7.85));
        var m = 0; for (i = 0; i < N; i++) m += x[i] / N;
        var S = 0; for (i = 0; i < N; i++) S += (x[i] - m) * (x[i] - m) / N; S = Math.sqrt(S);
        var z = x.map(function (v) { return (v - m) / S; }), v = z.map(function (q) { return Math.pow(q, P); });
        var tot = 0, negV = 0, posV = 0;
        for (i = 0; i < N; i++) { tot += v[i]; if (v[i] < 0) negV -= v[i]; else posV += v[i]; }
        var stat = tot / N;

        for (i = 0; i < N; i++) {
            var a = ph(0.05 + i * 0.07, 0.2 + i * 0.07);
            pts[i].position.set(x[i], rowY(i), 0); pts[i].scale.setScalar(Math.max(a, 0.001)); pts[i].visible = a > 0;
            lbVal[i].p.set(x[i] + (x[i] < m ? -0.6 : 0.6), rowY(i), 0); lbVal[i].a = a; setText(lbVal[i], num(x[i]));
            guides[i].material.opacity = a;
        }
        setPost(meanLine, m, 0, 7.6 * ph(0.5, 0.72)); lbMean.p.x = m; lbMean.a = ph(0.66, 0.76); setText(lbMean, 'X̄ = ' + num(m));
        var sg = ph(0.76, 0.92);
        setBar(sdRuler, m, 6.9, 0, S * sg); lbS.p.x = m + S + 0.3; lbS.a = sg; setText(lbS, 'S = ' + num(S));

        var baseN = 0, baseP = 0;
        for (i = 0; i < N; i++) {
            var o = i * 0.15, d = x[i] - m, neg = d < 0, col = neg ? NEG : POS, y = rowY(i), sl = slot(i);
            // deviation, measured in S
            var grow = ph(1.05 + i * 0.13, 1.17 + i * 0.13), c = ph(2.05 + o, 2.19 + o), gl = Math.abs(d) * grow;
            setBar(dev[i], neg ? m - gl : m, y, 0, gl); dev[i].material.color.set(col); dev[i].material.opacity = 1 - 0.6 * c;
            lbZ[i].p.set(x[i], y + 0.47, 0); lbZ[i].a = grow; setText(lbZ[i], 'Z = ' + sgn(z[i]));
            // carried line, then the shape it grows into
            var dr = ph(3.05 + o, 3.11 + o), sq = ph(3.11 + o, 3.16 + o), up = ph(3.16 + o, 3.22 + o), t = ph(4.1 + i * 0.1, 4.4 + i * 0.1);
            var s = U * Math.abs(z[i]), h = KURT ? U * z[i] * z[i] : s;
            setBar(car[i], lerp(lerp(Math.min(x[i], m), CX, c), sl[0], dr), lerp(y, 0.06, dr), lerp(0, sl[1], dr), T >= 2.05 + o ? lerp(Math.abs(d), s, c) : 0);
            car[i].material.color.set(col); car[i].material.opacity = 1 - ph(3.95, 4.05);
            var left = neg && !KURT, hh = Math.abs(v[i]) * HS, base = left ? baseN : baseP;
            if (left) baseN += hh; else baseP += hh;
            var bx = boxes[i];
            bx.visible = sq > 0; bx.material.color.set(KURT ? POS : col);
            bx.scale.set(Math.max(lerp(s, B, t), 0.01), Math.max(lerp(Math.max(h * up, 0.03), hh, t), 0.01), Math.max(lerp(s * sq, B, t), 0.01));
            bx.position.set(lerp(sl[0], left ? TXN : TXP, t), lerp(0, base, t) + Math.sin(Math.PI * t) * 1.5, lerp(sl[1], TZ, t));
            lbV[i].p.set(bx.position.x + bx.scale.x / 2, bx.position.y + bx.scale.y + 0.4, bx.position.z + bx.scale.z / 2);
            lbV[i].a = up * (1 - ph(4.02, 4.12)); setText(lbV[i], sgn(v[i]));
        }

        // tower totals
        var Hn = negV * HS, Hp = posV * HS, ta = ph(4.88, 4.98);
        lbNeg.p.set(TXN + B / 2, Hn + 0.5, TZ + B / 2); lbNeg.a = KURT ? 0 : ta; setText(lbNeg, 'negative: ' + sgn(-negV));
        lbPos.p.set(TXP + B / 2, Hp + 0.5, TZ + B / 2); lbPos.a = ta; setText(lbPos, KURT ? 'sum = ' + posV.toFixed(2) : 'positive: ' + sgn(posV));

        // divide what is left by n
        var tx = !KURT && Hn > Hp ? TXN : TXP, lo = KURT ? 0 : Math.min(Hn, Hp), top = KURT ? Hp : Math.max(Hn, Hp), sh = (top - lo) / N;
        var pg = ph(5.15, 5.45), hg = ph(5.5, 5.75);
        for (k = 0; k < N; k++) {
            var pl = plates[k]; pl.visible = pg > 0; pl.material.opacity = (k === 0 ? 0.8 : 0.4) * pg;
            pl.scale.set(B + 0.2, 0.025, B + 0.2); pl.position.set(tx - 0.1, lo + k * sh, TZ - 0.1);
        }
        hi.visible = hg > 0; hi.material.opacity = 0.38 * hg; hi.scale.set(B + 0.1, Math.max(sh, 0.01), B + 0.1); hi.position.set(tx - 0.05, top - sh, TZ - 0.05);
        lbShare.p.set(tx + B + 0.4, top - sh / 2, TZ + B / 2); lbShare.a = ph(5.6, 5.75) * (1 - ph(6.05, 6.15)); setText(lbShare, 'one share = ' + (KURT ? stat.toFixed(2) : sgn(stat)));

        // the result, set down beside the towers
        var f6 = ph(6.1, 6.6), rh = Math.max(Math.abs(stat) * HS, 0.02);
        shareBox.visible = T >= 6.1; shareBox.material.color.set(KURT || stat >= 0 ? POS : NEG);
        shareBox.scale.set(B, rh, B); shareBox.position.set(lerp(tx, SHX, f6), lerp(top - sh, 0, f6) + Math.sin(Math.PI * f6) * 1.2, TZ);
        lbRes.p.y = rh + 0.55; lbRes.a = ph(6.55, 6.7); setText(lbRes, NAME + ' = ' + (KURT ? stat.toFixed(2) : sgn(stat)));
        var rg = KURT ? ph(6.3, 6.6) : 0;
        refBox.visible = rg > 0; refBox.material.opacity = 0.22 * rg; refBox.scale.set(B, 3 * HS, B); refBox.position.set(SHX + B + 0.6, 0, TZ); lbRef.a = rg;
        var tl = ph(6.7, 6.85); lbTail.a = tl;
        if (KURT) { lbTail.p.set(SHX + B + 0.3, 0.1, TZ + B + 1.1); setText(lbTail, 'excess = ' + stat.toFixed(2) + ' − 3 = ' + sgn(stat - 3)); }
        else { lbTail.p.set(m + (stat < 0 ? -2.6 : 2.6), -1.25, 0); setText(lbTail, Math.abs(stat) < 0.03 ? 'balanced' : stat < 0 ? '← longer tail on the left' : 'longer tail on the right →'); }

        // the running numbers in the panel
        var list = function (arr) { return arr.map(function (q) { return sgn(q); }).join(', '); }, h2;
        if (step === 0) h2 = XB + ' = 6 · S = 3';
        else if (step === 1) h2 = 'Z = (X − ' + XB + ') ÷ S';
        else if (step === 2) h2 = 'Z: ' + list(z);
        else if (step === 3) h2 = 'Z' + PW + ': ' + list(v);
        else if (step === 4) h2 = KURT ? 'sum of Z⁴ = <b>' + tot.toFixed(2) + '</b>' : sgn(-negV) + ' ' + sgn(posV) + ' = <b>' + sgn(tot) + '</b>';
        else if (step === 5) h2 = (KURT ? tot.toFixed(2) : sgn(tot)) + ' ÷ 6 = <b>' + (KURT ? stat.toFixed(2) : sgn(stat)) + '</b>';
        else if (step === 6) h2 = (KURT ? 'kurtosis = <b>' + stat.toFixed(2) + '</b> · excess = <b>' + sgn(stat - 3) + '</b>' : 'skewness = <b>' + sgn(stat) + '</b>') + ' <span class="dim">(Excel adds a small-sample correction)</span>';
        else h2 = 'X = ' + num(x[MV]) + ' → ' + NAME + ' = <b>' + (KURT ? stat.toFixed(2) + '</b> · excess ' + sgn(stat - 3) : sgn(stat) + '</b>');
        setStats(h2);
    }

    // ---------- camera ----------
    var WALL = [[AX / 2, 5, 12 + AX * 0.5], [AX / 2, 3.4, 0]], CARRY = [[AX / 2 + 3, 6.5, 15 + AX * 0.6], [AX / 2 + 3, 3.2, 0]],
        SHAPES = [[CX + 4, 11, 19], [CX + 4.5, 1.5, 4]], TOWERS = [[CX + 5, 9, 26], [CX + 5.5, 2.4, 9]], ALL = [[(SHX + 2 * B + 1) / 2, 14, 24 + AX * 0.85], [(SHX + 2 * B + 1) / 2, 1.2, 5]];
    var CAM = [WALL, WALL, CARRY, SHAPES, TOWERS, TOWERS, TOWERS, ALL];
    var tw = null;
    function preset(s) {
        var p = new THREE.Vector3().fromArray(CAM[s][0]), tg = new THREE.Vector3().fromArray(CAM[s][1]);
        var kk = Math.min(2.8, Math.max(1, 1.55 / camera.aspect));
        var out = { p: tg.clone().add(p.sub(tg).multiplyScalar(kk)), t: tg };
        if (camera.aspect > 1.25) { var off = CAM[s] === ALL ? 1.5 : 2.2; out.p.x -= off; out.t.x -= off; }   // keep the wall clear of the story panel
        return out;
    }
    function flyTo(s, instant) {
        var d = preset(s);
        if (instant) { camera.position.copy(d.p); controls.target.copy(d.t); tw = null; return; }
        tw = { p0: camera.position.clone(), t0: controls.target.clone(), p1: d.p, t1: d.t, x: 0 };
    }
    controls.addEventListener('start', function () { tw = null; });

    // ---------- ui ----------
    var segs = [], parts = ["fK", "fN", "fN2", "fSum", "fZ", "fRef"];
    STEPS.forEach(function (st, i) {
        var bt = document.createElement('button'); bt.title = (i + 1) + '. ' + st.t; bt.setAttribute('aria-label', 'Step ' + (i + 1) + ': ' + st.t);
        bt.innerHTML = '<span><i></i></span>'; bt.onclick = function () { go(i); };
        $('progress').appendChild(bt); segs.push(bt.querySelector('i'));
    });
    function showStep() {
        var st = STEPS[step];
        $('chapter').textContent = 'Step ' + (step + 1) + ' of ' + NS;
        $('status').textContent = st.t; $('note').textContent = st.n; $('stats').innerHTML = st.s;
        parts.forEach(function (id) { $(id).classList.toggle('on', st.on.indexOf(id) >= 0); });
    }
    function setPlay(p) {
        playing = p;
        $('playIcon').setAttribute('d', p ? 'M3 1h3v12H3zM8 1h3v12H8z' : 'M3 1v12l9-6z');
    }
    function go(s) { step = Math.max(0, Math.min(NS - 1, s)); u = 0; showStep(); flyTo(step); setPlay(true); }
    $('bPrev').onclick = function () { go(u > 0.15 || step === 0 ? step : step - 1); };
    $('bNext').onclick = function () { if (step < NS - 1) go(step + 1); else { u = 1; } };
    $('bRestart').onclick = function () { go(0); };
    $('bPlay').onclick = function () { if (!playing && step === NS - 1 && u >= 1) go(0); else setPlay(!playing); };
    window.addEventListener('keydown', function (e) {
        if (e.key === 'ArrowRight') $('bNext').onclick();
        else if (e.key === 'ArrowLeft') $('bPrev').onclick();
        else if (e.key === ' ' && e.target === document.body) { e.preventDefault(); $('bPlay').onclick(); }
    });

    function resize() {
        var w = window.innerWidth, h = window.innerHeight;
        renderer.setSize(w, h); camera.aspect = w / h; camera.updateProjectionMatrix();
    }
    window.addEventListener('resize', resize); resize();
    showStep(); setPlay(playing); flyTo(0, true);
    if (!playing) u = 1;      // reduced motion: show each step finished, advance by hand

    var v3 = new THREE.Vector3(), last = performance.now();
    function frame(now) {
        requestAnimationFrame(frame);
        var dt = Math.min(0.1, (now - last) / 1000); last = now; clock += dt;
        if (playing) {
            u += dt / DUR;
            if (u >= 1) { if (step < NS - 1) { step++; u = 0; showStep(); flyTo(step); } else { u = 1; setPlay(false); } }
        }
        T = step + Math.min(u, 0.9999);
        update();
        if (tw) {
            tw.x = Math.min(1, tw.x + dt / 1.5); var e = tw.x * tw.x * (3 - 2 * tw.x);
            camera.position.lerpVectors(tw.p0, tw.p1, e); controls.target.lerpVectors(tw.t0, tw.t1, e);
            if (tw.x >= 1) tw = null;
        }
        controls.update();
        renderer.render(scene, camera);

        for (var i = 0; i < segs.length; i++) segs[i].style.width = (i < step ? 100 : i === step ? u * 100 : 0) + '%';
        var w = window.innerWidth, h = window.innerHeight;
        for (i = 0; i < labels.length; i++) {
            var lb = labels[i];
            v3.copy(lb.p).project(camera);
            var show = lb.a > 0.01 && v3.z < 1 && v3.z > -1;
            lb.el.style.opacity = show ? lb.a : 0;
            if (show) lb.el.style.transform = 'translate(' + ((v3.x + 1) / 2 * w).toFixed(1) + 'px,' + ((1 - v3.y) / 2 * h).toFixed(1) + 'px) translate(' + (lb.left ? '0' : '-50%') + ',-50%)';
        }
    }
    requestAnimationFrame(frame);
})();
</script>
</body>
</html>
